<body>
<canvas id="bfx-world"></canvas>
<noscript><div id="bfx-noscript">Blufox Overdrive needs JavaScript enabled.</div></noscript>
<script>
/* ===== content.js ===== */
/* =============================================================================
   BLUFOX OVERDRIVE  —  content.js   (FILE 1 of 7)
   Exports:  BFX.PATH  (arc-length spline sampler)   and   BFX.C  (all game data)

   Pure data + pure math. No GL, no DOM, no timers, no allocation at load time
   beyond the literals below. Runs unmodified in node and in the browser.

   CONVENTIONS (the rest of the game depends on these):
     +Y up, right-handed. yaw 0 -> +Z, forward = [sin(yaw),0,cos(yaw)],
     right = [cos(yaw),0,-sin(yaw)] = normalize(cross(UP, fwd)).
     1 unit = 1 meter. Angles in radians. Colors [r,g,b] 0..1.

     BANK SIGN: `bank` is a roll of the road frame about `fwd`, applied with the
     standard right-handed Rodrigues rotation:
         right = right0*cos(b) + up0*sin(b)
         up    = up0*cos(b)    - right0*sin(b)
     so POSITIVE bank raises the RIGHT edge of the road (good banking for a
     LEFT-hand corner) and negative bank raises the left edge (right-hand
     corner). The shipped node data follows bank ~= -K * curvature, so every
     corner is already banked the correct way; consumers only ever need the
     orthonormal {fwd,right,up} frame returned by sample().

     CURVATURE SIGN: curv > 0 means the centerline is turning RIGHT.
============================================================================= */
(function () {
  'use strict';

  var root = (typeof window !== 'undefined') ? window
           : (typeof globalThis !== 'undefined') ? globalThis
           : this;
  var BFX = (root.BFX = root.BFX || {});

  /* ------------------------------------------------------------------ utils */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  /* =========================================================================
     BFX.PATH — closed-loop Catmull-Rom centerline, arc-length parameterized,
     with an O(1) spatial-hash nearest() query.
     ========================================================================= */
  var PATH = {};
  PATH.version = '1.0.0';

  /* Centripetal (alpha = 0.5) Catmull-Rom keeps hand-placed, unevenly spaced
     nodes free of cusps and self-intersections inside a segment. We interpolate
     a 5-vector [x, y, z, halfWidth, bank] with knots derived from the 3D
     distances so width/bank vary in sync with geometry. */
  var A1 = new Float64Array(5), A2 = new Float64Array(5), A3 = new Float64Array(5),
      B1 = new Float64Array(5), B2 = new Float64Array(5);

  function mix5(dst, P, Q, wp, wq) {
    dst[0] = P[0] * wp + Q[0] * wq; dst[1] = P[1] * wp + Q[1] * wq;
    dst[2] = P[2] * wp + Q[2] * wq; dst[3] = P[3] * wp + Q[3] * wq;
    dst[4] = P[4] * wp + Q[4] * wq;
  }

  function crEval(P0, P1, P2, P3, t0, t1, t2, t3, t, out) {
    var d;
    d = (t1 - t0) || 1e-9; mix5(A1, P0, P1, (t1 - t) / d, (t - t0) / d);
    d = (t2 - t1) || 1e-9; mix5(A2, P1, P2, (t2 - t) / d, (t - t1) / d);
    d = (t3 - t2) || 1e-9; mix5(A3, P2, P3, (t3 - t) / d, (t - t2) / d);
    d = (t2 - t0) || 1e-9; mix5(B1, A1, A2, (t2 - t) / d, (t - t0) / d);
    d = (t3 - t1) || 1e-9; mix5(B2, A2, A3, (t3 - t) / d, (t - t1) / d);
    d = (t2 - t1) || 1e-9; mix5(out, B1, B2, (t2 - t) / d, (t - t1) / d);
    return out;
  }

  function knotStep(a, b, alpha) {
    var dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
    var dd = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (!(dd > 1e-6)) dd = 1e-6;
    return Math.pow(dd, alpha);
  }

  /**
   * BFX.PATH.build(trackDef) -> path
   * Builds the arc-length table + acceleration grid. ~2-6 ms per track.
   */
  PATH.build = function build(trackDef) {
    try {
      return buildInner(trackDef);
    } catch (e) {
      // Never let a malformed track take the whole game down: hand back a
      // tiny valid circular fallback path so every consumer keeps working.
      try { if (typeof console !== 'undefined') console.warn('[BFX.PATH] build failed, using fallback', e); } catch (e2) {}
      return buildInner({
        nodes: [
          { p: [120, 0, 0], w: 10, bank: 0 }, { p: [85, 0, 85], w: 10, bank: 0 },
          { p: [0, 0, 120], w: 10, bank: 0 }, { p: [-85, 0, 85], w: 10, bank: 0 },
          { p: [-120, 0, 0], w: 10, bank: 0 }, { p: [-85, 0, -85], w: 10, bank: 0 },
          { p: [0, 0, -120], w: 10, bank: 0 }, { p: [85, 0, -85], w: 10, bank: 0 }
        ]
      });
    }
  };

  function buildInner(trackDef) {
    var nodes = (trackDef && trackDef.nodes) || [];
    var n = nodes.length;
    if (n < 4) throw new Error('need >= 4 nodes, got ' + n);

    // ---- pack nodes into 5-vectors -----------------------------------------
    var NV = [], i, k, nd, p;
    for (i = 0; i < n; i++) {
      nd = nodes[i]; p = (nd && nd.p) || [0, 0, 0];
      NV.push(new Float64Array([
        isNum(p[0]) ? p[0] : 0,
        isNum(p[1]) ? p[1] : 0,
        isNum(p[2]) ? p[2] : 0,
        isNum(nd.w) ? Math.max(2.5, nd.w) : 9,
        isNum(nd.bank) ? nd.bank : 0
      ]));
    }

    // ---- dense raw sampling of every segment (target ~0.5 m spacing) -------
    var ALPHA = 0.5;
    var raw = [];                       // flat: x,y,z,w,bank per 5 entries
    var tmp = new Float64Array(5), est = new Float64Array(5);
    var P0, P1, P2, P3, t0, t1, t2, t3, steps, s, u, tt;
    var ex, ey, ez, px, py, pz, segLen;

    for (i = 0; i < n; i++) {
      P0 = NV[(i - 1 + n) % n]; P1 = NV[i]; P2 = NV[(i + 1) % n]; P3 = NV[(i + 2) % n];
      t0 = 0;
      t1 = t0 + knotStep(P0, P1, ALPHA);
      t2 = t1 + knotStep(P1, P2, ALPHA);
      t3 = t2 + knotStep(P2, P3, ALPHA);

      // cheap length estimate with 10 probes
      segLen = 0; px = P1[0]; py = P1[1]; pz = P1[2];
      for (s = 1; s <= 10; s++) {
        tt = t1 + (t2 - t1) * (s / 10);
        crEval(P0, P1, P2, P3, t0, t1, t2, t3, tt, est);
        ex = est[0] - px; ey = est[1] - py; ez = est[2] - pz;
        segLen += Math.sqrt(ex * ex + ey * ey + ez * ez);
        px = est[0]; py = est[1]; pz = est[2];
      }
      steps = clamp(Math.ceil(segLen / 0.5), 8, 512);

      for (s = 0; s < steps; s++) {
        u = s / steps;
        tt = t1 + (t2 - t1) * u;
        crEval(P0, P1, P2, P3, t0, t1, t2, t3, tt, tmp);
        raw.push(tmp[0], tmp[1], tmp[2], tmp[3], tmp[4]);
      }
    }

    var R = raw.length / 5;
    if (R < 16) throw new Error('degenerate spline');

    // ---- cumulative arc length (closed) ------------------------------------
    var cum = new Float64Array(R + 1);
    var dx, dy, dz, d;
    for (i = 0; i < R; i++) {
      var j = (i + 1) % R;
      dx = raw[j * 5] - raw[i * 5];
      dy = raw[j * 5 + 1] - raw[i * 5 + 1];
      dz = raw[j * 5 + 2] - raw[i * 5 + 2];
      cum[i + 1] = cum[i] + Math.sqrt(dx * dx + dy * dy + dz * dz);
    }
    var L = cum[R];
    if (!(L > 1)) throw new Error('zero length path');

    // ---- uniform arc-length resample ---------------------------------------
    var M = clamp(Math.ceil(L / 0.45), 2048, 8192);
    var X = new Float64Array(M), Y = new Float64Array(M), Z = new Float64Array(M);
    var W = new Float32Array(M), BK = new Float32Array(M);
    var ds = L / M;
    var seg = 0, target, segA, segB, f;

    for (i = 0; i < M; i++) {
      target = i * ds;
      while (seg < R && cum[seg + 1] < target) seg++;
      if (seg >= R) seg = R - 1;
      segA = seg * 5; segB = ((seg + 1) % R) * 5;
      d = cum[seg + 1] - cum[seg];
      f = d > 1e-9 ? (target - cum[seg]) / d : 0;
      if (f < 0) f = 0; else if (f > 1) f = 1;
      X[i] = raw[segA] + (raw[segB] - raw[segA]) * f;
      Y[i] = raw[segA + 1] + (raw[segB + 1] - raw[segA + 1]) * f;
      Z[i] = raw[segA + 2] + (raw[segB + 2] - raw[segA + 2]) * f;
      W[i] = raw[segA + 3] + (raw[segB + 3] - raw[segA + 3]) * f;
      BK[i] = raw[segA + 4] + (raw[segB + 4] - raw[segA + 4]) * f;
    }

    // ---- unit tangents (central difference, wrapped) ------------------------
    var TX = new Float32Array(M), TY = new Float32Array(M), TZ = new Float32Array(M);
    var a, b, il;
    for (i = 0; i < M; i++) {
      a = (i - 1 + M) % M; b = (i + 1) % M;
      dx = X[b] - X[a]; dy = Y[b] - Y[a]; dz = Z[b] - Z[a];
      il = Math.sqrt(dx * dx + dy * dy + dz * dz);
      il = il > 1e-9 ? 1 / il : 0;
      TX[i] = dx * il; TY[i] = dy * il; TZ[i] = dz * il;
    }

    // ---- signed curvature, box-smoothed over ~4 m ---------------------------
    var CV = new Float32Array(M), CVs = new Float32Array(M);
    var rx, rz, rl;
    for (i = 0; i < M; i++) {
      a = (i - 1 + M) % M; b = (i + 1) % M;
      // horizontal right vector at i:  right0 = normalize(cross(UP, fwd))
      rx = TZ[i]; rz = -TX[i]; rl = Math.sqrt(rx * rx + rz * rz);
      if (rl > 1e-9) { rx /= rl; rz /= rl; } else { rx = 1; rz = 0; }
      dx = (TX[b] - TX[a]) / (2 * ds);
      dz = (TZ[b] - TZ[a]) / (2 * ds);
      CV[i] = dx * rx + dz * rz;
    }
    var half = Math.max(2, Math.round(2.0 / ds)), acc, c2;
    for (i = 0; i < M; i++) {
      acc = 0;
      for (k = -half; k <= half; k++) acc += CV[(i + k + M * 2) % M];
      CVs[i] = acc / (half * 2 + 1);
    }
    CV = CVs;

    // ---- spatial hash over the resampled centerline (built once) -----------
    var minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (i = 0; i < M; i++) {
      if (X[i] < minX) minX = X[i]; if (X[i] > maxX) maxX = X[i];
      if (Z[i] < minZ) minZ = Z[i]; if (Z[i] > maxZ) maxZ = Z[i];
    }
    var pad = 8;
    minX -= pad; minZ -= pad; maxX += pad; maxZ += pad;
    var CELL = 7.0;
    var nx = Math.max(1, Math.ceil((maxX - minX) / CELL));
    var nz = Math.max(1, Math.ceil((maxZ - minZ) / CELL));
    while (nx * nz > 262144) { CELL *= 1.5; nx = Math.max(1, Math.ceil((maxX - minX) / CELL)); nz = Math.max(1, Math.ceil((maxZ - minZ) / CELL)); }
    var NC = nx * nz;
    var counts = new Int32Array(NC + 1);
    var cellOf = new Int32Array(M);
    var cx, cz, ci;
    for (i = 0; i < M; i++) {
      cx = clamp(((X[i] - minX) / CELL) | 0, 0, nx - 1);
      cz = clamp(((Z[i] - minZ) / CELL) | 0, 0, nz - 1);
      ci = cz * nx + cx; cellOf[i] = ci; counts[ci + 1]++;
    }
    for (i = 0; i < NC; i++) counts[i + 1] += counts[i];
    var start = counts;                       // CSR offsets, length NC+1
    var items = new Int32Array(M);
    var cursor = new Int32Array(NC);
    for (i = 0; i < M; i++) { ci = cellOf[i]; items[start[ci] + cursor[ci]++] = i; }

    /* ------------------------------------------------------------------ API */
    var path = {};

    path.length = L;
    path.closed = true;
    path.count = M;
    path.spacing = ds;
    path.bounds = { minX: minX + pad, maxX: maxX - pad, minZ: minZ + pad, maxZ: maxZ - pad };
    path.trackId = (trackDef && trackDef.id) || null;
    // raw tables — handy for renderers/minimaps that want to walk the centerline
    path.X = X; path.Y = Y; path.Z = Z; path.W = W; path.BANK = BK; path.CURV = CV;

    function frameAt(i0, fr, out) {
      var i1 = (i0 + 1) % M, inv = 1 - fr;
      var fx = TX[i0] * inv + TX[i1] * fr,
          fy = TY[i0] * inv + TY[i1] * fr,
          fz = TZ[i0] * inv + TZ[i1] * fr;
      var fl = Math.sqrt(fx * fx + fy * fy + fz * fz);
      if (fl > 1e-9) { fx /= fl; fy /= fl; fz /= fl; } else { fx = 0; fy = 0; fz = 1; }
      // right0 = normalize(cross(UP, fwd)) -> horizontal
      var r0x = fz, r0z = -fx, r0l = Math.sqrt(r0x * r0x + r0z * r0z);
      if (r0l > 1e-9) { r0x /= r0l; r0z /= r0l; } else { r0x = 1; r0z = 0; }
      // up0 = cross(fwd, right0)   (right0 has no Y component)
      var u0x = fy * r0z;
      var u0y = fz * r0x - fx * r0z;
      var u0z = -fy * r0x;
      var ul = Math.sqrt(u0x * u0x + u0y * u0y + u0z * u0z);
      if (ul > 1e-9) { u0x /= ul; u0y /= ul; u0z /= ul; } else { u0x = 0; u0y = 1; u0z = 0; }
      var b = BK[i0] * inv + BK[i1] * fr, cb = Math.cos(b), sb = Math.sin(b);
      out.fwd[0] = fx; out.fwd[1] = fy; out.fwd[2] = fz;
      out.right[0] = r0x * cb + u0x * sb;
      out.right[1] = u0y * sb;
      out.right[2] = r0z * cb + u0z * sb;
      out.up[0] = u0x * cb - r0x * sb;
      out.up[1] = u0y * cb;
      out.up[2] = u0z * cb - r0z * sb;
      out.bank = b;
      return out;
    }

    function mkOut() {
      return { p: [0, 0, 0], fwd: [0, 0, 1], right: [1, 0, 0], up: [0, 1, 0], w: 9, bank: 0, curv: 0, t: 0 };
    }

    /**
     * sample(t [, out]) -> {p, fwd, right, up, w, bank, curv, t}
     * t wraps. Pass `out` (a previously returned object) to avoid allocation.
     */
    path.sample = function sample(t, out) {
      if (!isNum(t)) t = 0;
      t = t - Math.floor(t);
      out = out && out.p && out.fwd ? out : mkOut();
      var f = t * M, i0 = f | 0;
      if (i0 >= M) i0 = M - 1; if (i0 < 0) i0 = 0;
      var fr = f - i0, i1 = (i0 + 1) % M, inv = 1 - fr;
      out.p[0] = X[i0] * inv + X[i1] * fr;
      out.p[1] = Y[i0] * inv + Y[i1] * fr;
      out.p[2] = Z[i0] * inv + Z[i1] * fr;
      out.w = W[i0] * inv + W[i1] * fr;
      out.curv = CV[i0] * inv + CV[i1] * fr;
      out.t = t;
      frameAt(i0, fr, out);
      return out;
    };

    // scratch used by nearest() so the hot path allocates only the result
    var _ns = mkOut();

    function refine(bi, x, z) {
      // project the query onto the two polyline segments touching sample bi
      var best = Infinity, bfi = bi, i, j, ax, az, bx, bz, ex, ez, u, qx, qz, dd;
      for (i = bi - 1; i <= bi; i++) {
        j = ((i % M) + M) % M;
        var j2 = (j + 1) % M;
        ax = X[j]; az = Z[j]; bx = X[j2]; bz = Z[j2];
        ex = bx - ax; ez = bz - az;
        dd = ex * ex + ez * ez;
        u = dd > 1e-12 ? ((x - ax) * ex + (z - az) * ez) / dd : 0;
        if (u < 0) u = 0; else if (u > 1) u = 1;
        qx = ax + ex * u - x; qz = az + ez * u - z;
        dd = qx * qx + qz * qz;
        if (dd < best) { best = dd; bfi = j + u; }
      }
      return bfi;
    }

    /**
     * nearest(x, z [, hintT] [, y]) -> {t, lateral, dist, onRoad, w, y, curv, p}
     *
     * Grid-accelerated (never a global scan); correct on hairpins and wherever
     * the loop passes near itself. With only (x, z) it returns the true
     * geometric nearest point in the XZ plane.
     *
     * Two optional disambiguators, for the one place where XZ alone is
     * ambiguous — CHICAGO AFTERGLOW crosses over itself on a 13 m flyover at
     * t ~ 0.07 / 0.68:
     *   hintT : last known t for this kart. The search is restricted to a
     *           +-45 m window around it (and silently falls back to the global
     *           grid search if the query turns out to be nowhere near).
     *   y     : world height of the query. Candidates are scored with a 2.5x
     *           weighted height term, so a kart on the bridge cannot snap to
     *           the road underneath.
     * Pass either, both, or neither.
     */
    path.nearest = function nearest(x, z, hintT, y) {
      if (!isNum(x)) x = 0; if (!isNum(z)) z = 0;
      var bi = -1, bd = Infinity, i, k, idx, dx, dy, dz, dd;
      var useY = isNum(y), YK = 2.5;

      if (isNum(hintT)) {
        var hw = Math.max(8, Math.round(45 / ds));         // +-45 m window
        var h0 = Math.round((hintT - Math.floor(hintT)) * M);
        for (k = -hw; k <= hw; k++) {
          idx = ((h0 + k) % M + M) % M;
          dx = X[idx] - x; dz = Z[idx] - z; dd = dx * dx + dz * dz;
          if (useY) { dy = (Y[idx] - y) * YK; dd += dy * dy; }
          if (dd < bd) { bd = dd; bi = idx; }
        }
        if (bd > 2500) bi = -1;                            // >50 m: hint is stale
      }

      if (bi < 0) {
        var qcx = clamp(((x - minX) / CELL) | 0, 0, nx - 1);
        var qcz = clamp(((z - minZ) / CELL) | 0, 0, nz - 1);
        var maxR = Math.max(nx, nz), r, x0, x1, z0, z1, cxx, czz, s0, s1;
        for (r = 0; r <= maxR; r++) {
          // stop once no cell in this ring could beat the current best
          if (bi >= 0) { var ringMin = (r - 1) * CELL; if (ringMin > 0 && ringMin * ringMin > bd) break; }
          x0 = qcx - r; x1 = qcx + r; z0 = qcz - r; z1 = qcz + r;
          for (czz = z0; czz <= z1; czz++) {
            if (czz < 0 || czz >= nz) continue;
            var onZEdge = (czz === z0 || czz === z1);
            for (cxx = x0; cxx <= x1; cxx++) {
              if (cxx < 0 || cxx >= nx) continue;
              if (!onZEdge && cxx !== x0 && cxx !== x1) continue;   // ring only
              var c = czz * nx + cxx;
              s0 = start[c]; s1 = start[c + 1];
              for (i = s0; i < s1; i++) {
                idx = items[i];
                dx = X[idx] - x; dz = Z[idx] - z; dd = dx * dx + dz * dz;
                if (useY) { dy = (Y[idx] - y) * YK; dd += dy * dy; }
                if (dd < bd) { bd = dd; bi = idx; }
              }
            }
          }
        }
        if (bi < 0) {                                       // paranoid fallback
          for (i = 0; i < M; i++) {
            dx = X[i] - x; dz = Z[i] - z; dd = dx * dx + dz * dz;
            if (useY) { dy = (Y[i] - y) * YK; dd += dy * dy; }
            if (dd < bd) { bd = dd; bi = i; }
          }
        }
      }

      var fi = refine(bi, x, z);
      var t = fi / M; t = t - Math.floor(t);
      var s = path.sample(t, _ns);
      var ox = x - s.p[0], oz = z - s.p[2];
      // lateral is measured in the horizontal plane then un-projected through
      // the bank so that nearest(posAt(t, lat, 0)) round-trips to `lat`.
      var r0x = s.fwd[2], r0z = -s.fwd[0], r0l = Math.sqrt(r0x * r0x + r0z * r0z);
      if (r0l > 1e-9) { r0x /= r0l; r0z /= r0l; } else { r0x = 1; r0z = 0; }
      var cb = Math.cos(s.bank); if (cb < 0.3) cb = 0.3;
      var lateral = (ox * r0x + oz * r0z) / cb;
      var dist = Math.sqrt(ox * ox + oz * oz);
      return {
        t: t, lateral: lateral, dist: dist, onRoad: Math.abs(lateral) <= s.w,
        w: s.w, y: s.p[1], curv: s.curv, index: bi,
        p: [s.p[0], s.p[1], s.p[2]]
      };
    };

    /** posAt(t, lateral, height) -> [x,y,z] */
    path.posAt = function posAt(t, lateral, height) {
      var s = path.sample(t, _ns);
      var lat = isNum(lateral) ? lateral : 0, h = isNum(height) ? height : 0;
      return [
        s.p[0] + s.right[0] * lat + s.up[0] * h,
        s.p[1] + s.right[1] * lat + s.up[1] * h,
        s.p[2] + s.right[2] * lat + s.up[2] * h
      ];
    };

    /** progress(t, lap) -> lap + t   (monotonic race ranking key) */
    path.progress = function progress(t, lap) {
      var tt = isNum(t) ? t - Math.floor(t) : 0;
      return (isNum(lap) ? lap : 0) + tt;
    };

    /** widthAt(t) / bankAt(t) / curvAt(t) — cheap scalar lookups */
    path.widthAt = function (t) { t = isNum(t) ? t - Math.floor(t) : 0; return W[clamp((t * M) | 0, 0, M - 1)]; };
    path.bankAt = function (t) { t = isNum(t) ? t - Math.floor(t) : 0; return BK[clamp((t * M) | 0, 0, M - 1)]; };
    path.curvAt = function (t) { t = isNum(t) ? t - Math.floor(t) : 0; return CV[clamp((t * M) | 0, 0, M - 1)]; };

    /** polyline(n) -> [[x,z], ...]  (minimap / thumbnails) */
    path.polyline = function (count) {
      var c = clamp(Math.round(count || 128), 8, M), out = [], i, idx;
      for (i = 0; i < c; i++) { idx = Math.round(i * M / c) % M; out.push([X[idx], Z[idx]]); }
      return out;
    };

    /** polyline3(n) -> [[x,y,z], ...] */
    path.polyline3 = function (count) {
      var c = clamp(Math.round(count || 128), 8, M), out = [], i, idx;
      for (i = 0; i < c; i++) { idx = Math.round(i * M / c) % M; out.push([X[idx], Y[idx], Z[idx]]); }
      return out;
    };

    /** deltaT(a, b) -> shortest signed wrap distance from a to b, in -0.5..0.5 */
    path.deltaT = function (a, b) {
      var d = (isNum(b) ? b : 0) - (isNum(a) ? a : 0);
      d -= Math.floor(d);
      return d > 0.5 ? d - 1 : d;
    };

    return path;
  }

  } else if (surf < 1.5) {
    /* ROAD */
    vec2 tuv = vUV * uRoadTile;
    vec4 tr = texture(uTexRoad, tuv);
    // detail texture at two scales so the surface never turns to mush at range
    vec4 tr2 = texture(uTexRoad, tuv*0.2513 + 0.37);
    vec3 trc = tr.rgb*tr.rgb * (0.72 + 0.56*tr2.r);
    alb *= trc * 1.95;
    rough = clamp(rough * (0.55 + tr.a*0.90), 0.13, 1.0);
#if HIQ
    vec3 dp1 = dFdx(vWorld), dp2 = dFdy(vWorld);
    vec2 dt1 = dFdx(tuv),    dt2 = dFdy(tuv);
    vec3 T = dp1*dt2.y - dp2*dt1.y;
    float tl = length(T);
    if (tl > 1e-5){
      T /= tl;
      vec3 B = normalize(cross(N, T));
      vec3 nm = texture(uTexRoadN, tuv).xyz*2.0-1.0;
      N = normalize(N + (T*nm.x + B*nm.y) * uRoadNrm);
    }
#endif
    // painted lane markings, derived from the spline UVs, analytically AA'd
    float u  = vEx.x;
    float aa = fwidth(u)*1.3 + 0.0035;
    // dashed centre line, solid twin edge lines — all derived from spline UVs
    float dash = step(0.40, fract(vUV.y*0.118));
    float cl = (1.0 - smoothstep(0.0, aa, abs(u)-0.030)) * dash;
    float el = 1.0 - smoothstep(0.0, aa, abs(abs(u)-0.885)-0.026);
    float el2= 1.0 - smoothstep(0.0, aa, abs(abs(u)-0.955)-0.013);
    float paint = clamp(cl + el + el2*0.85, 0.0, 1.0);
    float wear  = 0.55 + 0.45*vnoise(vUV*vec2(0.7, 0.22));
    wear *= 0.80 + 0.30*vnoise(vUV*vec2(6.0, 1.1));
    alb  = mix(alb, uLineCol*wear*1.15, paint*0.94);
    rough = mix(rough, 0.52, paint);
    // scrubbed racing line: rubbered-in down the middle, dusty at the edges
    float rl = (1.0-smoothstep(0.0,0.46,abs(u)-0.08)) * (1.0-paint);
    alb *= 1.0 - rl*0.26;
    float dusty = smoothstep(0.62, 1.0, abs(u));
    alb = mix(alb, alb*1.18 + uGroundTint*0.10, dusty*0.55);
    rough = mix(rough, min(1.0, rough+0.30), dusty*0.7);
    wetBoost = uWet * (1.0 - dusty*0.55);
    if (uEnv == 4) {
      // Gigabit: the deck is lit from below by the spine, and the plate pattern
      // is broken up by long service panels so it never reads as wallpaper
      float panel = step(0.5, fract(vUV.y*0.0125 + floor(u*2.4)*0.37));
      alb *= 0.82 + 0.36*panel;
      float edge = smoothstep(0.55, 1.0, abs(u));
      emisC += uGlowCol * edge * 0.55;
      emisC += uAccent * pow(fract(vUV.y*0.0060 - uTime*0.09), 26.0) * 0.9;
      rough = mix(rough, 0.30, edge*0.6);
    }
    if (uEnv == 3) {
      // Frostbyte: polished ice where the line is scrubbed, loose snow at the
      // edges.  Kept inside the ROAD branch so the painted lines survive.
      // glare-ice patches: stretched ALONG the racing line, not blobby
      float slick = smoothstep(0.44, 0.82, fbm2(vec2(vUV.x*0.55, vUV.y*0.055) + 7.3) * (1.0 - 0.40*abs(u)));
      alb *= 1.0 - slick*0.34;
      alb = mix(alb, alb*vec3(0.72,0.86,1.10), slick*0.75);
      rough = mix(rough, 0.09, slick*0.85);
      wetBoost = max(wetBoost, slick*0.75);
      float pack = smoothstep(0.55, 1.0, abs(u));
      alb = mix(alb, alb*1.45 + vec3(0.035,0.042,0.055), pack*0.8);
      rough = mix(rough, 0.85, pack*0.8);
    }
  } else if (surf < 2.5) {
    /* GROUND APRON */
    vec2 g = vWorld.xz;
    float n  = fbm2(g*0.085);
    float n2 = vnoise(g*0.62);
    float n3 = vnoise(g*3.3);
    alb *= (0.66 + 0.62*n) * (0.86 + 0.28*n2) * (0.92+0.16*n3);
    alb = mix(alb, uGroundTint, 0.18*n2);
    rough = clamp(rough*(0.78+0.44*n), 0.18, 1.0);
    N = normalize(N + vec3((vnoise(g*1.7+3.1)-0.5), 0.0, (vnoise(g*1.7+9.4)-0.5))*0.55);
    if (uEnv == 3){
      float sp = pow(h21(floor(g*26.0)), 46.0);
      emisC += vec3(0.75,0.86,1.0)*sp*1.1;
      alb = mix(alb, vec3(0.80,0.88,1.0), 0.32);
      // wind crust: long shallow drifts
      alb *= 0.88 + 0.22*smoothstep(0.35,0.75, fbm2(g*vec2(0.05,0.22)));
    } else if (uEnv == 2){
      // steep faces are exposed rock: horizontal strata banding + a warm rim
      float steep = 1.0 - clamp(N.y, 0.0, 1.0);
      if (steep > 0.18) {
        float strata = fract(vWorld.y*0.42 + fbm2(vec2(vWorld.x,vWorld.z)*0.03)*1.6);
        float bandv = 0.72 + 0.46*smoothstep(0.42,0.52,strata) + 0.22*vnoise(vec2(vWorld.y*3.0, (vWorld.x+vWorld.z)*0.2));
        vec3 rock = mix(vec3(0.30,0.11,0.09), vec3(0.62,0.28,0.17), bandv*0.72);
        alb = mix(alb, rock*bandv, smoothstep(0.18,0.62,steep));
        rough = 0.95;
      }
      // canyon floor: red dirt with drifted sand in the hollows and rock shelves
      float shelf = floor(fbm2(g*0.045)*5.0)/5.0;
      alb *= 0.74 + 0.52*shelf;
      float sand = smoothstep(0.52,0.82, fbm2(g*0.09+3.3));
      alb = mix(alb, alb*vec3(1.55,1.32,1.02), sand*0.65);
      float rip = sin(g.x*1.7 + g.y*0.7 + fbm2(g*0.4)*8.0)*0.5+0.5;
      alb *= 1.0 + sand*rip*0.16;
      rough = 0.96;
    } else if (uEnv == 5){
      float rip = sin(g.x*0.9 + fbm2(g*0.3)*7.0)*0.5+0.5;
      alb *= 0.90 + 0.18*rip;
      // damp sand darkens toward the waterline
      float wet2 = smoothstep(0.62,0.90, fbm2(g*0.035+9.1));
      alb *= 1.0 - wet2*0.30;
      rough = mix(rough, 0.28, wet2);
      wetBoost = max(wetBoost, wet2*0.55);
    } else if (uEnv == 1){
      float pud = smoothstep(0.58,0.80, fbm2(g*0.11+5.5));
      rough = mix(rough, 0.06, pud);
      wetBoost = max(wetBoost, pud*0.8);
    }
  } else if (surf < 3.5) {
    /* FLAT EMISSIVE */
    emisC += alb * (0.9 + 0.35*sin(vPhase*5.0));
  } else if (surf < 4.5) {
    /* KERB — alternating race kerb on corners, plain concrete edging on the
       straights.  vEx.x is the corner weight baked in at build time. */
    float corner = clamp(vEx.x, 0.0, 1.0);
    float s  = step(0.5, fract(vUV.y*0.36));
    vec3  cc = mix(uCurbA, uCurbB, s);
    vec3  plain = mix(uGroundTint*0.55 + vec3(0.06), uCurbB*0.42, 0.45);
    float gr = 0.74 + 0.40*vnoise(vUV*vec2(4.0,1.3)) + 0.10*vnoise(vUV*vec2(23.0,7.0));
    // a scuffed rubber edge where the kerb meets the road
    float lip = 1.0 - smoothstep(0.02, 0.46, vUV.x);
    alb = mix(plain, cc, corner) * gr;
    alb *= 1.0 - lip*0.34*corner;
    rough = mix(0.72, 0.40, corner);
    emisC += cc * uCurbEmis * corner;
  } else if (surf < 5.5) {
    /* METAL / GLASS */
    float n = vnoise3(vWorld*5.0);
    rough = clamp(rough*(0.8+0.4*n), 0.02, 1.0);
    metal = max(metal, 0.55);
  } else if (surf < 6.5) {
    /* TEXT / SIGN PANEL (atlas) */
    vec4 ta = texture(uTexAtlas, vTUV);
    alb = mix(alb, ta.rgb*ta.rgb, ta.a);
    emisC += ta.rgb * ta.a * (emis*2.6 + 0.35) + alb*emis*0.4;
    rough = mix(rough, 0.28, ta.a);
  } else if (surf < 7.5) {
    /* CROWD / SPRITE CARD */
    vec4 ta = texture(uTexAtlas, vTUV);
    if (ta.a < uAlphaCut) discard;
    alb = ta.rgb*ta.rgb * alb * 1.7;
    rough = 0.85;
  } else if (surf < 8.5) {
    /* START-FINISH CHECKER */
    float c = mod(floor(vUV.x*1.05) + floor(vUV.y*1.05), 2.0);
    float dirt = 0.82 + 0.26*vnoise(vUV*4.0);
    alb = mix(vec3(0.010,0.010,0.014), vec3(0.90,0.90,0.94), c) * dirt;
    rough = 0.45;
    wetBoost = uWet;
  } else if (surf < 9.5) {
    /* BOOST PAD */
    float x = vUV.x*2.0-1.0;
    float v = fract(vUV.y*2.6 - uTime*2.6 - abs(x)*0.30);
    float band = smoothstep(0.52,0.36,v)*smoothstep(0.0,0.10,v);
    float edge = 1.0 - smoothstep(0.80,0.99,abs(x));
    alb = mix(alb*0.20, uAccent, band*edge);
    emisC += mix(uGlowCol, vec3(1.0), 0.25) * band*edge * 5.0;
    emisC += uGlowCol * (1.0-smoothstep(0.86,0.99,abs(x))) * 0.35;
    rough = 0.30;
  } else if (surf < 10.5) {
    /* FIBER TUBE PANEL */
    float ring = fract(vUV.y*0.1112);
    float seam = smoothstep(0.035,0.0, min(ring,1.0-ring));
    float rib  = fract(vUV.x*20.0);
    float ribS = smoothstep(0.055,0.0, min(rib,1.0-rib));
    float pulse = 0.5+0.5*sin(vUV.y*0.14 - uTime*2.4);
    float flow  = pow(fract(vUV.y*0.03 - uTime*0.30), 3.0);
    alb *= 0.30 + 0.35*vnoise(vUV*vec2(26.0,0.55));
    emisC += uGlowCol*(seam*(1.1 + pulse*2.6) + ribS*0.45) + uAccent*flow*1.2;
    rough = 0.22; metal = 0.5;
  } else if (surf < 11.5) {
    /* WATER — deep body colour, layered swell, a sun glitter path */
    vec2 w = vWorld.xz*0.085;
    float t = uTime*0.35;
    float h1 = vnoise(w + vec2(t,t*0.6));
    float h2 = vnoise(w*2.4 - vec2(t*1.4,t*0.3));
    float h3 = vnoise(w*7.5 + vec2(t*2.1,-t*1.7));
    N = normalize(N + vec3((h1-0.5)*0.34 + (h3-0.5)*0.22, 0.0, (h2-0.5)*0.34 + (h3-0.5)*0.18));
    rough = 0.045; metal = 0.06;
    alb *= 0.42 + 0.34*h1;
    // crest glitter toward the sun
    vec3 Hs = normalize(uSunDir + V);
    float glint = pow(max(dot(N, Hs), 0.0), 220.0);
    emisC += uSunCol * glint * 3.2 * smoothstep(0.55,0.95,h3);
    // foam on the swell tops
    float foam = smoothstep(0.80, 0.97, h1*0.6 + h3*0.6);
    alb = mix(alb, vec3(0.62,0.72,0.78), foam*0.5);
    rough = mix(rough, 0.55, foam*0.6);
    wetBoost = 0.85;
  } else if (surf < 12.5) {
    /* FOLIAGE */
    float n = vnoise3(vWorld*1.6);
    float n2 = vnoise3(vWorld*7.0);
    alb *= 0.70 + 0.55*n + 0.18*n2;
    rough = 0.85;
    N = normalize(N + vec3(n2-0.5, 0.0, vnoise3(vWorld*7.0+13.0)-0.5)*0.4);
    float trans = pow(max(0.0, dot(-V, uSunDir)), 3.0);
    emisC += alb*uSunCol*trans*0.35*uSunInt;
  } else if (surf < 13.5) {
    /* ICE / SNOW PACK */
    float n = fbm2(vWorld.xz*0.30);
    float gr = vnoise(vWorld.xz*vec2(0.5,4.0));
    alb *= 0.74 + 0.40*n + 0.12*gr;
    // polished ice patches where the line has been scrubbed clean
    float slick = smoothstep(0.52, 0.86, fbm2(vWorld.xz*0.14 + 7.3));
    rough = clamp(mix(0.55, 0.07, slick) * (0.7 + 0.6*n), 0.05, 0.95);
    alb *= 1.0 - slick*0.34;
    metal = 0.03;
    float sp = pow(h21(floor(vWorld.xz*34.0)), 52.0);
    emisC += vec3(0.85,0.92,1.0)*sp*0.9;
    wetBoost = 0.28 + slick*0.55;
  } else {
    /* NEON TUBE */
    float pulse = 0.75 + 0.25*sin(uTime*3.2 + vPhase*9.0);
    float flick = 1.0 - 0.10*step(0.972, h21(vec2(floor(uTime*13.0), vPhase*31.0)));
    emisC += alb * pulse * flick * 2.2;
    rough = 0.25;
  }

  alb = clamp(alb, 0.0, 4.0);

  /* ---------------------------------------------------------- lighting
     All colour uniforms arrive ALREADY LINEARISED from the CPU (see LINU in
     setCommon), so no conversion happens here.  Energies are tuned for an
     ACES-filmic tonemap with exposure ~1.0 downstream in fx.js.            */
  vec3 L = uSunDir;
  vec3 H = normalize(L + V);
  float ndl = max(dot(N,L), 0.0);
  float ndv = max(dot(N,V), 1e-4);
  float ndh = max(dot(N,H), 0.0);
  float vdh = max(dot(V,H), 0.0);

  float a  = max(rough*rough, 0.0016);
  float a2 = a*a;
  float dd = ndh*ndh*(a2-1.0)+1.0;
  float D  = a2 / (3.14159265*dd*dd);
  float kk = (rough+1.0); kk = kk*kk*0.125;
  float G  = (ndl/(ndl*(1.0-kk)+kk)) * (ndv/(ndv*(1.0-kk)+kk));
  vec3  F0 = mix(vec3(0.045), alb, metal);
  vec3  F  = F0 + (1.0-F0)*pow(1.0-vdh, 5.0);
  vec3  spec = min(D*G*F / (4.0*ndl*ndv + 1e-4), vec3(2.6));
  vec3  kd = (1.0-F)*(1.0-metal);

  float sh = shadowAt(vWorld, N, ndl);
  // the shadow also dims sky light and reflections a little (a cheap stand-in
  // for directional occlusion) so shadows read on glossy floors too
  float shAmb = mix(1.0, sh, 0.50);
  vec3 col = uSunCol * (uSunInt*1.18) * ndl * sh * (kd*alb + spec);

  // hemispherical ambient: sky above, bounce from the ground below
  float hemi = N.y*0.5 + 0.5;
  vec3 ambTop = mix(uAmbient, uSkyB, 0.45) * 1.45;
  vec3 ambBot = (uAmbient*0.30 + uGroundTint*0.55) * 0.80;
  if (uEnv == 3) ambBot *= vec3(0.62, 0.74, 1.05);   // blue bounce off snow shadow
  vec3 ambient = mix(ambBot, ambTop, hemi) * (uAmbLevel*0.92) * ao * shAmb;
  // a little wrap so the shadow side keeps form instead of going flat
  ambient *= 0.80 + 0.35*(0.5 + 0.5*dot(N, normalize(L + vec3(0.0,0.35,0.0))));
  col += ambient * alb;
  // sky rim: separates every silhouette from the background, cheap and huge
  float rim = pow(1.0 - ndv, 3.6) * (0.30 + 0.70*hemi);
  col += ambTop * rim * (0.30*uAmbLevel + 0.10) * ao * (0.35 + 0.65*(1.0-metal)) * shAmb;

  // fake environment reflection — this is what makes the karts look wet-painted.
  // Blended (not added) so a glossy surface never exceeds the light it receives.
  vec3 Rv = reflect(-V, N);
  vec3 env = min(skyColor(Rv, 0.0), vec3(2.6));
  float fres = pow(1.0 - ndv, 5.0);
  float rw = clamp(mix(0.035, 1.0, metal) * (1.0 - rough*0.96) * (0.22 + 0.78*fres)
                   + wetBoost * (0.02 + 0.50*fres) * (1.0 - rough*0.75), 0.0, 0.84) * uReflMul;
  col = mix(col, env * mix(vec3(1.0), alb*1.4, metal*0.9) * (0.55 + 0.45*ao) * shAmb, rw);

  // wet neon smear: stretched reflections of the rail glow along the road
  if (wetBoost > 0.0){
    // stretched vertical smear of the rail neon, strongest near the barriers —
    // this is what sells a wet street at night
    float lat = abs(vEx.x);
    float nearEdge = smoothstep(0.25, 1.0, lat);
    float sm = pow(vnoise(vec2(vUV.x*1.9, vUV.y*0.075)), 2.2);
    float sm2 = pow(vnoise(vec2(vUV.x*0.6 + 11.0, vUV.y*0.021)), 1.6);
    col += uGlowCol * (sm*0.55 + sm2*0.85) * wetBoost * fres * (0.35 + 1.55*nearEdge);
    col += uAccent * sm2 * wetBoost * fres * 0.35 * (1.0 - nearEdge);
  }

  /* ------------------------------------------------- local point lights */
  for (int i=0;i<10;i++){
    if (i >= uPointCount) break;
    vec3 dl = uPointPos[i].xyz - vWorld;
    float r = uPointPos[i].w;
    float d2 = dot(dl,dl);
    if (d2 > r*r) continue;
    float dl2 = sqrt(d2);
    vec3 Ld = dl / max(dl2, 1e-3);
    float att = clamp(1.0 - dl2/r, 0.0, 1.0); att *= att;
    float nl = max(dot(N,Ld), 0.0)*0.85 + 0.15;
    vec3 Hp = normalize(Ld+V);
    float sp = pow(max(dot(N,Hp),0.0), mix(8.0, 180.0, 1.0-rough)) * (1.0-rough)*0.9;
    col += uPointCol[i].rgb * uPointCol[i].w * att * (nl*alb + sp);
  }

  /* -------------------------------------------------------- emissive */
  vec3 emissive = (emisC + alb*emis) * uEmisMul * max(vEmisB, 0.0);
  col += emissive;

  /* ------------------------------------------------------------- fog */
  float fd = dist * uFogDensity;
  float fog = exp(-fd*fd);
  if (uHeightFogK > 0.0){
    float hf = exp(-max(0.0, vWorld.y - uHeightFogY) * uHeightFogK);
    fog *= mix(1.0, 1.0 - 0.75*hf, clamp(dist*0.012, 0.0, 1.0));
  }
  fog = clamp(fog, 0.0, 1.0);
  float sdv = max(dot(-V, uSunDir), 0.0);
  // fog inherits the sky it sits in front of, so distant geometry dissolves
  // into the horizon instead of into a flat grey slab
  // cheap sky-tinted fog: a horizon gradient, not a full skyColor() evaluation
  float fUp = smoothstep(-0.12, 0.45, -V.y);
  vec3 fogSky = mix(mix(uFogCol, uSkyA, 0.50), uSkyB, fUp);
  vec3 fogc = mix(uFogCol, fogSky, 0.34) * 0.86;
  fogc = mix(fogc, uSunCol*0.9, pow(sdv, 7.0)*0.40);
  if (uEnv == 4) fogc *= 0.22;
  col = mix(fogc, col, fog);

  float el = dot(emissive, vec3(0.2126,0.7152,0.0722));
  float em = clamp(el*0.60, 0.0, 1.0) * fog;
  oCol = vec4(max(col, vec3(0.0)), em);
}`;

  /* ------------------------------------------------------- shadow pass */
  var SHADOW_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=2) in vec2 aUV;
layout(location=4) in vec4 aMat;
layout(location=6) in vec4 iM0;
layout(location=7) in vec4 iM1;
layout(location=8) in vec4 iM2;
layout(location=9) in vec4 iM3;
layout(location=11) in vec4 iPar;
layout(location=12) in vec4 iUV;
uniform mat4 uLightVP;
uniform vec3 uCamRight, uCamUp, uCamPos;
uniform float uTime, uBillboard, uSpin, uSway;
out vec2 vTUV; out float vSurf;
void main(){
  vec3 lp = aPos;
  if (uSpin != 0.0){ float a=uTime*uSpin+iPar.y; float c=cos(a), s=sin(a); lp=vec3(c*lp.x+s*lp.z, lp.y, -s*lp.x+c*lp.z); }
  if (uSway > 0.0){ float ph=uTime*1.55+iPar.y*6.28; float k=uSway*max(lp.y,0.0); lp.x+=sin(ph)*k; lp.z+=cos(ph*0.83)*k*0.75; }
  vec3 world;
  if (uBillboard > 0.5){
    vec3 org = iM3.xyz;
    float sx = length(iM0.xyz), sy = length(iM1.xyz);
    float bob = sin(uTime*(2.2+fract(iPar.y)*2.6)+iPar.y*11.0);
    world = org + uCamRight*(lp.x*sx) + uCamUp*((lp.y + max(0.0,bob)*iPar.z)*sy);
  } else {
    world = (mat4(iM0,iM1,iM2,iM3) * vec4(lp,1.0)).xyz;
  }
  vTUV = aUV*iUV.zw + iUV.xy;
  vSurf = aMat.w;
  gl_Position = uLightVP * vec4(world,1.0);
}`;

  var SHADOW_FS = `#version 300 es
precision mediump float;
in vec2 vTUV; in float vSurf;
uniform sampler2D uTexAtlas;
uniform float uAlphaCut;
out vec4 oCol;
void main(){
  if (vSurf > 6.5 && vSurf < 7.5){
    if (texture(uTexAtlas, vTUV).a < uAlphaCut) discard;
  }
  oCol = vec4(1.0);
}`;

  /* ==========================================================================
     GL HELPERS
     ========================================================================== */
  var VSTRIDE = 17;   // pos3 nrm3 uv2 col3 mat4 ex2
  var ISTRIDE = 28;   // mat4(16) col4 par4 uv4

  function compile(gl, type, src, tag) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      var log = gl.getShaderInfoLog(s) || '';
      try { console.error('[BFX.R] shader compile failed (' + tag + '):\n' + log); } catch (e) {}
      // dump the offending line for easier debugging
      try {
        var mm = /ERROR:\s*\d+:(\d+)/.exec(log);
        if (mm) {
          var lines = src.split('\n'), ln = parseInt(mm[1], 10);
          console.error('[BFX.R] near: ' + (lines[ln - 2] || '') + ' >>> ' + (lines[ln - 1] || ''));
        }
      } catch (e2) {}
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  function program(gl, vsSrc, fsSrc, tag) {
    var vs = compile(gl, gl.VERTEX_SHADER, vsSrc, tag + '.vs');
    if (!vs) return null;
    var fs = compile(gl, gl.FRAGMENT_SHADER, fsSrc, tag + '.fs');

      var sx = (i % 8) * SS, sy = SB + Math.floor(i / 8) * SS;
      var key = SPRITE_KEYS[i];
      rects[key] = [sx / W, sy / H, SS / W, SS / H];
      x.save(); x.beginPath(); x.rect(sx, sy, SS, SS); x.clip(); x.translate(sx, sy);
      if (key.indexOf('crowd') === 0) {
        drawSpectator(x, SS, i, rnd);
      } else if (key === 'qmark') {
        x.fillStyle = '#fff'; x.font = 'italic 900 104px "Arial Black", Impact, sans-serif';
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.shadowColor = '#fff'; x.shadowBlur = 24; x.fillText('?', SS * 0.5, SS * 0.52); x.shadowBlur = 0;
      } else if (key === 'glow' || key === 'flare') {
        var g = x.createRadialGradient(SS * 0.5, SS * 0.5, 0, SS * 0.5, SS * 0.5, SS * 0.5);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
        g.addColorStop(0.6, 'rgba(255,255,255,0.13)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = g; x.fillRect(0, 0, SS, SS);
        if (key === 'flare') {
          x.fillStyle = 'rgba(255,255,255,0.55)';
          x.fillRect(0, SS * 0.47, SS, SS * 0.06);
          x.fillRect(SS * 0.47, 0, SS * 0.06, SS);
        }
      } else if (key === 'leaf' || key === 'frond') {
        // a cluster of leaf blades with a real silhouette
        var blades = key === 'leaf' ? 13 : 8;
        for (j = 0; j < blades; j++) {
          var a = key === 'leaf' ? (rnd() * 6.2832) : (-1.3 + j / (blades - 1) * 2.6);
          var ln = SS * (key === 'leaf' ? (0.18 + rnd() * 0.30) : (0.36 + rnd() * 0.12));
          x.save(); x.translate(SS * 0.5, key === 'leaf' ? SS * 0.5 : SS * 0.92); x.rotate(a);
          var gg = x.createLinearGradient(0, 0, 0, -ln);
          gg.addColorStop(0, 'rgba(210,255,200,0.95)');
          gg.addColorStop(1, 'rgba(255,255,255,0.55)');
          x.fillStyle = gg;
          x.beginPath(); x.moveTo(0, 0);
          x.quadraticCurveTo(ln * 0.24, -ln * 0.5, 0, -ln);
          x.quadraticCurveTo(-ln * 0.24, -ln * 0.5, 0, 0);
          x.fill(); x.restore();
        }
      } else if (key === 'star') {
        x.fillStyle = '#fff';
        x.translate(SS * 0.5, SS * 0.5);
        for (j = 0; j < 4; j++) {
          x.rotate(Math.PI / 4);
          x.beginPath(); x.moveTo(0, -SS * 0.46); x.lineTo(SS * 0.07, 0); x.lineTo(0, SS * 0.46); x.lineTo(-SS * 0.07, 0); x.closePath(); x.fill();
        }
      } else if (key === 'chev') {
        x.fillStyle = '#fff';
        for (j = -1; j < 4; j++) {
          x.beginPath();
          x.moveTo(0, j * 34 + 0); x.lineTo(SS * 0.5, j * 34 + 26); x.lineTo(SS, j * 34); 
          x.lineTo(SS, j * 34 + 15); x.lineTo(SS * 0.5, j * 34 + 41); x.lineTo(0, j * 34 + 15);
          x.closePath(); x.fill();
        }
      } else if (key === 'logo') {
        x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
        x.font = 'italic 900 78px "Arial Black", Impact, sans-serif';
        x.shadowColor = '#fff'; x.shadowBlur = 20;
        x.fillText('C³', SS * 0.5, SS * 0.5); x.shadowBlur = 0;
      }
      x.restore();
    }
    return { canvas: cv, rects: rects, w: W, h: H };
  }

  /** a cheering critter, drawn as an alpha card. Tinted per-instance in the shader. */
  function drawSpectator(x, S, variant, rnd) {
    var armUp = (variant % 3);
    var earType = variant % 3;
    var bodyW = S * (0.30 + (variant % 2) * 0.04);
    var cx = S * 0.5;
    var groundY = S * 0.97;
    x.lineCap = 'round'; x.lineJoin = 'round';
    // dark rim so the silhouette reads against bright skies
    x.strokeStyle = 'rgba(20,16,30,0.85)'; x.lineWidth = 7;
    // body (torso)
    function torso(fill) {
      x.beginPath();
      x.moveTo(cx - bodyW * 0.5, groundY);
      x.lineTo(cx - bodyW * 0.42, S * 0.52);
      x.quadraticCurveTo(cx, S * 0.44, cx + bodyW * 0.42, S * 0.52);
      x.lineTo(cx + bodyW * 0.5, groundY);
      x.closePath();
      if (fill) { x.fillStyle = fill; x.fill(); } else x.stroke();
    }
    // arms
    function arms(fill) {
      var ay = S * 0.55;
      var lift = armUp === 0 ? S * 0.30 : (armUp === 1 ? S * 0.16 : S * 0.05);
      x.lineWidth = fill ? S * 0.085 : S * 0.085 + 8;
      x.strokeStyle = fill || 'rgba(20,16,30,0.85)';
      x.beginPath();
      x.moveTo(cx - bodyW * 0.36, ay);
      x.quadraticCurveTo(cx - bodyW * 0.85, ay - lift * 0.7, cx - bodyW * 0.72, ay - lift);
      x.stroke();
      x.beginPath();
      x.moveTo(cx + bodyW * 0.36, ay);
      x.quadraticCurveTo(cx + bodyW * 0.85, ay - lift * 0.55, cx + bodyW * 0.78, ay - lift * 0.86);
      x.stroke();
    }
    // head + ears
    function head(fillHead, fillEar) {
      var hy = S * 0.33, hr = S * 0.135;
      if (earType === 0) {         // pointed
        x.beginPath(); x.moveTo(cx - hr * 0.85, hy - hr * 0.55); x.lineTo(cx - hr * 1.25, hy - hr * 2.2); x.lineTo(cx - hr * 0.15, hy - hr * 1.15); x.closePath();
        if (fillEar) { x.fillStyle = fillEar; x.fill(); } else x.stroke();
        x.beginPath(); x.moveTo(cx + hr * 0.85, hy - hr * 0.55); x.lineTo(cx + hr * 1.25, hy - hr * 2.2); x.lineTo(cx + hr * 0.15, hy - hr * 1.15); x.closePath();
        if (fillEar) { x.fillStyle = fillEar; x.fill(); } else x.stroke();
      } else if (earType === 1) {  // round
        x.beginPath(); x.arc(cx - hr * 0.95, hy - hr * 0.85, hr * 0.52, 0, 6.2832);
        if (fillEar) { x.fillStyle = fillEar; x.fill(); } else x.stroke();
        x.beginPath(); x.arc(cx + hr * 0.95, hy - hr * 0.85, hr * 0.52, 0, 6.2832);
        if (fillEar) { x.fillStyle = fillEar; x.fill(); } else x.stroke();
      } else {                     // tufted (big)
        x.beginPath(); x.moveTo(cx - hr * 0.7, hy - hr * 0.5); x.lineTo(cx - hr * 1.75, hy - hr * 2.35); x.lineTo(cx - hr * 0.05, hy - hr * 1.1); x.closePath();
        if (fillEar) { x.fillStyle = fillEar; x.fill(); } else x.stroke();
        x.beginPath(); x.moveTo(cx + hr * 0.7, hy - hr * 0.5); x.lineTo(cx + hr * 1.75, hy - hr * 2.35); x.lineTo(cx + hr * 0.05, hy - hr * 1.1); x.closePath();
        if (fillEar) { x.fillStyle = fillEar; x.fill(); } else x.stroke();
      }
      x.beginPath(); x.ellipse(cx, hy, hr, hr * 1.02, 0, 0, 6.2832);
      if (fillHead) { x.fillStyle = fillHead; x.fill(); } else x.stroke();
    }
    // outline pass then fill pass
    torso(null); arms(null); head(null, null);
    torso('rgba(255,255,255,1)');
    arms('rgba(248,242,255,1)');
    head('rgba(235,222,208,1)', 'rgba(235,222,208,1)');
    // a bit of face + a waving item
    x.fillStyle = 'rgba(28,22,40,0.9)';
    x.beginPath(); x.arc(cx - S * 0.05, S * 0.315, S * 0.017, 0, 6.28); x.fill();
    x.beginPath(); x.arc(cx + S * 0.05, S * 0.315, S * 0.017, 0, 6.28); x.fill();
    x.beginPath(); x.ellipse(cx, S * 0.365, S * 0.028, S * 0.020, 0, 0, 6.28); x.fill();
    if (variant % 4 === 1) {     // little flag
      x.strokeStyle = 'rgba(40,32,54,0.9)'; x.lineWidth = 4;
      x.beginPath(); x.moveTo(cx + bodyW * 0.78, S * 0.55 - S * 0.30); x.lineTo(cx + bodyW * 0.86, S * 0.10); x.stroke();
      x.fillStyle = 'rgba(255,255,255,0.95)';
      x.beginPath(); x.moveTo(cx + bodyW * 0.86, S * 0.10); x.lineTo(cx + bodyW * 1.9, S * 0.16); x.lineTo(cx + bodyW * 0.86, S * 0.24); x.closePath(); x.fill();
    }
    // torso trim stripe (tints to the team colour)
    x.fillStyle = 'rgba(255,255,255,0.0)';
    x.strokeStyle = 'rgba(30,24,44,0.35)'; x.lineWidth = 5;
    x.beginPath(); x.moveTo(cx - bodyW * 0.44, S * 0.66); x.lineTo(cx + bodyW * 0.44, S * 0.66); x.stroke();
  }

  /* ==========================================================================
     PROP MESH LIBRARY
     Each builder makes ONE little procedural model in local space (+Y up,
     facing +Z, origin on the ground) which is then drawn instanced.
     Returns per-kind draw options.
     ========================================================================== */
  function mt(c, rough, metal, emis, surf, tw) {
    return { c: c, rough: rough === undefined ? 0.75 : rough, metal: metal || 0, emis: emis || 0, surf: surf || 0, tw: tw || 0 };
  }
  function mix3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function scl3(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }

  var PROPS = {};

  /* ------------------------------------------------------------- arch ---- */
  PROPS.arch = function (mb, K) {
    var steel = mt([0.30, 0.31, 0.36], 0.42, 0.85);
    var steel2 = mt([0.52, 0.54, 0.60], 0.34, 0.9);
    var accent = mt(K.pal.accent, 0.40, 0.2, 0.0, 0, 1);
    var glow = mt(K.pal.railGlow, 0.3, 0, 2.4, SURF.EMISSIVE, 1);
    var panel = mt([0.09, 0.08, 0.13], 0.45, 0.1, 0.9, SURF.TEXT, 0);
    var HW = 15, H = 11.2;
    var s;
    // legs — tapered lattice towers
    for (s = -1; s <= 1; s += 2) {
      mb.push(); mb.tr(s * HW, 0, 0);
      mb.tbox(0, 0, 0, 2.6, 2.0, 2.6, 0.7, 0.7, 0, 0, mt([0.30, 0.30, 0.34], 0.9), 0.55);
      mb.tbox(0, 2.0, 0, 1.9, H - 3.4, 1.9, 0.62, 0.62, 0, 0, steel, 0.8);
      // cross bracing
      for (var b = 0; b < 5; b++) {
        var by = 2.4 + b * (H - 4.4) / 5;
        mb.push(); mb.tr(0, by, 0); mb.rz(b % 2 ? 0.62 : -0.62);
        mb.box(0, 0, 0, 2.5, 0.16, 0.16, steel2, 1, 0.85); mb.pop();
        mb.push(); mb.tr(0, by, 0); mb.rx(b % 2 ? 0.62 : -0.62);
        mb.box(0, 0, 0, 0.16, 0.16, 2.5, steel2, 1, 0.85); mb.pop();
      }
      mb.cyl(0, H - 1.5, 0, 0.55, 0.42, 1.5, 8, accent, false, true, 0.95);
      mb.pop();
    }
    // top beam + underside light strip
    mb.box(0, H, 0, HW * 2 + 3.2, 1.5, 2.2, steel, 0.5, 1.0);
    mb.box(0, H + 0.95, 0, HW * 2 + 1.6, 0.42, 2.6, accent, 0.5, 1.0);
    mb.box(0, H - 0.80, 0, HW * 2 + 1.0, 0.22, 1.5, glow, 1, 1.0);
    mb.box(0, H - 0.80, 1.16, HW * 2 + 1.0, 0.40, 0.12, glow, 1, 1.0);
    mb.box(0, H - 0.80, -1.16, HW * 2 + 1.0, 0.40, 0.12, glow, 1, 1.0);
    // headline sign on both faces
    mb.box(0, H + 2.5, 0, 22, 3.6, 0.5, mt([0.07, 0.06, 0.11], 0.5, 0.2), 1, 1.0);
    mb.plane(0, H + 2.5, 0.30, 21, 3.3, panel);
    mb.push(); mb.ry(Math.PI); mb.plane(0, H + 2.5, 0.30, 21, 3.3, panel); mb.pop();
    // corner floods
    for (s = -1; s <= 1; s += 2) {
      mb.push(); mb.tr(s * 10.5, H + 4.4, 0.9); mb.rx(0.8);
      mb.cyl(0, 0, 0, 0.42, 0.52, 0.7, 8, steel, true, false, 1);
      mb.cyl(0, 0.7, 0, 0.52, 0.52, 0.08, 8, mt([1, 0.97, 0.9], 0.2, 0, 3.0, SURF.EMISSIVE), false, true, 1);
      mb.pop();
    }
    return { textUV: true, light: { c: K.pal.railGlow, r: 26, y: H - 1, i: 0.5 } };
  };

  /* ------------------------------------------------------------ banner ---- */
  PROPS.banner = function (mb, K) {
    var pole = mt([0.42, 0.44, 0.50], 0.38, 0.85);
    var fab = mt([0.5, 0.5, 0.55], 0.85, 0, 0.12, 0, 1);
    var panel = mt([0.1, 0.09, 0.14], 0.6, 0, 0.8, SURF.TEXT, 0);
    mb.cyl(0, 0, 0, 0.16, 0.12, 6.4, 8, pole, false, true, 0.8);
    mb.cyl(0, 0, 0, 0.42, 0.38, 0.35, 10, mt([0.24, 0.24, 0.28], 0.8), true, true, 0.6);
    mb.cyl(0, 6.4, 0, 0.14, 0.02, 0.35, 6, mt(K.pal.accent, 0.4, 0.3, 0.4, 0, 1), false, true, 1);
    // hanging fabric, with a slight curl so it never looks like cardboard
    var i, n = 5, w = 2.6, h = 4.0, y0 = 1.9;
    for (i = 0; i < n; i++) {
      var t0 = i / n, t1 = (i + 1) / n;
      var z0 = Math.sin(t0 * 3.14) * 0.22, z1 = Math.sin(t1 * 3.14) * 0.22;
      var a = mb.v(0.30 + t0 * w, y0, z0, 0, 0, 1, t0, 1, fab, 1, 0.9);
      var b = mb.v(0.30 + t1 * w, y0, z1, 0, 0, 1, t1, 1, fab, 1, 0.9);
      var c = mb.v(0.30 + t1 * w, y0 + h, z1, 0, 0, 1, t1, 0, fab, 1, 1.0);
      var d = mb.v(0.30 + t0 * w, y0 + h, z0, 0, 0, 1, t0, 0, fab, 1, 1.0);
      mb.quad(a, b, c, d); mb.quad(d, c, b, a);
    }
    mb.push(); mb.tr(0.30 + w * 0.5, y0 + h * 0.55, 0.20);
    mb.plane(0, 0, 0, w * 0.92, h * 0.5, panel);
    mb.ry(Math.PI); mb.plane(0, 0, 0.40, w * 0.92, h * 0.5, panel);
    mb.pop();
    mb.box(0.30 + w * 0.5, y0 + h + 0.12, 0.11, w + 0.2, 0.16, 0.16, pole, 1, 1);
    return { textUV: true, sway: 0.012 };
  };

  /* -------------------------------------------------------------- tree ---- */
  PROPS.tree = function (mb, K) {

  /* -------------------------------------------------------------- pine ---- */

    mb.cyl(0, 0, 0, 0.18, 0.12, 4.2, 6, dark, false, false, 0.7);
    return { spin: 0.18, light: { c: K.pal.railGlow, r: 13, y: 6, i: 0.4 } };
  };

  /* ----------------------------------------------------------- iceberg ---- */
  PROPS.iceberg = function (mb, K) {
    var ice = mt([0.74, 0.86, 0.96], 0.12, 0.05, 0.04, SURF.ICE, 0.5);
    var ice2 = mt([0.60, 0.78, 0.94], 0.20, 0.05, 0.02, SURF.ICE, 0.5);
    var snowM = mt([0.96, 0.98, 1.0], 0.55, 0, 0, SURF.ICE, 0);
    var rnd = rng32(0x1CE8);
    var i, j, seg = 9, rings = 6, base = mb.nv;
    // jittered ellipsoid -> a convex ice chunk with real facets
    for (j = 0; j <= rings; j++) {
      var ph = j / rings * Math.PI;
      for (i = 0; i <= seg; i++) {
        var th = i / seg * Math.PI * 2;
        var jit = 0.62 + rnd() * 0.72;
        var sx = Math.sin(ph) * Math.cos(th) * 5.5 * jit;
        var sy = Math.cos(ph) * 5.0 * (0.5 + jit * 0.5);
        var sz = Math.sin(ph) * Math.sin(th) * 5.0 * jit;
        var l = Math.sqrt(sx * sx + sy * sy + sz * sz) || 1;
        mb.v(sx, Math.max(-0.5, sy) + 4.2, sz, sx / l, sy / l, sz / l, i / seg * 2, j / rings, j < rings * 0.45 ? snowM : (j % 2 ? ice : ice2), 0.5, 0.65 + 0.35 * (1 - j / rings));
      }
    }
    for (j = 0; j < rings; j++) for (i = 0; i < seg; i++) {
      var a = base + j * (seg + 1) + i, b = a + seg + 1;
      mb.quad(a, b, b + 1, a + 1);
    }
    // shards
    for (i = 0; i < 5; i++) {
      var a2 = i / 5 * 6.2832 + rnd();
      mb.push(); mb.tr(Math.cos(a2) * 3.6, 0.4, Math.sin(a2) * 3.4); mb.ry(rnd() * 6.28); mb.rz((rnd() - 0.5) * 0.5);
      mb.cyl(0, 0, 0, 1.3 + rnd(), 0.15, 3.4 + rnd() * 3.4, 6, ice, true, true, 0.85);
      mb.pop();
    }
    return {};
  };

  /* ==========================================================================
     SIGNAL CANYON variants.  content.js tags desert props with prop.variant
     ('mesa','hoodoo','cactus','rockArch','mast','ropeLight'); the prop loop
     prefers PROPS[variant] when one exists so each gets a real mesh instead of
     borrowing an iceberg or a pine.
     ========================================================================== */

  /* rock strata palette shared by every canyon formation */
  function rockMats(K) {
    var g = K.pal.ground || [0.39, 0.18, 0.21];
    return [
      mt(mix3(g, [0.62, 0.28, 0.20], 0.55), 0.94, 0, 0, 0, 0),
      mt(mix3(g, [0.80, 0.46, 0.30], 0.60), 0.92, 0, 0, 0, 0),
      mt(mix3(g, [0.40, 0.19, 0.20], 0.35), 0.96, 0, 0, 0, 0),
      mt(mix3(g, [0.90, 0.64, 0.44], 0.55), 0.90, 0, 0, 0, 0)
    ];
  }

  /* ------------------------------------------------------------- mesa ---- */
  /* A layered butte: irregular n-gon prism stacked in strata that step in as
     they rise, with a talus skirt and a flat cap.  Built once, drawn instanced
     with per-prop scale, so 24 of them cost a single draw call. */
  PROPS.mesa = function (mb, K) {
    var R = rockMats(K), rnd = rng32(0x5EA1), i, j;
    var SEG = 11;
    var jit = new Float32Array(SEG);
    for (i = 0; i < SEG; i++) jit[i] = 0.80 + rnd() * 0.42;
    var LAY = [
      [1.00, 0.00, 1.6], [0.97, 1.6, 3.1], [0.90, 4.7, 2.2], [0.86, 6.9, 3.4],
      [0.74, 10.3, 2.0], [0.70, 12.3, 3.0], [0.60, 15.3, 2.4], [0.55, 17.7, 1.5]
    ];
    var prevIdx = -1, prevR = 0, prevY = 0;
    for (j = 0; j < LAY.length; j++) {
      var rr = LAY[j][0] * 7.2, y0 = LAY[j][1], hh = LAY[j][2];
      var m = R[j % R.length];
      var ringA = mb.nv, ringB;
      for (i = 0; i < SEG; i++) {
        var a = i / SEG * 6.2832;
        var ca = Math.cos(a), sa = Math.sin(a);
        var q = jit[i];
        mb.v(ca * rr * q, y0, sa * rr * q, ca, 0.12, sa, i / SEG * 3, y0 * 0.12, m, 0, 0.42 + y0 * 0.022);
      }
      ringB = mb.nv;
      var rt = rr * (j === LAY.length - 1 ? 0.82 : 0.965);
      for (i = 0; i < SEG; i++) {
        var a2 = i / SEG * 6.2832;
        var c2 = Math.cos(a2), s2 = Math.sin(a2), q2 = jit[i];
        mb.v(c2 * rt * q2, y0 + hh, s2 * rt * q2, c2, 0.12, s2, i / SEG * 3, (y0 + hh) * 0.12, m, 0, 0.52 + y0 * 0.022);
      }
      for (i = 0; i < SEG; i++) {
        var i2 = (i + 1) % SEG;
        mb.quad(ringA + i, ringA + i2, ringB + i2, ringB + i);
      }
      // overhang lip between strata reads as a hard shadow line
      if (prevIdx >= 0) {
        for (i = 0; i < SEG; i++) {
          var k2 = (i + 1) % SEG;
          mb.quad(prevIdx + i, prevIdx + k2, ringA + k2, ringA + i);
        }
      }
      prevIdx = ringB; prevR = rt; prevY = y0 + hh;
    }
    // flat cap
    var capC = mb.v(0, prevY + 0.05, 0, 0, 1, 0, 0.5, 0.5, R[1], 0, 1.0);
    var capRing = mb.nv;
    for (i = 0; i < SEG; i++) {
      var a3 = i / SEG * 6.2832;
      mb.v(Math.cos(a3) * prevR * jit[i], prevY, Math.sin(a3) * prevR * jit[i], 0, 1, 0, i / SEG, 0.5, R[1], 0, 0.95);
    }
    for (i = 0; i < SEG; i++) mb.tri(capC, capRing + i, capRing + (i + 1) % SEG);
    // talus / scree skirt — wide and low so it reads as a slope, not a pyramid
    for (i = 0; i < SEG; i++) {
      var a4 = (i + 0.5) / SEG * 6.2832;
      mb.push();
      mb.tr(Math.cos(a4) * 6.4 * jit[i], -0.15, Math.sin(a4) * 6.4 * jit[i]);
      mb.ry(a4);
      mb.cyl(0, 0, 0, 3.1 + rnd() * 1.4, 1.5 + rnd() * 0.6, 1.05 + rnd() * 0.7, 9, R[3], false, true, 0.72);
      mb.pop();
    }
    // a couple of loose boulders
    for (i = 0; i < 4; i++) {
      var a5 = rnd() * 6.2832, dd = 8.5 + rnd() * 4;
      mb.push(); mb.tr(Math.cos(a5) * dd, 0.5, Math.sin(a5) * dd); mb.ry(rnd() * 6.28);
      mb.sph(0, 0, 0, 1.1 + rnd(), 0.85 + rnd() * 0.5, 1.0 + rnd(), 6, 4, R[0], 0.55);
      mb.pop();
    }
    return {};
  };

  /* ----------------------------------------------------------- hoodoo ---- */
  PROPS.hoodoo = function (mb, K) {
    var R = rockMats(K), rnd = rng32(0x40D0), i;
    var y = 0, r = 1.55;
    for (i = 0; i < 7; i++) {
      var h = 1.5 + rnd() * 1.5;
      var r1 = r * (0.62 + rnd() * 0.44);
      mb.push();
      mb.tr((rnd() - 0.5) * 0.45, y, (rnd() - 0.5) * 0.45);
      mb.ry(rnd() * 6.28);
      mb.cyl(0, 0, 0, r, r1, h, 8, R[i % R.length], false, false, 0.38 + i * 0.085);
      mb.pop();
      y += h * 0.97; r = r1;
    }
    // the classic capstone
    mb.push(); mb.tr(0, y, 0); mb.ry(0.4);
    mb.cyl(0, 0, 0, r * 2.25, r * 1.7, 1.25, 8, R[1], true, true, 1.0);
    mb.pop();
    mb.cyl(0, 0, 0, 2.5, 1.9, 0.55, 9, R[2], false, true, 0.35);
    return {};
  };

  /* ----------------------------------------------------------- cactus ---- */
  PROPS.cactus = function (mb, K) {
    var body = mt([0.19, 0.36, 0.20], 0.88, 0, 0, SURF.FOLIAGE, 0.25);
    var body2 = mt([0.24, 0.44, 0.24], 0.86, 0, 0, SURF.FOLIAGE, 0.25);
    var bloom = mt([0.98, 0.42, 0.55], 0.7, 0, 0.5, 0, 1);
    var dirt = mt(mix3(K.pal.ground || [0.4, 0.2, 0.2], [0.55, 0.32, 0.24], 0.5), 0.95);
    var i, a;
    // ribbed trunk — 9 lobes so the silhouette reads as a saguaro
    mb.cyl(0, 0, 0, 0.62, 0.50, 5.6, 9, body, false, true, 0.55);
    for (i = 0; i < 9; i++) {
      a = i / 9 * 6.2832;
      mb.push(); mb.tr(Math.cos(a) * 0.55, 0, Math.sin(a) * 0.55);
      mb.cyl(0, 0.1, 0, 0.14, 0.11, 5.4, 4, body2, false, false, 0.75);
      mb.pop();
    }
    mb.sph(0, 5.6, 0, 0.52, 0.42, 0.52, 8, 5, body, 0.95);
    // two arms at different heights
    var arms = [[1, 2.5, 0.35], [-1, 3.6, -0.25]];
    for (i = 0; i < arms.length; i++) {
      var sgn = arms[i][0], ay = arms[i][1], az = arms[i][2];
      mb.push();
      mb.tr(sgn * 0.45, ay, az); mb.rz(-sgn * 1.15);
      mb.cyl(0, 0, 0, 0.36, 0.33, 1.45, 8, body2, false, false, 0.7);
      mb.tr(0, 1.45, 0); mb.rz(sgn * 1.15);
      mb.cyl(0, 0, 0, 0.34, 0.30, 1.9 + i * 0.6, 8, body, false, true, 0.8);
      mb.sph(0, 1.9 + i * 0.6, 0, 0.32, 0.26, 0.32, 7, 4, body2, 0.95);
      mb.pop();
    }
    if (K.night) { mb.sph(0.1, 5.95, 0.1, 0.16, 0.16, 0.16, 6, 4, bloom, 1); }
    mb.cyl(0, 0, 0, 1.25, 0.95, 0.22, 9, dirt, false, true, 0.4);
    return { sway: 0.0035 };
  };

  /* --------------------------------------------------------- rockArch ---- */
  PROPS.rockArch = function (mb, K) {
    var R = rockMats(K), i;
    var glow = mt(K.pal.railGlow || [1, 0.7, 0.35], 0.3, 0, 2.6, SURF.EMISSIVE, 1);
    var HW = 13.5, H = 12.5, TH = 2.6;
    // two tapered legs
    for (i = -1; i <= 1; i += 2) {
      mb.push(); mb.tr(i * HW, 0, 0);
      mb.cyl(0, 0, 0, 4.6, 2.9, 5.2, 9, R[0], false, false, 0.45);
      mb.cyl(0, 5.2, 0, 2.9, 2.35, 3.4, 9, R[2], false, false, 0.6);
      mb.pop();
    }
    // the span, as a chain of blocks on a catenary-ish curve
    var NSEG = 13;
    for (i = 0; i <= NSEG; i++) {
      var u = i / NSEG * 2 - 1;
      var x = u * HW;
      var yy = H - (u * u) * (H - 8.6);
      var tilt = -u * 0.85;
      mb.push(); mb.tr(x, yy, 0); mb.rz(tilt);
      mb.box(0, 0, 0, HW * 2 / NSEG * 1.25, TH * (1.0 - Math.abs(u) * 0.25), 5.4 - Math.abs(u) * 1.2,
             R[(i % 3)], 0.6, 0.55 + 0.4 * (1 - Math.abs(u)));
      mb.pop();
    }
    // a warm rope-light strung under the arch — this is Signal Canyon after all
    for (i = 0; i <= NSEG; i++) {
      var u2 = i / NSEG * 2 - 1;
      var y2 = H - (u2 * u2) * (H - 8.6) - TH * 0.8;
      mb.sph(u2 * HW, y2 - 0.55 - Math.cos(u2 * 2.2) * 0.25, 2.2, 0.22, 0.22, 0.22, 6, 4, glow, 1);
    }
    return { light: { x: 0, y: 9.5, r: 34, i: 0.85, c: K.pal.railGlow || [1, 0.7, 0.35] } };
  };

  /* ------------------------------------------------------------- mast ---- */
  PROPS.mast = function (mb, K) {
    var steel = mt([0.34, 0.30, 0.30], 0.52, 0.72);
    var steel2 = mt([0.52, 0.46, 0.44], 0.44, 0.78);
    var lamp = mt([1.0, 0.22, 0.20], 0.3, 0, 3.2, SURF.EMISSIVE, 1);
    var dish = mt([0.86, 0.84, 0.80], 0.30, 0.35);
    var glow = mt(K.pal.railGlow || [1, 0.7, 0.35], 0.3, 0, 2.2, SURF.EMISSIVE, 1);
    var i, j, y = 0, r = 1.45, H = 4.6;
    for (i = 0; i < 5; i++) {
      var rt = r * 0.78;
      for (j = 0; j < 3; j++) {
        var a0 = j / 3 * 6.2832, a1 = a0;
        mb.push();
        mb.tr((Math.cos(a0) * r + Math.cos(a1) * rt) * 0.5, y + H * 0.5, (Math.sin(a0) * r + Math.sin(a1) * rt) * 0.5);
        mb.rz(Math.atan2(r - rt, H) * (Math.cos(a0) > 0 ? -1 : 1) * 0.35);
        mb.box(0, 0, 0, 0.19, H, 0.19, steel, 1, 0.55 + i * 0.07);
        mb.pop();
      }
      // cross bracing
      for (j = 0; j < 3; j++) {
        var b0 = j / 3 * 6.2832;
        mb.push(); mb.tr(0, y + H, 0); mb.ry(b0);
        mb.box(r * 0.72, 0, 0, r * 1.5, 0.14, 0.14, steel2, 1, 0.75);
        mb.pop();
        mb.push(); mb.tr(0, y + H * 0.5, 0); mb.ry(b0 + 0.5); mb.rz(0.62);
        mb.box(r * 0.55, 0, 0, r * 1.9, 0.10, 0.10, steel2, 1, 0.7);
        mb.pop();
      }
      y += H; r = rt; H *= 0.93;
    }
    mb.cyl(0, y, 0, 0.16, 0.10, 3.2, 6, steel2, false, false, 0.95);
    mb.sph(0, y + 3.3, 0, 0.30, 0.30, 0.30, 7, 5, lamp, 1);
    // microwave drums + a signal ring
    mb.push(); mb.tr(0, y - 3.2, r * 1.1); mb.rx(1.35);
    mb.cyl(0, 0, 0, 1.25, 1.25, 0.42, 12, dish, true, true, 0.9); mb.pop();
    mb.push(); mb.tr(0, y - 6.0, -r * 1.1); mb.rx(-1.35);
    mb.cyl(0, 0, 0, 0.95, 0.95, 0.36, 12, dish, true, true, 0.9); mb.pop();
    for (i = 0; i < 3; i++) mb.box(0, 2.0 + i * 6.0, 0, r * 2.6, 0.12, 0.12, glow, 1, 1);
    return { light: { x: 0, y: 1, r: 26, i: 0.5, c: K.pal.railGlow || [1, 0.7, 0.35] } };
  };

  /* -------------------------------------------------------- ropeLight ---- */
  PROPS.ropeLight = function (mb, K) {
    var post = mt([0.36, 0.26, 0.20], 0.92);
    var warm = mt([1.0, 0.82, 0.48], 0.3, 0, 3.4, SURF.EMISSIVE, 0);
    var warm2 = mt(K.pal.accent || [1, 0.33, 0.47], 0.3, 0, 3.0, SURF.EMISSIVE, 0);
    var i, SPAN = 12.0, N = 13;
    for (i = -1; i <= 1; i += 2) {
      mb.push(); mb.tr(i * SPAN * 0.5, 0, 0); mb.rz(i * 0.05);
      mb.cyl(0, 0, 0, 0.19, 0.14, 5.4, 7, post, false, true, 0.55);
      mb.box(0, 5.2, 0, 0.9, 0.16, 0.16, post, 1, 0.9);
      mb.pop();
    }
    for (i = 0; i <= N; i++) {
      var u = i / N * 2 - 1;
      var x = u * SPAN * 0.5;
      var y = 5.1 - (1.0 - u * u) * 1.35;
      mb.box(x, y, 0, SPAN / N * 1.1, 0.055, 0.055, post, 1, 0.8);
      if (i < N) {
        var bx = (u + 1 / N) * SPAN * 0.5;
        var by = 5.1 - (1.0 - Math.pow(u + 1 / N, 2)) * 1.35 - 0.26;

  };

  /* ------------------------------------------------------------- shelf ---- */
  PROPS.shelf = function (mb, K) {

    var W = 5.0, H = 4.2, D = 1.1, i, j, k;
    for (i = -1; i <= 1; i += 2) {
      mb.box(i * W * 0.5, H * 0.5, -D * 0.5 + 0.06, 0.16, H, 0.16, frame, 1, 0.9);
      mb.box(i * W * 0.5, H * 0.5, D * 0.5 - 0.06, 0.16, H, 0.16, frame, 1, 0.9);
      mb.box(i * W * 0.5, 0.06, 0, 0.5, 0.12, D + 0.3, frame, 1, 0.5);
    }
    mb.box(0, H * 0.5, -D * 0.5, W, H, 0.08, back, 1, 0.7);
    for (j = 0; j < 4; j++) {

      // merchandise
      var n = 6;
      for (i = 0; i < n; i++) {
        var bw = W / n * (0.60 + rnd() * 0.22);
        var bh = 0.32 + rnd() * 0.30;
        var c = boxCols[(i + j * 3) % boxCols.length];
        mb.box(-W * 0.5 + (i + 0.5) * W / n, sy + 0.05 + bh * 0.5, 0.05, bw, bh, D * (0.45 + rnd() * 0.3),

        mb.box(-W * 0.5 + (i + 0.5) * W / n, sy + 0.05 + bh * 0.72, 0.05 + D * 0.24, bw * 0.7, bh * 0.22, 0.02,
               mt([0.96, 0.97, 1.0], 0.6), 1, 0.9);

  /* -------------------------------------------------------------- neon ---- */
  PROPS.neon = function (mb, K) {

    mb.cyl(0, 0, 0, 0.22, 0.16, 3.4, 7, brace, false, false, 0.7);
    mb.box(0, 5.0, -0.22, 6.6, 3.0, 0.24, back, 1, 0.95);

    mb.box(0, 6.42, -0.02, 6.3, 0.17, 0.17, tube, 1, 1);
    mb.box(0, 3.58, -0.02, 6.3, 0.17, 0.17, tube, 1, 1);
    mb.box(-3.15, 5.0, -0.02, 0.17, 2.85, 0.17, tube, 1, 1);
    mb.box(3.15, 5.0, -0.02, 0.17, 2.85, 0.17, tube, 1, 1);
    mb.plane(0, 5.0, -0.06, 5.9, 2.4, panel);
    // squiggle accent tubes
    for (i = 0; i < 5; i++) {
      mb.push(); mb.tr(-2.4 + i * 1.2, 7.05 + Math.sin(i * 1.7) * 0.22, -0.02); mb.rz(Math.sin(i * 2.3) * 0.7);
      mb.box(0, 0, 0, 0.14, 0.75, 0.14, tube, 1, 1); mb.pop();
    }
    return { textUV: true, light: { c: K.pal.railGlow, r: 17, y: 5.4, i: 0.85 } };
  };

  /* ------------------------------------------- crowd (billboard cluster) -- */
  PROPS.crowd = function (mb, K) {

  /* -------------------------------------------------- shared extra meshes -- */
  function buildItemBox(mb, K) {
    var shell = mt([0.55, 0.85, 1.0], 0.12, 0.35, 0.55, SURF.METAL, 0);
    var edge = mt([1.0, 0.85, 0.35], 0.25, 0.4, 3.2, SURF.EMISSIVE, 0);
    var face = mt([1.0, 0.95, 0.75], 0.3, 0, 2.4, SURF.TEXT, 0);
    var s, i;
    mb.box(0, 0, 0, 1.5, 1.5, 1.5, shell, 1, 1);
    for (s = -1; s <= 1; s += 2) {
      mb.box(0, s * 0.76, 0.76, 1.56, 0.11, 0.11, edge, 1, 1);
      mb.box(0, s * 0.76, -0.76, 1.56, 0.11, 0.11, edge, 1, 1);
      mb.box(s * 0.76, 0.76, 0, 0.11, 0.11, 1.56, edge, 1, 1);
      mb.box(s * 0.76, -0.76, 0, 0.11, 0.11, 1.56, edge, 1, 1);
      mb.box(s * 0.76, 0, 0.76, 0.11, 1.56, 0.11, edge, 1, 1);
      mb.box(s * 0.76, 0, -0.76, 0.11, 1.56, 0.11, edge, 1, 1);
    }
    for (i = 0; i < 4; i++) { mb.push(); mb.ry(i * Math.PI / 2); mb.plane(0, 0, 0.77, 1.05, 1.05, face); mb.pop(); }
    return {};
  }

  function buildRamp(mb, K) {
    var body = mt(K.pal.accent, 0.5, 0.25, 0.10, 0, 0);
    var strip = mt(K.pal.railGlow, 0.3, 0, 3.0, SURF.EMISSIVE, 0);
    var dark = mt([0.10, 0.10, 0.14], 0.6, 0.3);
    var chev = mt([1, 1, 1], 0.4, 0, 1.2, SURF.CROWD, 0);
    var CR = K.rect('chev');
    var s, i;
    // unit ramp: x in -0.5..0.5 (scaled to road width), z 0..1 (length), rises to y=1
    var nSlope = 1 / Math.sqrt(2);
    var a = mb.v(-0.5, 0, 0, 0, nSlope, -nSlope, 0, 0, dark, 0, 0.6);
    var b = mb.v(0.5, 0, 0, 0, nSlope, -nSlope, 1, 0, dark, 0, 0.6);
    var c = mb.v(0.5, 1, 1, 0, nSlope, -nSlope, 1, 1, body, 0, 1);
    var d = mb.v(-0.5, 1, 1, 0, nSlope, -nSlope, 0, 1, body, 0, 1);
    mb.quad(a, b, c, d);
    // tall end face at z = 1
    var e0 = mb.v(-0.5, 0, 1, 0, 0, 1, 0, 0, dark, 0, 0.5);
    var e1 = mb.v(0.5, 0, 1, 0, 0, 1, 1, 0, dark, 0, 0.5);
    var e2 = mb.v(0.5, 1, 1, 0, 0, 1, 1, 1, body, 0, 1);
    var e3 = mb.v(-0.5, 1, 1, 0, 0, 1, 0, 1, body, 0, 1);
    mb.quad(e0, e1, e2, e3);
    // side triangles + glowing edge rails
    for (s = -1; s <= 1; s += 2) {
      var p0 = mb.v(s * 0.5, 0, 0, s, 0, 0, 0, 0, dark, 0, 0.6);
      var p1 = mb.v(s * 0.5, 0, 1, s, 0, 0, 1, 0, dark, 0, 0.5);
      var p2 = mb.v(s * 0.5, 1, 1, s, 0, 0, 1, 1, body, 0, 1);
      if (s > 0) mb.tri(p0, p1, p2); else mb.tri(p2, p1, p0);
      var q0 = mb.v(s * 0.50, 0.012, 0, 0, nSlope, -nSlope, 0, 0, strip, 0, 1);
      var q1 = mb.v(s * 0.44, 0.012, 0, 0, nSlope, -nSlope, 1, 0, strip, 0, 1);
      var q2 = mb.v(s * 0.44, 1.012, 1, 0, nSlope, -nSlope, 1, 1, strip, 0, 1);
      var q3 = mb.v(s * 0.50, 1.012, 1, 0, nSlope, -nSlope, 0, 1, strip, 0, 1);
      if (s > 0) mb.quad(q0, q1, q2, q3); else mb.quad(q3, q2, q1, q0);
    }
    // chevrons climbing the face
    for (i = 0; i < 4; i++) {
      var zz = 0.12 + i * 0.22;
      var k0 = mb.v(-0.40, zz + 0.014, zz, 0, nSlope, -nSlope, CR[0], CR[1] + CR[3], chev, 0, 1);
      var k1 = mb.v(0.40, zz + 0.014, zz, 0, nSlope, -nSlope, CR[0] + CR[2], CR[1] + CR[3], chev, 0, 1);
      var k2 = mb.v(0.40, zz + 0.084, zz + 0.07, 0, nSlope, -nSlope, CR[0] + CR[2], CR[1], chev, 0, 1);
      var k3 = mb.v(-0.40, zz + 0.084, zz + 0.07, 0, nSlope, -nSlope, CR[0], CR[1], chev, 0, 1);
      mb.quad(k0, k1, k2, k3);
    }
    return {};
  }

  function buildHazard(mb, K, kind) {
    if (kind === 'oil') {
      var oil = mt([0.03, 0.03, 0.05], 0.05, 0.6, 0, SURF.WATER, 0);
      var i, n = 14, base = mb.nv;
      mb.v(0, 0.02, 0, 0, 1, 0, 0.5, 0.5, oil, 0, 1);
      for (i = 0; i <= n; i++) {
        var a = i / n * 6.2832, r = 1.0 + Math.sin(a * 3.1) * 0.22 + Math.cos(a * 5.3) * 0.12;
        mb.v(Math.cos(a) * r, 0.02, Math.sin(a) * r, 0, 1, 0, 0.5 + Math.cos(a) * 0.5, 0.5 + Math.sin(a) * 0.5, oil, 0, 1);
      }
      for (i = 0; i < n; i++) mb.tri(base, base + 1 + i, base + 2 + i);
    } else if (kind === 'puddle') {
      var w = mt([0.45, 0.62, 0.78], 0.04, 0.2, 0, SURF.WATER, 0);
      var j, m = 14, b2 = mb.nv;
      mb.v(0, 0.02, 0, 0, 1, 0, 0.5, 0.5, w, 0, 1);
      for (j = 0; j <= m; j++) {
        var a2 = j / m * 6.2832, r2 = 1.0 + Math.sin(a2 * 2.3) * 0.28;
        mb.v(Math.cos(a2) * r2 * 1.3, 0.02, Math.sin(a2) * r2, 0, 1, 0, 0.5, 0.5, w, 0, 1);
      }
      for (j = 0; j < m; j++) mb.tri(b2, b2 + 1 + j, b2 + 2 + j);
    } else if (kind === 'cable') {
      var cab = mt([0.10, 0.10, 0.13], 0.55, 0.1, 0, 0, 0);
      var strp = mt([1.0, 0.72, 0.10], 0.5, 0, 0.8, 0, 0);
      var k;
      for (k = 0; k < 7; k++) {
        var t = (k - 3) / 3;
        mb.box(t * 1.6, 0.13 + Math.cos(t * 1.4) * 0.05, 0, 0.46, 0.26, 1.6, k % 2 ? strp : cab, 1, 0.8);
      }
    } else if (kind === 'fan') {
      var frame = mt([0.34, 0.35, 0.40], 0.4, 0.8, 0, 0, 0);
      var blade = mt([0.70, 0.72, 0.78], 0.3, 0.7, 0, 0, 0);
      var glow2 = mt(K.pal.railGlow, 0.3, 0, 2.2, SURF.EMISSIVE, 0);
      var q;
      mb.cyl(0, 0, 0, 1.9, 1.9, 0.45, 16, frame, true, false, 0.8);
      mb.cyl(0, 0.45, 0, 1.9, 1.75, 0.25, 16, glow2, false, true, 1);
      for (q = 0; q < 5; q++) {
        mb.push(); mb.tr(0, 0.25, 0); mb.ry(q / 5 * 6.2832); mb.rz(0.5);
        mb.box(0.85, 0, 0, 1.6, 0.10, 0.62, blade, 1, 1); mb.pop();
      }
      mb.cyl(0, 0.05, 0, 0.42, 0.34, 0.5, 10, frame, true, true, 1);
    }
    return {};
  }

  /* ==========================================================================
     KARTS + FOX DRIVERS
     One mesh per racer (colours are baked in), a shared tinted wheel mesh, a
     shared boost-flame mesh.  Every kart type gets a genuinely different
     silhouette — you should be able to name the kart from behind at 30 m.
     ========================================================================== */
  function kartMats(r, env) {
    var c = r.colors;
    /* Silhouette rule: ONE dominant body colour, everything structural in a
       dark carbon tone, and the bright trim/accent reserved for thin stripes.
       Without this the kart reads as a stack of pale slabs at race distance. */
    var carbon = mix3([0.055, 0.058, 0.075], c.trim, 0.16);
    return {
      body: mt(c.body, 0.16, 0.35, 0.0, 0, 1),
      body2: mt(scl3(c.body, 0.55), 0.22, 0.30, 0.0, 0, 1),
      trim: mt(carbon, 0.36, 0.45, 0.0, 0, 1),
      acc: mt(c.accent, 0.30, 0.35, 0.10, 0, 1),
      glow: mt(c.glow, 0.30, 0.0, 2.8, SURF.EMISSIVE, 1),
      glowS: mt(c.glow, 0.30, 0.0, 1.4, SURF.EMISSIVE, 1),
      chrome: mt([0.60, 0.62, 0.68], 0.22, 1.0, 0, SURF.METAL, 0),
      steel: mt([0.30, 0.32, 0.37], 0.34, 0.9, 0, 0, 0),
      dark: mt([0.07, 0.07, 0.10], 0.42, 0.25, 0, 0, 0),
      rubber: mt([0.055, 0.055, 0.065], 0.85, 0.0, 0, 0, 0),
      glass: mt([0.30, 0.42, 0.58], 0.05, 0.85, 0.0, SURF.METAL, 0),
      fur: mt(c.fur, 0.78, 0, 0, 0, 1),
      furD: mt(c.furDark, 0.80, 0, 0, 0, 1),
      belly: mt(c.belly, 0.72, 0, 0, 0, 1),
      suit: mt(c.body, 0.55, 0.05, 0, 0, 1),
      suit2: mt(mix3(c.trim, [0.10, 0.11, 0.14], 0.55), 0.50, 0.10, 0, 0, 1),
      visor: mt(r.visor || c.glow, 0.05, 0.75, 0.55, SURF.METAL, 1),
      helmet: mt(c.accent, 0.10, 0.45, 0, 0, 1),
      eye: mt([0.04, 0.03, 0.06], 0.18, 0.1, 0, 0, 0),
      white: mt([0.97, 0.98, 1.0], 0.35, 0, 0, 0, 0),
      plate: mt([0.80, 0.82, 0.86], 0.45, 0.05, 0.03, 0, 0)
    };
  }

  /* ---- the fox / critter driver ---------------------------------------- */
  function buildDriver(mb, r, C, seatY, seatZ, wheelY, wheelZ, scale) {
    scale = scale || 1;
    mb.push();
    mb.tr(0, seatY, seatZ); mb.sc(scale);
    var i, s;
    // --- torso: a racing suit with a chest stripe
    mb.tbox(0, 0, 0, 0.56, 0.40, 0.42, 0.80, 0.80, 0, -0.02, C.suit, 0.92);
    mb.box(0, 0.20, 0.17, 0.30, 0.34, 0.10, C.suit2, 1, 0.95);
    mb.box(0, 0.30, 0.175, 0.44, 0.09, 0.10, C.acc, 1, 0.98);
    // shoulders
    for (s = -1; s <= 1; s += 2) mb.sph(s * 0.235, 0.34, 0.0, 0.135, 0.125, 0.145, 8, 6, C.suit, 0.95);
    // belly fluff peeking out of the suit collar
    mb.sph(0, 0.44, 0.10, 0.16, 0.11, 0.13, 8, 6, C.belly, 1);
    // --- neck + head
    mb.cyl(0, 0.40, 0.02, 0.10, 0.11, 0.10, 8, C.fur, false, false, 1);
    var hy = 0.62;
    mb.sph(0, hy, 0.02, 0.205, 0.195, 0.205, 11, 8, C.fur, 1);
    // cheek ruffs
    for (s = -1; s <= 1; s += 2) mb.sph(s * 0.175, hy - 0.035, -0.01, 0.095, 0.115, 0.10, 8, 6, C.furD, 1);
    // --- snout
    mb.push(); mb.tr(0, hy - 0.045, 0.16); mb.rx(-0.06);
    mb.tbox(0, -0.055, 0, 0.165, 0.115, 0.22, 0.55, 0.55, 0, 0.02, C.fur, 1);
    mb.sph(0, 0.0, 0.09, 0.07, 0.055, 0.075, 7, 5, C.belly, 1);
    mb.sph(0, 0.012, 0.125, 0.038, 0.030, 0.034, 7, 5, C.eye, 1);   // nose
    mb.pop();
    // --- eyes with a catch-light
    for (s = -1; s <= 1; s += 2) {
      mb.sph(s * 0.093, hy + 0.045, 0.158, 0.047, 0.052, 0.040, 8, 6, C.white, 1);
      mb.sph(s * 0.098, hy + 0.042, 0.184, 0.029, 0.033, 0.022, 7, 5, C.eye, 1);
      mb.sph(s * 0.108, hy + 0.062, 0.196, 0.011, 0.011, 0.010, 5, 4, C.white, 1);
      // brow
      mb.push(); mb.tr(s * 0.095, hy + 0.105, 0.152); mb.rz(-s * 0.32);
      mb.box(0, 0, 0, 0.095, 0.022, 0.03, C.furD, 1, 1); mb.pop();
    }
    // --- ears
    var ears = r.ears || 'pointed';
    for (s = -1; s <= 1; s += 2) {
      mb.push(); mb.tr(s * 0.115, hy + 0.135, -0.015); mb.rz(-s * 0.34); mb.rx(-0.16);
      if (ears === 'round') {
        mb.sph(0, 0.055, 0, 0.105, 0.105, 0.045, 9, 6, C.fur, 1);
        mb.sph(0, 0.055, 0.035, 0.062, 0.062, 0.03, 8, 5, C.belly, 1);
      } else if (ears === 'tufted') {
        mb.cyl(0, 0, 0, 0.098, 0.006, 0.30, 7, C.fur, true, false, 1);
        mb.cyl(0, 0.02, 0.028, 0.055, 0.004, 0.24, 7, C.belly, false, false, 1);
        // tuft
        for (i = 0; i < 4; i++) { mb.push(); mb.tr(0, 0.28, 0); mb.rz((i - 1.5) * 0.30); mb.cyl(0, 0, 0, 0.022, 0.0, 0.12, 5, C.furD, false, false, 1); mb.pop(); }
      } else {
        mb.cyl(0, 0, 0, 0.085, 0.006, 0.215, 7, C.fur, true, false, 1);
        mb.cyl(0, 0.015, 0.024, 0.048, 0.004, 0.17, 7, C.belly, false, false, 1);
      }
      mb.pop();
    }
    // --- helmet + visor
    if (r.helmet) {
      mb.sph(0, hy + 0.045, 0.0, 0.245, 0.235, 0.245, 12, 8, C.helmet, 1);
      mb.push(); mb.tr(0, hy + 0.02, 0.10); mb.rx(-0.12);
      mb.sph(0, 0, 0.055, 0.205, 0.115, 0.135, 11, 6, C.visor, 1);
      mb.pop();
      // helmet stripe + chin bar
      mb.box(0, hy + 0.255, -0.02, 0.075, 0.075, 0.42, C.acc, 1, 1);
      mb.push(); mb.tr(0, hy - 0.115, 0.12); mb.rx(0.25);
      mb.box(0, 0, 0, 0.30, 0.075, 0.18, C.helmet, 1, 1); mb.pop();
      // side scoop
      for (s = -1; s <= 1; s += 2) mb.box(s * 0.225, hy + 0.02, -0.10, 0.06, 0.10, 0.16, C.glowS, 1, 1);
    } else {
      // goggles instead
      mb.push(); mb.tr(0, hy + 0.075, 0.09); mb.rx(-0.08);
      for (s = -1; s <= 1; s += 2) {
        mb.cyl(s * 0.095, 0, 0.085, 0.062, 0.062, 0.03, 10, C.visor, true, true, 1);
        mb.cyl(s * 0.095, 0, 0.075, 0.072, 0.072, 0.03, 10, C.dark, true, false, 1);
      }
      mb.box(0, 0, 0.075, 0.30, 0.035, 0.05, C.dark, 1, 1);
      mb.pop();
      mb.box(0, hy + 0.055, -0.06, 0.42, 0.06, 0.32, C.dark, 1, 1);
    }
    // --- arms to the wheel
    var wy = wheelY - seatY, wz = wheelZ - seatZ;
    for (s = -1; s <= 1; s += 2) {
      var sx = s * 0.235, sy2 = 0.31, sz = 0.02;
      var hx = s * 0.175, hy2 = wy + 0.03, hz = wz - 0.03;
      var dx = hx - sx, dy = hy2 - sy2, dz = hz - sz;
      var L = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.3;
      mb.push();
      mb.tr(sx, sy2, sz);
      mb.ry(Math.atan2(dx, dz));
      mb.rx(-Math.asin(clamp(dy / L, -1, 1)));
      mb.cyl(0, 0, 0, 0.060, 0.045, L * 0.55, 7, C.suit, true, false, 0.95);
      mb.push(); mb.tr(0, 0, L * 0.55); mb.rx(0.30);
      mb.cyl(0, 0, 0, 0.047, 0.040, L * 0.48, 7, C.suit2, true, false, 0.95);
      mb.pop();
      mb.pop();
      // paw on the rim
      mb.sph(hx, hy2, hz, 0.072, 0.062, 0.070, 8, 6, C.fur, 1);
      mb.sph(hx, hy2, hz + 0.03, 0.055, 0.05, 0.04, 7, 5, C.belly, 1);
    }
    mb.pop();
    // --- steering wheel (in kart space)
    mb.push(); mb.tr(0, wheelY, wheelZ); mb.rx(-0.62);
    var seg = 14, R = 0.185;
    for (i = 0; i < seg; i++) {
      var a0 = i / seg * 6.2832;
      mb.push(); mb.tr(Math.cos(a0) * R, 0, Math.sin(a0) * R); mb.ry(-a0);
      mb.box(0, 0, 0, 0.055, 0.050, R * 6.2832 / seg * 1.25, i % 3 === 0 ? C.acc : C.dark, 1, 1);
      mb.pop();
    }
    mb.cyl(0, -0.035, 0, 0.065, 0.055, 0.07, 8, C.chrome, true, true, 1);
    for (i = 0; i < 3; i++) { mb.push(); mb.ry(i * 2.094); mb.box(0, 0, R * 0.55, 0.035, 0.03, R * 1.1, C.dark, 1, 1); mb.pop(); }
    mb.pop();
  }

  /* ---- kart bodies ------------------------------------------------------ */
  var KARTS = {};

  KARTS.classic = function (mb, r, C) {
    var i, s;
    mb.box(0, 0.20, -0.02, 1.02, 0.11, 1.86, C.body2, 1, 0.7);              // floor pan
    mb.tbox(0, 0.26, 0.05, 0.98, 0.30, 1.60, 0.88, 0.92, 0, 0, C.body, 0.95);
    for (s = -1; s <= 1; s += 2) {                                          // sidepods
      mb.tbox(s * 0.60, 0.20, -0.05, 0.34, 0.40, 1.24, 0.72, 0.86, -s * 0.03, 0, C.trim, 0.92);
      mb.box(s * 0.60, 0.20, -0.05, 0.37, 0.09, 1.10, C.glowS, 1, 1);
    }
    mb.tbox(0, 0.22, 1.00, 0.86, 0.30, 0.55, 0.42, 0.55, 0, 0.10, C.body, 1);   // nose
    mb.box(0, 0.30, 1.30, 0.94, 0.16, 0.16, C.chrome, 1, 1);                   // bumper
    mb.plane(0, 0.44, 1.10, 0.44, 0.26, C.plate);                              // number plate
    mb.tbox(0, 0.32, -0.18, 0.62, 0.36, 0.60, 0.80, 0.70, 0, -0.06, C.dark, 0.85);  // seat pan
    mb.push(); mb.tr(0, 0.52, -0.46); mb.rx(0.24);
    mb.box(0, 0.22, 0, 0.62, 0.62, 0.12, C.trim, 1, 0.95); mb.pop();
    mb.box(0, 0.48, -0.86, 0.72, 0.46, 0.52, C.dark, 1, 0.9);                  // engine
    mb.box(0, 0.72, -0.86, 0.60, 0.10, 0.44, C.chrome, 1, 1);
    for (s = -1; s <= 1; s += 2) {                                             // rollbar
      mb.push(); mb.tr(s * 0.28, 0.54, -0.54); mb.rz(-s * 0.16);
      mb.cyl(0, 0, 0, 0.055, 0.05, 0.62, 7, C.chrome, false, false, 1); mb.pop();
    }
    mb.push(); mb.tr(0, 1.13, -0.52); mb.rz(Math.PI / 2);
    mb.cyl(0, -0.26, 0, 0.055, 0.055, 0.52, 7, C.chrome, true, true, 1); mb.pop();
    mb.box(0, 0.86, -1.02, 0.86, 0.09, 0.30, C.acc, 1, 1);                     // small wing
    for (s = -1; s <= 1; s += 2) mb.box(s * 0.34, 0.80, -1.02, 0.07, 0.20, 0.30, C.trim, 1, 1);
    mb.push(); mb.tr(0.30, 0.52, -1.02); mb.rx(1.35);                          // exhaust
    mb.cyl(0, 0, 0, 0.075, 0.09, 0.42, 8, C.chrome, false, true, 1); mb.pop();
    mb.push(); mb.tr(-0.30, 0.52, -1.02); mb.rx(1.35);
    mb.cyl(0, 0, 0, 0.075, 0.09, 0.42, 8, C.chrome, false, true, 1); mb.pop();
    mb.box(0, 0.13, 0, 1.04, 0.05, 1.5, C.glow, 1, 1);                         // underglow
    return { seatY: 0.44, seatZ: -0.14, wY: 0.72, wZ: 0.36, wheelR: 0.30, wheelRR: 0.345, wheelW: 0.26, wheelX: 0.60, wheelZ: 0.72, exY: 0.52, exZ: -1.10, exX: 0.30 };
  };

  KARTS.hotrod = function (mb, r, C) {
    var s, i;
