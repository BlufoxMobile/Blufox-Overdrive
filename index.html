        k.aiItemTimer = K.AI_ITEM_MIN + S.rng() * K.AI_ITEM_RAND;
        k._s = path.sample(0);
        k.lapTimes = [];
        S.karts.push(k);
      }
      SIM.karts = S.karts;
      SIM.player = S.karts[ps];

      /* --- track features -------------------------------------------------- */
      buildLayout();

      /* --- camera ---------------------------------------------------------- */
      S.cam = {
        p: [0, 5, -10], look: [0, 1, 0], up: [0, 1, 0], fov: 62, roll: 0,
        ready: false, fovS: 62, rollS: 0, shakeT: 0
      };

      /* --- ghost ----------------------------------------------------------- */
      buildGhost(cfg);

      /* --- first derive so the renderer has something before step() -------- */
      for (i = 0; i < 8; i++) derive(S.karts[i], 0);
      rank();
      updateCamera(0.016, null);

      S.ok = true;
      return true;
    } catch (e) {
      try { S = null; } catch (e2) {}
      return false;
    }
  };

  SIM.reset = function reset() {
    try {
      if (!S || !S.cfg) return false;
      return SIM.init(S.cfg);
    } catch (e) { return false; }
  };

  SIM.dispose = function () { S = null; };

  /* ===========================================================================
     5.  TRACK LAYOUT  (pads / boxes / hazards / jumps -> distance space)
     Track features are authored at a track-t.  Karts live in distance-from-the-
     start-line.  featureDistance = mod(featT - startLine, 1) * L, so every
     feature lands once per lap at a stable `along`.
     =========================================================================== */
  function tToDist(t) { return mod(num(t, 0) - S.startLine, 1) * S.L; }

  function buildLayout() {
    var def = S.def, path = S.path, i, j, a, d, tt, w, e;

    /* item boxes -> pickups */
    SIM.pickups.length = 0;
    a = def.itemBoxes || [];
    for (i = 0; i < a.length; i++) {
      var box = a[i];
      var lanes = (box.lanes && box.lanes.length) ? box.lanes : [0];
      tt = mod(num(box.t, 0), 1);
      w = path.widthAt(tt) || K.LANE_REF;
      d = tToDist(tt);
      for (j = 0; j < lanes.length; j++) {
        var lat = clamp(num(lanes[j], 0), -1, 1) * w * 0.82;
        var wp = path.posAt(tt, lat, 1.1);
        SIM.pickups.push({
          t: tt, lane: lat, d: d, w: w,
          p: [wp[0], wp[1], wp[2]],
          active: true, respawn: 0, taken: -1
        });
      }
    }

    /* boost pads */
    SIM.pads.length = 0;
    a = def.boostPads || [];
    for (i = 0; i < a.length; i++) {
      e = a[i];
      tt = mod(num(e.t, 0), 1);
      w = path.widthAt(tt) || K.LANE_REF;
      var side = clamp(num(e.side, 0), -1, 1);
      var plane = side * w * 0.5;
      var pp = path.posAt(tt, plane, 0.05);
      SIM.pads.push({
        t: tt, lane: plane, d: d = tToDist(tt), w: w,
        halfW: max(1.5, num(e.w, 3) * 0.5) + 1.2,
        halfLen: max(2.5, num(e.len, 8) * 0.5),
        p: [pp[0], pp[1], pp[2]]
      });
    }

    /* hazards */
    SIM.hazards.length = 0;
    a = def.hazards || [];
    for (i = 0; i < a.length; i++) {
      e = a[i];
      tt = mod(num(e.t, 0), 1);
      w = path.widthAt(tt) || K.LANE_REF;
      /* content note: hazards[].off is NEGATIVE — lateral = side*(w+off) */
      var hl = clamp(num(e.side, 0) * (w + num(e.off, -4)), -w + 0.6, w - 0.6);
      var hp = path.posAt(tt, hl, 0.1);
      var spec = HAZARD[e.kind] || HAZARD.cone;
      SIM.hazards.push({
        kind: e.kind || 'cone', t: tt, lane: hl, d: tToDist(tt), w: w,
        spec: spec, p: [hp[0], hp[1], hp[2]], cool: 0
      });
    }

    /* jumps */
    SIM.jumps.length = 0;
    a = def.jumps || [];
    for (i = 0; i < a.length; i++) {
      e = a[i];
      tt = mod(num(e.t, 0), 1);
      var jp = path.posAt(tt, 0, 0);
      SIM.jumps.push({
        t: tt, d: tToDist(tt), power: clamp(num(e.power, 1), 0.2, 2.5),
        p: [jp[0], jp[1], jp[2]]
      });
    }
  }

  /* ===========================================================================
     6.  GHOST  (20 Hz time-trial recorder / playback)
     =========================================================================== */
  function buildGhost(cfg) {
    var g = {
      hz: K.GHOST_HZ,
      dtRec: 1 / K.GHOST_HZ,
      recording: (S.mode === 'tt'),
      frames: [],            // flat: [time, distance, lane, yaw, speed] * n
      data: null,            // playback source (same flat layout)
      playing: false,
      time: 0,
      acc: 0,
      bestTime: num(cfg.ghostTime, 0),
      racerId: cfg.ghostRacer || null,
      kart: {
        active: false, p: [0, 0, 0], yaw: 0, pitch: 0, roll: 0, speed: 0,
        distance: 0, lane: 0, t: 0, wheelSpin: 0, hop: 0, squash: 0,
        steer: 0, boost: 0
      }
    };
    /* load a previously saved ghost */
    var src = cfg.ghost;
    if (src && src.length >= 10) { g.data = src; g.playing = true; g.kart.active = true; }

    g.reset = function () { g.frames.length = 0; g.time = 0; g.acc = 0; };
    g.save = function () { return g.frames.slice(0); };
    g.load = function (arr) {
      if (arr && arr.length >= 10) { g.data = arr.slice(0); g.playing = true; g.kart.active = true; return true; }
      g.data = null; g.playing = false; g.kart.active = false; return false;
    };
    /** sample(time) -> the ghost kart state at `time` (also updates g.kart) */
    g.sample = function (time) {
      var d = g.data;
      if (!d || d.length < 10) { g.kart.active = false; return g.kart; }
      var n = d.length / 5;
      var lo = 0, hi = n - 1, mid;
      if (time <= d[0]) { lo = 0; hi = 0; }
      else if (time >= d[(n - 1) * 5]) { lo = n - 1; hi = n - 1; }
      else {
        while (hi - lo > 1) { mid = (lo + hi) >> 1; if (d[mid * 5] <= time) lo = mid; else hi = mid; }
      }
      var a = lo * 5, b = hi * 5;
      var t0 = d[a], t1 = d[b];
      var f = (t1 > t0) ? clamp((time - t0) / (t1 - t0), 0, 1) : 0;
      var dist = lerp(d[a + 1], d[b + 1], f);
      var lane = lerp(d[a + 2], d[b + 2], f);
      var y0 = d[a + 3], y1 = d[b + 3];
      var dy = mod(y1 - y0 + PI, TAU) - PI;
      var gk = g.kart;
      gk.distance = dist; gk.lane = lane;
      gk.speed = lerp(d[a + 4], d[b + 4], f);
      gk.yaw = y0 + dy * f;
      gk.t = mod(S.startLine + dist / S.L, 1);
      var s = S.path.sample(gk.t, S.smp3);
      gk.p[0] = s.p[0] + s.right[0] * lane;
      gk.p[1] = s.p[1] + s.right[1] * lane;
      gk.p[2] = s.p[2] + s.right[2] * lane;
      gk.pitch = Math.asin(clamp(s.fwd[1], -1, 1));
      gk.roll = -s.bank;
      gk.wheelSpin = mod(gk.wheelSpin + gk.speed * 0.02 / K.WHEEL_R, TAU);
      gk.active = true;
      return gk;
    };
    S.ghost = g;
    SIM.ghost = g;
  }

  /* ===========================================================================
     7.  DERIVED RENDER STATE
     Everything render.js / the camera consume is computed here from
     (distance, lane, speed, lateralSpeed, drift, air).
     =========================================================================== */
  function derive(k, dt) {
    var path = S.path;
    k.t = mod(S.startLine + k.distance / S.L, 1);
    var s = path.sample(k.t, k._s);
    var w = s.w || K.LANE_REF;
    k.width = w;
    k.curv = s.curv;
    var scale = w / K.LANE_REF;
    k.laneN = k.lane / (scale || 1);

    /* Safety clamp: the wall in stepKart() uses widthAt() at the START of the
       step, so on a road that narrows underneath a kart the lane can end a few
       millimetres wide of the ribbon.  Re-clamp against the exact interpolated
       half-width here so |lane| <= w is an invariant the renderer can trust. */
    if (k.lane > w) { k.lane = w; if (k.lateralSpeed > 0) k.lateralSpeed = 0; }
    else if (k.lane < -w) { k.lane = -w; if (k.lateralSpeed < 0) k.lateralSpeed = 0; }
    k.laneN = k.lane / (scale || 1);

    /* ---- position ------------------------------------------------------- */
    var lane = k.lane, h = K.RIDE_H + k.airH;
    k.p[0] = s.p[0] + s.right[0] * lane + s.up[0] * h;
    k.p[1] = s.p[1] + s.right[1] * lane + s.up[1] * h;
    k.p[2] = s.p[2] + s.right[2] * lane + s.up[2] * h;
    k.groundY = s.p[1] + s.right[1] * lane;
    k.groundNormal[0] = s.up[0]; k.groundNormal[1] = s.up[1]; k.groundNormal[2] = s.up[2];
    k.onRoad = abs(lane) <= w;

    /* ---- orientation ---------------------------------------------------- */
    var yawBase = atan2(s.fwd[0], s.fwd[2]);
    /* slip angle from the real lateral velocity */
    var slip = atan2(k.lateralSpeed, max(12, k.speed));
    /* drift kick: the kart visibly points INTO the slide */
    var dk = 0;
    if (k.drifting) dk = k.driftDir * K.YAW_DRIFT * clamp(0.45 + k.drift * 0.55, 0, 1);
    var off = clamp(slip * 0.62 + dk + k.steer * 0.05, -0.85, 0.85);
    if (k.spinout > 0) off += k.spinout * 9.0 * (k.driftDir || 1);
    k.yaw = yawBase + off;
    k.yawOffset = off;

    /* pitch: slope of the centreline, plus the ballistic arc while airborne */
    var pitch = Math.asin(clamp(s.fwd[1], -1, 1));
    if (k.airborne) pitch = lerp(pitch, atan2(k.airVy, max(10, k.speed)) * 0.75, 0.85);
    k.pitch = pitch;

    /* roll: surface bank (content's +bank rolls `up` toward -right, so the
       render-space roll is its negation) plus a lean into the turn */
    var leanT = clamp(k.steer * 0.16 + (k.drifting ? k.driftDir * 0.11 : 0)
                    + clamp(-k.curv * k.speed * k.speed * 0.00055, -0.14, 0.14), -K.ROLL_LEAN, K.ROLL_LEAN);
    if (k.airborne) leanT *= 0.5;
    k.lean = (dt > 0) ? ease(k.lean, leanT, 9, dt) : leanT;
    k.roll = -s.bank + k.lean;

    /* ---- wheels / hop / squash ------------------------------------------ */
    if (dt > 0) {
      k.wheelSpin = mod(k.wheelSpin + (k.speed / K.WHEEL_R) * dt, TAU);
      /* drift hop: a short arc at the moment the drift starts */
      if (k.hopT > 0) { k.hopT = max(0, k.hopT - dt); }
      /* squash spring (critically damped-ish) */
      k.squashV += (-k.squash * 260 - k.squashV * 22) * dt;
      k.squash = clamp(k.squash + k.squashV * dt, -0.6, 0.9);
      if (abs(k.squash) < 0.002 && abs(k.squashV) < 0.02) { k.squash = 0; k.squashV = 0; }
    }
    var hop = k.airH;
    if (k.hopT > 0) hop += sin(PI * (1 - k.hopT / 0.26)) * 0.42;
    k.hop = hop;

    /* ---- velocity for FX / audio ---------------------------------------- */
    k.fwdSpeed = k.speed;
    k.vel[0] = s.fwd[0] * k.speed + s.right[0] * k.lateralSpeed;
    k.vel[1] = s.fwd[1] * k.speed + s.right[1] * k.lateralSpeed + (k.airborne ? k.airVy : 0);
    k.vel[2] = s.fwd[2] * k.speed + s.right[2] * k.lateralSpeed;

    /* ---- surface --------------------------------------------------------- */
    var an = abs(k.laneN), surf;
    if (k.onPad > 0) surf = 'boost';
    else if (an > K.SHOULDER) surf = 'off';
    else if (an > K.SHOULDER - 1.6) surf = 'curb';
    else if (S.grip < 0.8) surf = 'ice';
    else surf = 'road';
    if (surf !== k.surface) {
      k.lastSurface = k.surface;
      k.surface = surf;
      if (SIM.state.phase === 'racing') {
        emit('surface', { slot: k.slot, from: k.lastSurface, to: surf, p: pOf(k) });
      }
    }
    k.progress = k.distance / S.L;
    k.boostTime = k.boost;
    k.boostMeter = clamp(k.boost / K.ITEM_BOOST, 0, 1);
    k.itemCharges = (k.item ? max(1, k.itemCharges) : 0);
    /* CONTRACT.md names for the two fields the addendum kept on their old
       names — both spellings are live so either module can read either. */
    k.lateral = k.lane;
    k.driftCharge = k.drift;
    k.squashed = k.squash;
  }

  /* ===========================================================================
     8.  HITS + ITEMS
     =========================================================================== */
  /** The locked hit response. `by` is the slot that caused it (or -1). */
  function hitKart(k, by, itemId) {
    if (!k || k.finished) return false;
    if (k.hitCooldown > 0 || k.invuln > 0 || k.ghostTime > 0) return false;
    if (k.shield > 0) {
      k.shield = 0; k.hitCooldown = K.SHIELD_COOLDOWN;
      emit('shieldBreak', { slot: k.slot, by: (by === undefined ? -1 : by), p: pOf(k) });
      return false;
    }
    k.stun = K.HIT_STUN;
    k.speed *= K.HIT_SPEED;
    k.hitCooldown = K.HIT_COOLDOWN;
    k.spinout = K.HIT_STUN;
    k.invuln = 0;
    k.drift = 0; k.drifting = false; k.driftDir = 0; k.driftStage = 0;
    emit('itemHit', { slot: k.slot, by: (by === undefined ? -1 : by), item: itemId || null, p: pOf(k) });
    emit('spin', { slot: k.slot, p: pOf(k) });
    return true;
  }

  /** soft hit — hazards: slow + optional spin, no full stun */
  function hazardHit(k, hz) {
    if (!k || k.finished || k.ghostTime > 0 || k.invuln > 0) return;
    if (k.hitCooldown > 0) return;
    var sp = hz.spec;
    k.speed *= sp.slow;
    k.hitCooldown = sp.cool;
    if (sp.spin > 0) {
      k.stun = max(k.stun, sp.spin);
      k.spinout = max(k.spinout, sp.spin);
      k.drift = 0; k.drifting = false; k.driftStage = 0;
      emit('spin', { slot: k.slot, p: pOf(k) });
    } else {
      emit('bump', { a: k.slot, b: -1, force: 1 - sp.slow, p: pOf(k) });
    }
    if (sp.push) k.lateralSpeed += sign(k.lane - hz.lane || 1) * sp.push;
    emit('hazard', { slot: k.slot, kind: hz.kind, p: pOf(k) });
  }

  function itemById(id) {
    var c = C();
    if (!c || !c.ITEMS) return null;
    for (var i = 0; i < c.ITEMS.length; i++) if (c.ITEMS[i].id === id) return c.ITEMS[i];
    return null;
  }

  /** nearest rival AHEAD of k within `range` metres (by distance), or null */
  function rivalAhead(k, range) {
    var best = null, bd = Infinity, i, o, d;
    for (i = 0; i < S.karts.length; i++) {
      o = S.karts[i];
      if (o === k || o.finished) continue;
      d = o.distance - k.distance;
      if (d > 0 && d < range && d < bd) { bd = d; best = o; }
    }
    return best;
  }
  function rivalBehind(k, range) {
    var best = null, bd = Infinity, i, o, d;
    for (i = 0; i < S.karts.length; i++) {
      o = S.karts[i];
      if (o === k || o.finished) continue;
      d = k.distance - o.distance;
      if (d > 0 && d < range && d < bd) { bd = d; best = o; }
    }
    return best;
  }

  function dropWorldItem(kind, k, back, life, extra) {
    var d = k.distance - back;
    var t = mod(S.startLine + d / S.L, 1);
    var s = S.path.sample(t, S.smp2);
    var lane = clamp(k.lane, -s.w + 0.5, s.w - 0.5);
    var it = {
      id: _idSeq++, kind: kind, ownerSlot: k.slot,
      distance: d, lane: lane, t: t,
      p: [s.p[0] + s.right[0] * lane, s.p[1] + s.right[1] * lane + 0.4, s.p[2] + s.right[2] * lane],
      vel: [0, 0, 0], yaw: atan2(s.fwd[0], s.fwd[2]),
      life: life, maxLife: life, armed: 0.35, target: -1, speed: 0, active: true
    };
    if (extra) for (var key in extra) if (extra.hasOwnProperty(key)) it[key] = extra[key];
    SIM.itemsInWorld.push(it);
    if (SIM.itemsInWorld.length > 48) SIM.itemsInWorld.splice(0, SIM.itemsInWorld.length - 48);
    return it;
  }

  /**
   * useItem(k) — fires whatever k is holding.
   * The four originals keep their exact mechanics; the four rarer ones are new.
   */
  function useItem(k) {
    if (!k || k.item === null || k.finished) return false;
    if (SIM.state.phase === 'countdown') return false;
    var it = k.item, id = it.id || 'gig_boost';

    emit('itemUse', { slot: k.slot, item: id, p: pOf(k) });

    if (id === 'gig_boost') {
      k.boost = K.ITEM_BOOST;                                   /* LOCKED 2.8 */
    } else if (id === 'xfi_shield') {
      k.shield = K.ITEM_SHIELD;                                 /* LOCKED 7   */
    } else if (id === 'signal_pulse') {
      /* LOCKED: instantly hits the closest rival ahead within 100 m.  We also
         push a short-lived visual bolt into itemsInWorld so fx.js has
         something to draw travelling to the victim. */
      var target = rivalAhead(k, K.PULSE_RANGE);
      var bolt = dropWorldItem('signal_pulse', k, 0, 0.35, { speed: 260, homing: 1 });
      if (target) {
        bolt.target = target.slot;
        hitKart(target, k.slot, id);
      } else {
        bolt.target = -1;
      }
    } else if (id === 'dead_zone') {
      dropWorldItem('dead_zone', k, K.TRAP_DROP_BACK, K.TRAP_LIFE, { trap: 1 });
    } else if (id === 'static_wall') {
      dropWorldItem('static_wall', k, K.TRAP_DROP_BACK, 24, { trap: 1 });
      k.itemCharges--;
      if (k.itemCharges > 0) return true;                       /* keep holding */
    } else if (id === 'buffer_bomb') {
      /* a real homing projectile: chases the next kart ahead and bursts */
      var tgt = rivalAhead(k, 400);
      dropWorldItem('buffer_bomb', k, -6, num(it.life, 3.2), {
        trap: 0, homing: 1, speed: k.speed + num(it.speed, 34),
        target: tgt ? tgt.slot : -1, radius: num(it.radius, 18)
      });
    } else if (id === 'ghost_mode') {
      k.ghostTime = num(it.life, 6);
      k.invuln = max(k.invuln, k.ghostTime);
      k.boost = max(k.boost, 1.0);
    } else if (id === 'fiber_bolt') {
      /* throttles the whole field ahead */
      var i, o, n = 0;
      for (i = 0; i < S.karts.length; i++) {
        o = S.karts[i];
        if (o === k || o.finished) continue;
        if (o.distance > k.distance) {
          o.shrunk = max(o.shrunk, num(it.life, 7));
          hitKart(o, k.slot, id);
          n++;
        }
      }
      emit('zap', { slot: k.slot, count: n, p: pOf(k) });
    } else {
      k.boost = max(k.boost, 1.5);
    }

    k.item = null;
    k.itemCharges = 0;
    return true;
  }
  SIM.useItem = function (slot) {
    try { return useItem(S && S.karts[slot | 0]); } catch (e) { return false; }
  };

  /** grant a fresh item, rubber-banded by place */
  function giveItem(k) {
    if (k.item || k.itemRolling > 0) return;
    var c = C();
    var def = (c && c.rollItem) ? c.rollItem(k.place, S.rng) : null;
    if (!def) return;
    if (k.isPlayer) {
      /* the player gets the roulette; AI locks instantly */
      k.itemRolling = 0.85;
      k.itemPending = def;
      emit('itemBox', { slot: k.slot, p: pOf(k) });
    } else {
      k.item = def;
      k.itemCharges = num(def.charges, 1);
      emit('itemBox', { slot: k.slot, p: pOf(k) });
      emit('itemLock', { slot: k.slot, item: def.id, p: pOf(k) });
    }
  }

  /* ---- world item update (traps + projectiles) --------------------------- */
  function stepWorldItems(dt) {
    var arr = SIM.itemsInWorld, i, it, k, j, dd, ln, s, scale, w;
    for (i = arr.length - 1; i >= 0; i--) {
      it = arr[i];
      it.life -= dt;
      if (it.armed > 0) it.armed -= dt;

      if (it.homing && it.kind === 'buffer_bomb') {
        /* travel forward along the ribbon, homing the target's lane */
        it.distance += it.speed * dt;
        var tk = (it.target >= 0) ? S.karts[it.target] : null;
        if (tk && !tk.finished) {
          it.lane += clamp(tk.lane - it.lane, -14 * dt, 14 * dt) * 3.2;
          if (tk.distance - it.distance < 3 && tk.distance - it.distance > -6) it.life = -1;
        }
        it.t = mod(S.startLine + it.distance / S.L, 1);
        s = S.path.sample(it.t, S.smp2);
        it.lane = clamp(it.lane, -s.w, s.w);
        it.p[0] = s.p[0] + s.right[0] * it.lane;
        it.p[1] = s.p[1] + s.right[1] * it.lane + 0.9;
        it.p[2] = s.p[2] + s.right[2] * it.lane;
        it.yaw = atan2(s.fwd[0], s.fwd[2]);
        if (it.life <= 0) {
          /* burst: everything inside `radius` metres takes the hit */
          emit('explode', { p: [it.p[0], it.p[1], it.p[2]], radius: it.radius, by: it.ownerSlot });
          for (j = 0; j < S.karts.length; j++) {
            k = S.karts[j];
            if (k.finished) continue;
            dd = abs(ringDelta(it.distance, k.distance, S.L));
            if (dd < it.radius && abs(k.lane - it.lane) < it.radius * 0.5) hitKart(k, it.ownerSlot, 'buffer_bomb');
          }
          arr.splice(i, 1);
          continue;
        }
      } else if (it.kind === 'signal_pulse') {
        /* pure visual: fly to the victim */
        var vt = (it.target >= 0) ? S.karts[it.target] : null;
        if (vt) { it.p[0] = vt.p[0]; it.p[1] = vt.p[1] + 0.9; it.p[2] = vt.p[2]; }
        if (it.life <= 0) { arr.splice(i, 1); continue; }
      } else {
        /* a static trap */
        if (it.life <= 0) {
          emit('itemExpire', { id: it.id, kind: it.kind, p: [it.p[0], it.p[1], it.p[2]] });
          arr.splice(i, 1);
          continue;
        }
        for (j = 0; j < S.karts.length; j++) {
          k = S.karts[j];
          if (k.finished) continue;
          if (k.slot === it.ownerSlot && it.armed > 0) continue;
          if (k.ghostTime > 0 || k.invuln > 0) continue;
          dd = abs(ringDelta(it.distance, k.distance, S.L));
          if (dd >= K.TRAP_DIST) continue;
          scale = (k.width || K.LANE_REF) / K.LANE_REF;
          ln = (k.lane - it.lane) / scale;
          if (abs(ln) >= K.TRAP_LANE) continue;
          it.life = 0;
          hitKart(k, it.ownerSlot, it.kind);
          break;
        }
      }
    }
  }

  /* ===========================================================================
     9.  AI
     Base behaviour is locked (wander + curvature feed-forward + drift threshold
     + item timer).  On top of it: a racing line toward the inside of the corner
     ahead, hazard avoidance, boost-pad and item-box magnetism, a soft corner
     speed limit, and smarter item choice.  Difficulty only touches aiSkill and
     the rubber-band clamp.
     =========================================================================== */
  function aiThink(k, dt, curve) {
    var rd = k.racer || {};
    var aidef = rd.ai || {};
    var scale = (k.width || K.LANE_REF) / K.LANE_REF;
    var rng = S.rng;

    /* --- wander target (LOCKED cadence) --------------------------------- */
    k.aiThink -= dt;
    if (k.aiThink < 0) {
      k.targetLane = (rng() - 0.5) * K.AI_WANDER;
      k.aiThink = K.AI_THINK_MIN + rng() * K.AI_THINK_RAND;
      k.aiWander = k.targetLane;
    }

    /* --- racing line: aim at the inside of the corner ~40 m ahead -------- */
    var look = clamp(30 + k.speed * 0.45, 25, 80);
    var tAhead = mod(S.startLine + (k.distance + look) / S.L, 1);
    var cAhead = S.path.curvAt(tAhead);
    var lineN = sign(cAhead) * clamp(abs(cAhead) / 0.020, 0, 1) * 6.4;     /* inside */
    lineN += num(aidef.lineBias, 0) * 3.2;
    var skillQ = clamp(num(aidef.skill, 0.75), 0, 1);
    /* blend the disciplined line with the locked wander */
    var wander = num(k.aiWander, k.targetLane);
    var targetN = lerp(wander, lineN, 0.45 + 0.45 * skillQ);

    /* --- avoid hazards straight ahead ------------------------------------ */
    var i, hz, dd;
    for (i = 0; i < SIM.hazards.length; i++) {
      hz = SIM.hazards[i];
      dd = ringDelta(mod(k.distance, S.L), hz.d, S.L);
      if (dd > 2 && dd < 45) {
        var hn = hz.lane / scale;
        if (abs(targetN - hn) < 3.2) targetN = hn + (targetN >= hn ? 1 : -1) * 4.2;
      }
    }
    /* --- grab boost pads / item boxes if they are nearly on our line ----- */
    var want = null, wantD = 1e9;
    for (i = 0; i < SIM.pads.length; i++) {
      dd = ringDelta(mod(k.distance, S.L), SIM.pads[i].d, S.L);
      if (dd > 4 && dd < 60 && dd < wantD) {
        var pn = SIM.pads[i].lane / scale;
        if (abs(pn - targetN) < 6.5) { want = pn; wantD = dd; }
      }
    }
    if (want === null && !k.item) {
      for (i = 0; i < SIM.pickups.length; i++) {
        var pk = SIM.pickups[i];
        if (!pk.active) continue;
        dd = ringDelta(mod(k.distance, S.L), pk.d, S.L);
        if (dd > 4 && dd < 55 && dd < wantD) {
          var qn = pk.lane / scale;
          if (abs(qn - targetN) < 6.0) { want = qn; wantD = dd; }
        }
      }
    }
    if (want !== null) targetN = lerp(targetN, want, 0.7);

    targetN = clamp(targetN, -(K.SHOULDER - 0.8), K.SHOULDER - 0.8);
    k.targetLane = targetN;
    k.aiTarget = targetN * scale;

    /* --- LOCKED steer law ------------------------------------------------ */
    var laneN = k.lane / scale;
    var steer = clamp(
      (targetN - laneN) * K.AI_STEER_P +
      curve * k.speed * k.speed * K.AI_STEER_C / (K.AI_STEER_H + num(rd.handling, 4)),
      -1, 1);

    /* --- drift decision --------------------------------------------------
       The locked rule is "AI drifts when |curve| > 0.003, 90% of the time".
       The original rolled that 90% EVERY FRAME, so an AI drift survived about
       ten frames on average and almost never banked a mini-turbo — which is
       why the old AI leaned so hard on the rubber band.  Same threshold, same
       probability, but the roll is now made once per corner and held, so the
       field actually earns its drift boosts.  This is the single biggest
       reason HARD is hard. */
    var inCorner = abs(curve) > K.AI_DRIFT_CURV;
    if (inCorner && !k._inCorner) k._driftRoll = (rng() < K.AI_DRIFT_CHANCE);
    k._inCorner = inCorner;
    var drift = inCorner && k._driftRoll;

    /* --- items: LOCKED 3..8 s cadence, smarter choice -------------------- */
    k.aiItemTimer -= dt;
    if (k.item && k.aiItemTimer < 0) {
      var id = k.item.id, fire = true;
      if (id === 'xfi_shield') {
        /* hold the shield until somebody is actually close behind */
        var chaser = rivalBehind(k, 55);
        fire = !!chaser || k.place <= 3;
      } else if (id === 'signal_pulse' || id === 'buffer_bomb') {
        fire = !!rivalAhead(k, id === 'signal_pulse' ? K.PULSE_RANGE : 320);
      } else if (id === 'dead_zone' || id === 'static_wall') {
        fire = !!rivalBehind(k, 90) || k.aiItemTimer < -3;
      } else if (id === 'fiber_bolt') {
        fire = k.place > 3;
      }
      if (fire) {
        useItem(k);
        k.aiItemTimer = K.AI_ITEM_MIN + rng() * K.AI_ITEM_RAND;
      } else if (k.aiItemTimer < -6) {
        useItem(k);
        k.aiItemTimer = K.AI_ITEM_MIN + rng() * K.AI_ITEM_RAND;
      }
    }

    k._aiSteer = steer;
    k._aiDrift = drift;
  }

  /* ===========================================================================
     10.  THE STEP
     =========================================================================== */
  /**
   * SIM.step(dt, input)
   * `input` is the BFX.UI.input shape:
   *   {steer:-1..1, throttle:0..1, brake:0..1, drift, driftPressed,
   *    item, itemPressed, look, pausePressed, anyPressed}
   */
  SIM.step = function step(dt, input) {
    if (!S) return;
    try { stepInner(dt, input); }
    catch (e) {
      /* never let a physics exception escape into the frame loop */
      try { if (typeof console !== 'undefined' && console.warn) console.warn('[BFX.SIM] step:', e && e.message); } catch (e2) {}
    }
  };

  function stepInner(dt, input) {
    dt = min(0.05, max(0, num(dt, 0)));                 /* LOCKED clamp */
    input = input || {};
    var st = SIM.state, i, j, k;
    S.elapsed += dt;

    /* ------------------------------------------------ countdown ---------- */
    if (st.phase === 'countdown') {
      var old = Math.ceil(st.countdown);
      st.countdown -= dt;
      var thr = num(input.throttle, 1);
      /* rocket start: you must NOT be holding from the lights; release, then
         stab the throttle inside the final window. */
      if (thr < 0.2) S.rocketArmed = true;
      if (Math.ceil(st.countdown) !== old) {
        if (st.countdown > 0) emit('countdown', { n: Math.ceil(st.countdown), p: pOf(SIM.player) });
      }
      if (st.countdown <= 0) {
        st.countdown = 0;
        st.phase = 'racing';
        st.started = true;
        emit('go', { p: pOf(SIM.player) });
        /* award the rocket start */
        if (S.rocketArmed && !S.rocketUsed && thr > 0.5 && S.rocketWindow > 0) {
          SIM.player.boost = max(SIM.player.boost, K.ROCKET_BOOST);
          S.rocketUsed = true;
          emit('rocketStart', { slot: SIM.player.slot, p: pOf(SIM.player) });
        }
        /* every AI gets a small, skill-weighted launch */
        for (i = 0; i < S.karts.length; i++) {
          k = S.karts[i];
          if (k.isPlayer) continue;
          if (S.rng() < 0.35 * clamp(num(k.racer && k.racer.ai && k.racer.ai.skill, 0.7), 0, 1)) {
            k.boost = max(k.boost, 0.9);
            emit('rocketStart', { slot: k.slot, p: pOf(k) });
          }
        }
      } else {
        /* track whether the throttle is down inside the window */
        if (st.countdown <= K.ROCKET_WINDOW && thr > 0.5 && S.rocketArmed) S.rocketWindow = 1;
        else if (st.countdown > K.ROCKET_WINDOW) S.rocketWindow = 0;
      }
      for (i = 0; i < S.karts.length; i++) derive(S.karts[i], dt);
      rank();
      updateCamera(dt, input);
      return;                                            /* LOCKED: no physics */
    }

    if (st.phase === 'finished') {
      /* results are up; keep deriving so the camera can orbit smoothly */
      for (i = 0; i < S.karts.length; i++) derive(S.karts[i], dt);
      updateCamera(dt, input);
      return;
    }

    st.raceTime += dt;
    st.time = st.raceTime;

    /* ------------------------------------------------ pickups / traps ----- */
    for (i = 0; i < SIM.pickups.length; i++) {
      var pu = SIM.pickups[i];
      if (!pu.active) {
        pu.respawn -= dt;
        if (pu.respawn <= 0) { pu.active = true; pu.respawn = 0; }
      }
    }
    stepWorldItems(dt);

    /* ------------------------------------------------ per-kart ----------- */
    for (i = 0; i < S.karts.length; i++) {
      k = S.karts[i];
      if (k.finished) { derive(k, dt); continue; }
      stepKart(k, dt, input);
    }

    /* ------------------------------------------------ separation --------- */
    /* LOCKED: within 2.6 m along and 2.1 lane units, push apart at 5 m/s and
       bleed 12 m/s^2 off the faster one. */
    var a, b, dir, fast, sa, sb, la, lb;
    for (i = 0; i < 8; i++) {
      for (j = i + 1; j < 8; j++) {
        a = S.karts[i]; b = S.karts[j];
        if (!a || !b) continue;
        if (a.finished || b.finished) continue;
        if (abs(a.distance - b.distance) >= K.SEP_DIST) continue;
        sa = (a.width || K.LANE_REF) / K.LANE_REF;
        sb = (b.width || K.LANE_REF) / K.LANE_REF;
        la = a.lane / sa; lb = b.lane / sb;
        if (abs(la - lb) >= K.SEP_LANE) continue;
        dir = la >= lb ? 1 : -1;
        la = clamp(la + dir * dt * K.SEP_PUSH, -K.SEP_CLAMP, K.SEP_CLAMP);
        lb = clamp(lb - dir * dt * K.SEP_PUSH, -K.SEP_CLAMP, K.SEP_CLAMP);
        a.lane = la * sa; b.lane = lb * sb;
        fast = a.speed > b.speed ? a : b;
        fast.speed = max(10, fast.speed - dt * K.SEP_BLEED);
        if (!a.bumpCool) a.bumpCool = 0;
        if (a.bumpCool <= 0) {
          emit('bump', { a: a.slot, b: b.slot, force: clamp(abs(a.speed - b.speed) / 20, 0.15, 1), p: pOf(a) });
          a.bumpCool = 0.35;
        }
      }
    }
    for (i = 0; i < 8; i++) { if (S.karts[i].bumpCool > 0) S.karts[i].bumpCool -= dt; }

    /* ------------------------------------------------ derive + rank ------ */
    for (i = 0; i < S.karts.length; i++) derive(S.karts[i], dt);
    rank();

    /* ------------------------------------------------ ghost -------------- */
    stepGhost(dt);

    /* ------------------------------------------------ camera ------------- */
    updateCamera(dt, input);

    /* ------------------------------------------------ race over ---------- */
    /* The race is over when everyone is across.  If the tail of the field is
       still out there we keep simulating for `finishGrace` seconds so the final
       standings are real rather than projected — game.js is free to show the
       results screen the moment the player crosses and call SIM.finishRace()
       itself if it wants to cut the wait short. */
    if (st.finishedCount >= 8 ||
        (SIM.player.finished && S.postFinish > S.finishGrace)) {
      finishRace();
    }
    if (SIM.player.finished) S.postFinish += dt;
  }

  /* ---------------------------------------------------------------- kart -- */
  function stepKart(k, dt, input) {
    var rd = k.racer || {};
    var dSpeed = num(rd.speed, 4), dHand = num(rd.handling, 4), dAccel = num(rd.accel, 4);
    var path = S.path;

    /* ---- timers (LOCKED order) ---------------------------------------- */
    k.boost = max(0, k.boost - dt);
    k.shield = max(0, k.shield - dt);
    k.stun = max(0, k.stun - dt);
    k.hitCooldown = max(0, k.hitCooldown - dt);
    k.invuln = max(0, k.invuln - dt);
    k.ghostTime = max(0, k.ghostTime - dt);
    k.shrunk = max(0, k.shrunk - dt);
    k.spinout = max(0, k.spinout - dt);
    if (k.respawning > 0) k.respawning = max(0, k.respawning - dt);
    if (k.onPad > 0) k.onPad = max(0, k.onPad - dt);

    /* item roulette (player only) */
    if (k.itemRolling > 0) {
      k.itemRolling = max(0, k.itemRolling - dt);
      if (k.itemRolling <= 0 && k.itemPending) {
        k.item = k.itemPending;
        k.itemCharges = num(k.itemPending.charges, 1);
        emit('itemLock', { slot: k.slot, item: k.item.id, p: pOf(k) });
        k.itemPending = null;
      }
    }

    /* ---- the LOCKED curvature read ------------------------------------- */
    var tNow = mod(S.startLine + k.distance / S.L, 1);
    var curve = path.curvAt(tNow);
    var width = path.widthAt(tNow) || K.LANE_REF;
    var scale = width / K.LANE_REF;                 /* normalised lane scale */
    var steer = 0, drift = false;

    /* ---- controls ------------------------------------------------------- */
    if (k.isPlayer) {
      input = input || {};
      steer = clamp(num(input.steer, 0), -1, 1);
      var thr = clamp(num(input.throttle, 1), 0, 1);
      var brk = clamp(num(input.brake, 0), 0, 1);
      k.throttle = thr;
      var laneNow = k.lane / scale;
      drift = !!input.drift && abs(steer) > 0.05 && k.speed > K.DRIFT_MIN_SPEED
              && abs(laneNow) < K.DRIFT_LANE_LIM;
      if (brk > 0) {
        k.speed -= dt * K.BRAKE_RATE * brk;               /* LOCKED 35 m/s^2 */
        /* reverse only when you are deliberately off the gas at a standstill */
        var floorV = (thr < 0.1 && k.speed < 0.5) ? -9 : 0;
        if (k.speed < floorV) k.speed = floorV;
      }
      /* item use — edge-triggered so a held button fires once */
      var want = !!input.itemPressed || (!!input.item && !S.prevItem);
      S.prevItem = !!input.item;
      if (want && k.item) useItem(k);
      /* drift hop on the press edge */
      if (!!input.drift && !S.prevDrift && k.speed > 6) { k.hopT = 0.26; }
      S.prevDrift = !!input.drift;
    } else {
      aiThink(k, dt, curve);
      steer = k._aiSteer;
      drift = k._aiDrift;
      k.throttle = 1;
    }

    /* ---- top speed (LOCKED chain, with the new modifiers appended) ------ */
    var top = K.TOP_BASE + dSpeed * K.TOP_PER_SPEED;
    if (!k.isPlayer) {
      var delta = SIM.player.distance - k.distance;
      var band = DIFF[S.difficulty].band;
      k.rubber = clamp(delta / K.AI_BAND_DIV, -band, band);
      top *= k.aiSkill + k.rubber;
    }
    if (k.boost > 0) top *= K.BOOST_MUL;
    if (k.stun > 0) top *= K.STUN_MUL;
    var laneN = k.lane / scale;
    var aLaneN = abs(laneN);
    if (aLaneN > K.SHOULDER && k.ghostTime <= 0 && !k.airborne) {
      top *= max(K.SHOULDER_FLOOR, 1 - (aLaneN - K.SHOULDER) * K.SHOULDER_FALL);
    }
    /* --- additions (all neutral at their defaults) ---------------------- */
    if (k.throttle < 0.999) top *= 0.25 + 0.75 * k.throttle;
    if (k.shrunk > 0) top *= 0.74;
    if (k.ghostTime > 0) top *= 1.15;
    if (k.respawning > 0) top *= 0.55;

    /* ---- speed + steer integration (LOCKED) ---------------------------- */
    k.speed += (top - k.speed) * min(1, dt * (K.ACCEL_BASE + dAccel * K.ACCEL_PER));
    k.steer += (steer - k.steer) * (1 - exp(-dt * (steer === 0 ? K.STEER_RETURN : K.STEER_ACTIVE)));

    /* ---- lateral (LOCKED) ----------------------------------------------- */
    var control = (K.CTRL_BASE + dHand * K.CTRL_PER_HAND) * S.grip * (drift ? K.CTRL_DRIFT : 1);
    var outward = -curve * k.speed * k.speed * K.OUTWARD_K / (drift ? K.OUTWARD_DRIFT : 1);
    if (k.airborne) { control *= K.AIR_CTRL; outward *= 0.35; }
    if (k.spinout > 0) control *= 0.35;
    var targetLateral = k.steer * control * (K.LAT_SPEED_MIN + K.LAT_SPEED_SPAN * k.speed / K.LAT_SPEED_REF) + outward;
    /* the outward push and the steer authority are both expressed in the old
       model's lane units, so scale them onto this road's width */
    targetLateral *= scale;
    k.lateralSpeed += (targetLateral - k.lateralSpeed) * (1 - exp(-dt * (S.grip < 0.8 ? K.LAT_EASE_ICE : K.LAT_EASE)));
    k.lane += k.lateralSpeed * dt;

    /* ---- wall (LOCKED, scaled) ------------------------------------------ */
    var wall = K.WALL * scale;
    if (abs(k.lane) > wall) {
      k.lane = sign(k.lane) * wall;
      k.lateralSpeed *= K.WALL_BOUNCE;
      k.speed *= K.WALL_SCRUB;
      if (!k.scrapeCool || k.scrapeCool <= 0) {
        emit('scrape', { slot: k.slot, force: clamp(abs(k.lateralSpeed) / 8, 0.1, 1), p: pOf(k) });
        k.scrapeCool = 0.25;
      }
    }
    if (k.scrapeCool > 0) k.scrapeCool -= dt;

    /* ---- drift charge (LOCKED) ------------------------------------------ */
    if (drift && k.stun <= 0) {
      if (!k.drifting) emit('driftStart', { slot: k.slot, dir: sign(steer), p: pOf(k) });
      k.drift = min(K.DRIFT_MAX, k.drift + dt);
      k.driftDir = sign(steer);
      k.drifting = true;
      var stage = k.drift > K.DRIFT_T3 ? 3 : (k.drift > K.DRIFT_T2 ? 2 : (k.drift > K.DRIFT_T1 ? 1 : 0));
      if (stage !== k.driftStage) {
        k.driftStage = stage;
        if (stage > 0) emit('driftStage', { slot: k.slot, stage: stage, p: pOf(k) });
      }
    } else if (k.drifting) {
      if (k.drift > K.DRIFT_T1) {
        var boostS = k.drift > K.DRIFT_T2 ? K.DRIFT_B2 : K.DRIFT_B1;   /* LOCKED */
        k.boost = max(k.boost, boostS);
        emit('driftBoost', { slot: k.slot, stage: k.driftStage, p: pOf(k) });
      }
      k.drift = 0; k.drifting = false; k.driftDir = 0; k.driftStage = 0;
    }

    /* ---- distance integration (LOCKED) ---------------------------------- */
    var oldDist = k.distance;
    k.distance += k.speed * dt;
    var along = mod(k.distance, S.L);

    /* ---- airtime over jumps --------------------------------------------- */
    stepAir(k, dt, oldDist, along, scale);

    /* ---- track features -------------------------------------------------- */
    var i, dd, ln;

    /* item boxes */
    if (!k.item && k.itemRolling <= 0) {
      for (i = 0; i < SIM.pickups.length; i++) {
        var pu = SIM.pickups[i];
        if (!pu.active) continue;
        dd = ringDelta(along, pu.d, S.L);
        if (abs(dd) >= K.PICK_DIST) continue;
        ln = (k.lane - pu.lane) / scale;
        if (abs(ln) >= K.PICK_LANE) continue;
        pu.active = false; pu.respawn = K.PICK_RESPAWN; pu.taken = k.slot;
        giveItem(k);
        k.coins++;
        emit('coin', { slot: k.slot, p: pOf(k) });
        break;
      }
    }

    /* boost pads */
    for (i = 0; i < SIM.pads.length; i++) {
      var pd = SIM.pads[i];
      dd = ringDelta(along, pd.d, S.L);
      if (abs(dd) >= pd.halfLen + K.PAD_DIST) continue;
      if (abs(k.lane - pd.lane) >= pd.halfW) continue;
      if (k.boost < 0.3) emit('boostPad', { slot: k.slot, p: pOf(k) });
      k.boost = max(k.boost, K.PAD_BOOST);
      k.onPad = 0.25;
      break;
    }

    /* hazards */
    if (k.hitCooldown <= 0 && !k.airborne) {
      for (i = 0; i < SIM.hazards.length; i++) {
        var hz = SIM.hazards[i];
        dd = ringDelta(along, hz.d, S.L);
        if (abs(dd) >= hz.spec.r) continue;
        if (abs(k.lane - hz.lane) >= hz.spec.lane) continue;
        hazardHit(k, hz);
        break;
      }
    }

    /* ---- laps / finish --------------------------------------------------- */
    stepLap(k, oldDist);

    /* ---- wrong way / stuck / respawn ------------------------------------- */
    stepSafety(k, dt, oldDist);
  }

  /* ---------------------------------------------------------------- air --- */
  function stepAir(k, dt, oldDist, along, scale) {
    var i, jp, dd, oldAlong = mod(oldDist, S.L);
    if (!k.airborne) {
      for (i = 0; i < SIM.jumps.length; i++) {
        jp = SIM.jumps[i];
        /* did we cross the ramp this step? */
        dd = ringDelta(oldAlong, jp.d, S.L);
        var dd2 = ringDelta(along, jp.d, S.L);
        if (!(dd > 0 && dd2 <= 0)) continue;         /* crossed the ramp this step */
        if (k.speed < 12) continue;
        k.airborne = true;
        k.airH = 0.001;
        /* cap both the hang time and the apex so a low-gravity track floats
           without turning into a 3-second cutscene */
        k.airVy = min(K.JUMP_VY * jp.power * clamp(k.speed / 50, 0.45, 1.35),
                      0.85 * S.gravity, sqrt(2 * S.gravity * 7.5));
        k.airFrom = k.distance;
        k.drift = 0; k.drifting = false; k.driftStage = 0;
        emit('jump', { slot: k.slot, power: jp.power, p: pOf(k) });
        break;
      }
    }
    if (k.airborne) {
      k.airVy -= S.gravity * dt;
      k.airH += k.airVy * dt;
      if (k.airH <= 0) {
        var impact = abs(k.airVy);
        k.airH = 0; k.airborne = false;
        var hard = impact > 9;
        k.squash = clamp(impact / 16, 0.12, 0.85);
        k.squashV = 0;
        /* a clean landing — straight, not sideways, on the road — pays out */
        var clean = abs(k.steer) < 0.45 && abs(k.lateralSpeed) < 4.5 && k.onRoad;
        if (clean) {
          k.boost = max(k.boost, K.LAND_BOOST);
          emit('driftBoost', { slot: k.slot, stage: 1, clean: 1, p: pOf(k) });
        } else {
          k.speed *= 0.965;
        }
        emit('land', { slot: k.slot, hard: hard, clean: clean, p: pOf(k) });
        k.airVy = 0;
      }
    }
  }

  /* --------------------------------------------------------------- laps --- */
  function stepLap(k, oldDist) {
    var st = SIM.state;
    var L = S.L, target = L * S.laps;

    var oldLap = Math.floor(oldDist / L);
    var newLap = Math.floor(k.distance / L);

    UI.screen('loading', { track: td });
    UI.setLoading(5, 'READING CIRCUIT');

    ctx.trackDef = td;
    ctx.racerId = racerId;
    ctx.mode = mode || 'gp';
    ctx.resultsShown = false;
    ctx.ending = 0;
    /* keep the UI's notion of the current track/racer in step, so the HUD
       banner and the loading splash name the right circuit */
    try { UI.select('track', td.id); if (racerId) UI.select('racer', racerId); } catch (e) {}

    /* build in steps so the loader can breathe */
    step(1);

    function step(n) {
      try {
        if (n === 1) {
          ctx.path = C.pathFor ? C.pathFor(td.id) : PATHNS.build(td);
          UI.setLoading(22, 'BUILDING TRACK GEOMETRY');
          setTimeout(function () { step(2); }, 16);
        } else if (n === 2) {
          R.buildTrack(td, ctx.path);
          UI.setLoading(62, 'DRESSING THE WORLD');
          setTimeout(function () { step(3); }, 16);
        } else if (n === 3) {
          var rs = racerDefs(racerId);
          for (var i = 0; i < 8; i++) R.addKart(i, rs[i]);
          if (FX && FX.setTrackPalette) FX.setTrackPalette(td);
          if (FX && FX.reset) FX.reset();
          UI.setLoading(84, 'WARMING THE GRID');
          ctx._racers = rs;
          setTimeout(function () { step(4); }, 16);
        } else if (n === 4) {
          SIM.init({
            trackDef: td, path: ctx.path, racers: ctx._racers, playerSlot: 0,
            laps: td.laps || 3, difficulty: num(diff, 1), mode: ctx.mode,
            seed: (Math.random() * 1e9) | 0
          });
          ctx.loaded = true; ctx.active = true;
          UI.setLoading(100, 'GO');
          if (A && audioArmed) {
            A.setMusic(td.music || td.id, { intensity: 0.35 });
            A.musicIntensity(0.35);
            A.sfx('engineStart');
          }
          fxState.hit = fxState.damage = fxState.lapFlash = fxState.finish = 0;
          setTimeout(function () { UI.screen('race'); }, 120);
          GAME.loadMs = now() - t0;
        }
      } catch (e) { warn('load' + n, e); fatal('That circuit failed to load.'); }
    }
  }

  function startGP(cupId, racerId) {
    var cup = C.getCup(cupId) || C.CUPS[0];
    ctx.cup = cup; ctx.cupIndex = 0; ctx.points = {};
    for (var i = 0; i < 8; i++) ctx.points[i] = 0;
    loadRace(cup.tracks[0], racerId, 'gp', difficulty());
  }

  function startSingle(trackId, racerId, mode) {
    ctx.cup = null; ctx.cupIndex = 0; ctx.points = {};
    loadRace(trackId, racerId, mode, difficulty());
  }

  function difficulty() {
    var d = UI.settings && UI.settings.difficulty;
    if (d === undefined || d === null) return 1;
    return clamp(d | 0, 0, 2);
  }

  function restart() {
    if (!ctx.trackDef) return;
    ctx.resultsShown = false; ctx.ending = 0;
    try {
      SIM.reset();
      if (FX && FX.reset) FX.reset();
      if (A && audioArmed) { A.musicIntensity(0.35); A.finalLap(false); }
      ctx.active = true;
      UI.screen('race');
    } catch (e) { warn('restart', e); }
  }

  function nextRace() {
    if (ctx.cup && ctx.cupIndex + 1 < ctx.cup.tracks.length) {
      ctx.cupIndex++;
      loadRace(ctx.cup.tracks[ctx.cupIndex], ctx.racerId, 'gp', difficulty());
    } else if (ctx.cup) {
      showTrophy();
    } else {
      restart();
    }
  }

  function quitToMenu() {
    ctx.active = false; ctx.loaded = false;
    try { if (A && audioArmed) { A.stopEngines(); A.finalLap(false); A.setMusic('menu'); } } catch (e) {}
    UI.screen('title');
  }

  function setPaused(p) {
    GAME.paused = !!p;
    try {
      if (A && audioArmed) {
        if (p) { A.stopEngines(); A.duck(0.35, 200); }
        else A.duck(1, 250);
      }
    } catch (e) {}
  }

  /* ======================================================================== *
     EVENTS  ->  audio / fx / ui
     ======================================================================== */
  function drainEvents() {
    var ev = SIM.events, i, e;
    for (i = 0; i < ev.length; i++) {
      e = ev[i];
      try { handle(e); } catch (x) { warn('event ' + e.type, x); }
    }
    ev.length = 0;
  }

  function isP(e) { return e.slot === 0 || (e.kart && e.kart.isPlayer) || e.isPlayer; }

  function handle(e) {
    var p = e.p, mine = isP(e), k;
    switch (e.type) {
      case 'countdown':
        UI.countdown(e.n);
        sfx(e.n > 0 ? 'countdown' : 'go', { pitch: 1 + (3 - e.n) * 0.08 });
        break;
      case 'go':
        UI.countdown(0); sfx('go');
        if (A && audioArmed) A.musicIntensity(0.55);
        break;
      case 'rocketStart':
        if (mine) { UI.big('ROCKET START', null, 1200, 'boost'); boostFx(p, 1.4); }
        break;
      case 'lap':
        if (mine) {
          UI.big('LAP ' + e.lap + ' / ' + (SIM.state.laps || 3), null, 1300, 'lap');
          sfx('lapDing'); fxState.lapFlash = 1;
          if (FX && FX.lapCelebrate) FX.lapCelebrate();
          if (A && audioArmed) A.musicIntensity(clamp(0.5 + e.lap * 0.18, 0, 1));
        }
        break;
      case 'finalLap':
        if (mine) {
          UI.big('FINAL LAP', 'EVERYTHING ON THE LINE', 1700, 'finalLap');
          sfx('finalLap');
          if (A && audioArmed) { A.finalLap(true); A.musicIntensity(1); }
        }
        break;
      case 'finish':
        if (mine) {
          ctx.ending = 0.001;
          sfx(e.place <= 3 ? 'win' : 'finish');
          fxState.finish = 1;
          if (FX && FX.finishCelebrate) FX.finishCelebrate();
          UI.big(ord(e.place) + ' PLACE', null, 2200, 'place');
        }
        break;
      case 'raceOver':
        showResults(e.results);
        break;
      case 'record':
        if (mine) { UI.big('NEW RECORD', fmt(e.time), 1800, 'record'); sfx('record'); }
        break;
      case 'driftStart':
        if (mine) sfx('drift');
        break;
      case 'driftStage':
        if (mine) { sfx('driftBoost' + clamp(e.stage, 1, 3), { vol: 0.5 }); UI.rumble(12, 0.4); }
        break;
      case 'driftBoost':
        sfx('driftBoost' + clamp(e.stage, 1, 3));
        if (mine) {
          UI.big(e.stage >= 2 ? 'ULTRA DRIFT' : 'DRIFT BOOST', null, 900, 'boost');
          boostFx(p, 0.8 + e.stage * 0.3); UI.rumble(40, 0.8);
        } else if (FX) FX.emit('boostFlame', p, null, { count: 12 });
        break;
      case 'boostPad':
        sfx('boostPad', { vol: mine ? 1 : 0.4 });
        if (mine) { boostFx(p, 1.1); UI.rumble(30, 0.6); }
        if (FX) FX.emit('boostRing', p, null, { count: 8 });
        break;
      case 'jump':
        if (mine) { sfx('jump'); UI.rumble(18, 0.4); }
        break;
      case 'land':
        sfx('land', { vol: mine ? 1 : 0.35 });
        if (FX) FX.emit('dust', p, null, { count: e.hard ? 22 : 10 });
        if (mine && e.hard) { shake(0.20); UI.rumble(45, 0.7); }
        break;
      case 'itemBox':
        sfx('itemBox', { vol: mine ? 1 : 0.3 });
        if (FX) FX.emit('sparkle', p, null, { count: 14 });
        break;
      case 'itemLock':
        if (mine) sfx('itemGet');
        break;
      case 'itemUse':
        sfx('itemUse', { vol: mine ? 1 : 0.4 });
        if (e.item && e.item.id === 'signal_pulse') sfx('zap', { vol: mine ? 1 : 0.4 });
        if (FX) FX.emit('zap', p, null, { count: 10 });
        break;
      case 'itemHit':
        sfx('missileHit', { vol: mine ? 1 : 0.45 });
        if (FX) { FX.impact(p, mine ? 1 : 0.5); FX.shockwave(p, {}); }
        if (mine) { fxState.hit = 1; fxState.damage = 1; shake(0.55); hitstop(80); UI.rumble(120, 1); }
        break;
      case 'shieldBreak':
        sfx('shieldBreak', { vol: mine ? 1 : 0.4 });
        if (FX) FX.emit('shield', p, null, { count: 24 });
        if (mine) { UI.big('SHIELD HELD', null, 900, 'boost'); UI.rumble(60, 0.7); }
        break;
      case 'spin':
        sfx('hit', { vol: mine ? 1 : 0.35 });
        if (mine) { fxState.hit = Math.max(fxState.hit, 0.8); shake(0.40); }
        if (FX) FX.emit('debris', p, null, { count: 16 });
        break;
      case 'explode':
        sfx('explode', { vol: mine ? 1 : 0.4 });
        if (FX) { FX.emit('explosion', p, null, { count: 30 }); FX.shockwave(p, {}); }
        if (mine) shake(0.5);
        break;
      case 'bump':
        sfx('bump', { vol: clamp(num(e.force, 0.5), 0.15, 1) * (mine ? 1 : 0.35) });
        if (mine) { shake(0.12 * num(e.force, 1)); UI.rumble(25, 0.5); }
        break;
      case 'scrape':
        if (mine) { sfx('scrape', { vol: clamp(num(e.force, 0.4), 0.1, 0.8) }); shake(0.07); }
        if (FX) FX.emit('spark', p, null, { count: 3 });
        break;
      case 'hazard':
        sfx('hit', { vol: mine ? 0.8 : 0.3 });
        if (mine) { shake(0.30); UI.rumble(70, 0.8); }
        break;
      case 'surface':
        if (mine && e.to === 'off') sfx('offroad', { vol: 0.6 });
        break;
      case 'coin':
        if (mine) sfx('coin');
        break;
      case 'respawn':
        if (mine) { sfx('menuBack'); UI.toast('BACK ON TRACK', 'good'); }
        break;
      case 'wrongWay':
        if (mine && e.on) UI.big('WRONG WAY', 'TURN AROUND', 900, 'wrongway');
        break;
      case 'zap':
        sfx('zap', { vol: mine ? 1 : 0.35 });
        break;
      default: break;
    }
  }

  function sfx(n, o) { try { if (A && audioArmed) A.sfx(n, o); } catch (e) {} }
  function shake(v) { try { if (FX) FX.shake(v, 260); } catch (e) {} }
  function hitstop(ms) { try { if (FX && FX.hitstop) FX.hitstop(ms); } catch (e) {} }
  function boostFx(p, s) {
    try { if (FX) { FX.boostBurst ? FX.boostBurst(p, s) : FX.emit('boostFlame', p, null, { count: 20 }); FX.boostPulse && FX.boostPulse(s); } } catch (e) {}
  }
  function ord(n) { return C.ordinal ? C.ordinal(n) : (n + 'TH'); }
  function fmt(s) {
    if (!isFinite(s)) return '--:--.--';
    var m = Math.floor(s / 60), x = Math.floor(s % 60), c = Math.floor((s * 100) % 100);
    return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x + '.' + (c < 10 ? '0' : '') + c;
  }

  /* ======================================================================== *
     RESULTS / GP FLOW
     ======================================================================== */
  function showResults(results) {
    if (ctx.resultsShown) return;
    ctx.resultsShown = true; ctx.active = false;
    try { if (A && audioArmed) { A.stopEngines(); A.finalLap(false); A.setMusic('results'); } } catch (e) {}

    var rows = [], i, r, k;
    results = results || SIM.state.results || [];
    for (i = 0; i < results.length; i++) {
      r = results[i];
      k = SIM.karts[r.slot !== undefined ? r.slot : i];
      var pts = C.pointsFor ? C.pointsFor(i + 1) : (C.POINTS[i] || 0);
      if (ctx.cup) ctx.points[k.slot] = (ctx.points[k.slot] || 0) + pts;
      rows.push({
        place: i + 1, name: k.racer.name, color: k.racer.colorHex || '#9C5DD9',
        time: k.finishTime, best: k.bestLap, isPlayer: k.isPlayer, points: pts,
        total: ctx.cup ? ctx.points[k.slot] : undefined
      });
    }
    var me = SIM.player;
    UI.screen('results');
    UI.results({
      track: ctx.trackDef, trackName: ctx.trackDef.name,
      place: me.place, rows: rows, rounds: rows,
      time: me.finishTime, best: me.bestLap, lapTimes: me.lapTimes,
      mode: ctx.mode,
      isCup: !!ctx.cup,
      race: ctx.cupIndex + 1, races: ctx.cup ? ctx.cup.tracks.length : 1,
      last: !ctx.cup || ctx.cupIndex + 1 >= ctx.cup.tracks.length
    });
    try { UI.record(ctx.trackDef.id, me.bestLap); } catch (e) {}
  }

  function showTrophy() {
    var order = [], i;
    for (i = 0; i < 8; i++) order.push({ slot: i, pts: ctx.points[i] || 0, k: SIM.karts[i] });
    order.sort(function (a, b) { return b.pts - a.pts; });
    var place = 1;
    for (i = 0; i < order.length; i++) if (order[i].k && order[i].k.isPlayer) place = i + 1;
    try { if (A && audioArmed) A.setMusic(place === 1 ? 'victory' : 'results'); } catch (e) {}
    if (place <= 3) { sfx('unlock'); if (FX && FX.finishCelebrate) FX.finishCelebrate(); }
    UI.screen('trophy');
    UI.trophy({
      cup: ctx.cup, cupName: ctx.cup ? ctx.cup.name : 'GRAND PRIX', place: place,
      rows: order.map(function (o, idx) {
        return {
          place: idx + 1, name: o.k.racer.name, color: o.k.racer.colorHex || '#9C5DD9',
          points: o.pts, total: o.pts, isPlayer: o.k.isPlayer
        };
      })
    });
  }

  /* ======================================================================== *
     MINIMAP
     ======================================================================== */
  function drawMinimap(g, w, h) {
    try {
      if (!ctx.path || !SIM.karts.length) return;
      SIM.minimap(mmBuf);
      var pts = mmBuf.path, i, b = ctx.path.bounds;
      if (!pts || !pts.length || !b) return;
      var minX = b.minX, maxX = b.maxX, minZ = b.minZ, maxZ = b.maxZ;
      var sx = (maxX - minX) || 1, sz = (maxZ - minZ) || 1;
      var pad = 8, s = Math.min((w - pad * 2) / sx, (h - pad * 2) / sz);
      var ox = (w - sx * s) * 0.5 - minX * s, oz = (h - sz * s) * 0.5 - minZ * s;

      g.clearRect(0, 0, w, h);
      g.lineJoin = 'round'; g.lineCap = 'round';
      g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 7;
      g.beginPath();
      for (i = 0; i < pts.length; i++) {
        var x = pts[i][0] * s + ox, z = pts[i][1] * s + oz;
        if (i === 0) g.moveTo(x, z); else g.lineTo(x, z);
      }
      g.closePath(); g.stroke();
      g.strokeStyle = 'rgba(34,211,238,.55)'; g.lineWidth = 2.5; g.stroke();

      for (i = 0; i < mmBuf.karts.length; i++) {
        var k = mmBuf.karts[i];
        var kx = k.x * s + ox, kz = k.z * s + oz;
        g.beginPath();
        g.arc(kx, kz, k.isPlayer ? 4.6 : 3.2, 0, 6.2832);
        g.fillStyle = k.isPlayer ? '#FFFFFF' : (k.color || '#F026A0');
        g.fill();
        if (k.isPlayer) { g.lineWidth = 2; g.strokeStyle = '#22D3EE'; g.stroke(); }
      }
    } catch (e) {}
  }

  /* ======================================================================== *
     FRAME
     ======================================================================== */
  function frame(t) {
    rafId = requestAnimationFrame(frame);
    var raw = (t - lastT) / 1000;
    lastT = t;
    if (!isFinite(raw) || raw <= 0) raw = 1 / 60;
    if (raw > 0.25) raw = 1 / 60;          /* tab came back */
    var dt = Math.min(raw, 1 / 20);

    try {
      /* FX gets the UNSCALED dt so hitstop can count itself down */
      if (FX) FX.update(dt, R.camPos);
      var stop = (FX && FX.hitstopRemaining) ? FX.hitstopRemaining : 0;
      var sdt = stop > 0 ? dt * 0.12 : dt;

      if (ctx.active && !GAME.paused && ctx.loaded) {
        SIM.step(sdt, UI.input);
        drainEvents();
        if (ctx.ending > 0 && !ctx.resultsShown) {
          ctx.ending += dt;
          if (ctx.ending > 2.6) { try { SIM.finishRace(); } catch (e) { showResults(null); } }
        }
      }

      if (ctx.loaded) { renderWorld(dt); }
      if (ctx.active && !GAME.paused) { pushHud(); pushAudio(); }
      if (GAME.autoQuality) R.autoQuality(dt);
    } catch (e) {
      warn('frame', e);
    }
  }

  function renderWorld(dt) {
    var i, k, st = SIM.state, me = SIM.player;

    /* camera */
    var cam = SIM.cameraHint(UI.input.look ? 'back' : 'chase');
    if (cam) {
      camS.p[0] = cam.p[0]; camS.p[1] = cam.p[1]; camS.p[2] = cam.p[2];
      camS.look[0] = cam.look[0]; camS.look[1] = cam.look[1]; camS.look[2] = cam.look[2];
      camS.up[0] = cam.up[0]; camS.up[1] = cam.up[1]; camS.up[2] = cam.up[2];
      camS.fov = cam.fov; camS.roll = cam.roll || 0;
      /* NOTE: FX owns screen shake — it is applied in the post pass as a screen
         offset (FX.shakeOffset is a SCREEN-space accessor, not a world vector).
         Do not add it to the camera here or the two will fight. */
      R.setCamera(camS);
      /* camera basis for particle billboards */
      camFwd[0] = camS.look[0] - camS.p[0]; camFwd[1] = camS.look[1] - camS.p[1]; camFwd[2] = camS.look[2] - camS.p[2];
      normalize(camFwd);
      cross(camRight, camFwd, camS.up); normalize(camRight);
      cross(camUp, camRight, camFwd); normalize(camUp);
    }

    /* karts */
    for (i = 0; i < SIM.karts.length; i++) {
      k = SIM.karts[i];
      kartS.p = k.p;
      kartS.yaw = k.yaw; kartS.pitch = k.pitch; kartS.roll = k.roll;
      kartS.steer = k.steer; kartS.wheelSpin = k.wheelSpin;
      kartS.boost = clamp(num(k.boost, 0) / 1.2, 0, 1);
      kartS.hop = num(k.hop, 0);
      kartS.squash = num(k.squash, 1);
      kartS.shielded = num(k.shield, 0) > 0;
      kartS.hidden = false;
      kartS.drift = num(k.drift, 0);
      R.updateKart(i, kartS);
      kartTrail(k, dt);
    }

    R.beginScene(now() / 1000, dt);
    if (FX) FX.renderParticles(R.viewProj, R.camPos, camRight, camUp);
    var sc = R.endScene();

    if (FX) {
      var sp = clamp(num(me.speed, 0) / 78, 0, 1);
      postP.time = now() / 1000; postP.dt = dt;
      postP.speed = sp;
      postP.boost = clamp(num(me.boost, 0) / 1.4, 0, 1);
      postP.drift = me.drifting ? clamp(num(me.drift, 0) / 2.2, 0, 1) * (me.driftDir || 1) : 0;
      postP.driftDir = me.driftDir || 1;
      postP.offroad = (me.surface === 'off') ? 1 : 0;
      postP.hit = fxState.hit; postP.damage = fxState.damage * 0.8;
      postP.lapFlash = fxState.lapFlash; postP.finish = fxState.finish;
      postP.exposure = 1;
      postP.hdr = sc ? sc.hdr : false;
      postP.depthTex = sc ? sc.depth : null;
      postP.viewProj = R.viewProj; postP.invViewProj = R.invViewProj;
      FX.post(sc ? sc.tex : null, postP);
      fxState.hit = Math.max(0, fxState.hit - dt * 2.2);
      fxState.damage = Math.max(0, fxState.damage - dt * 1.1);
      fxState.lapFlash = Math.max(0, fxState.lapFlash - dt * 2.4);
      fxState.finish = Math.max(0, fxState.finish - dt * 0.35);
    }
  }

  /* per-kart continuous effects.
     RATE LIMITED ON PURPOSE. These are additive draws right in front of the
     chase camera; emitting every frame for every kart piles ~10x HDR radiance
     into the centre of the screen and the tonemapper hands back a white sheet.
     The player gets the full treatment, rivals a token amount, and everyone a
     fixed per-second budget rather than a per-frame one. */
  var trailAcc = [0, 0, 0, 0, 0, 0, 0, 0];
  function kartTrail(k, dt) {
    if (!FX) return;
    try {
      var isMe = k.isPlayer;
      var d2 = isMe ? 0 : dist2(k.p, R.camPos);
      if (!isMe && d2 > 3600) return;                 /* 60 m */
      var near = isMe ? 1 : clamp(1 - Math.sqrt(d2) / 60, 0, 0.6);

      var rate = isMe ? 24 : 9;                       /* Hz, not per frame */
      trailAcc[k.slot] += dt * rate;
      if (trailAcc[k.slot] < 1) return;
      trailAcc[k.slot] = 0;

      if (k.drifting && k.speed > 18) {
        var stage = k.driftStage | 0;
        if (FX.driftSparks) FX.driftSparks(k.p, dirFwd(k), dirRight(k), stage, near * clamp(k.drift / 2.4, 0.15, 0.7));
        else FX.emit('spark', k.p, null, { count: 1 });
        if (stage >= 2 && isMe) FX.emit('smoke', k.p, null, { count: 1 });
      }
      if (k.surface === 'off' && k.speed > 14) FX.emit('dust', k.p, null, { count: isMe ? 2 : 1 });
    } catch (e) {}
  }

  var _f = [0, 0, 0], _r = [0, 0, 0];
  function dirFwd(k) { _f[0] = Math.sin(k.yaw); _f[1] = 0; _f[2] = Math.cos(k.yaw); return _f; }
  function dirRight(k) { _r[0] = Math.cos(k.yaw); _r[1] = 0; _r[2] = -Math.sin(k.yaw); return _r; }
  function dist2(a, b) { var x = a[0] - b[0], y = a[1] - b[1], z = a[2] - b[2]; return x * x + y * y + z * z; }
  function normalize(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; v[0] /= l; v[1] /= l; v[2] /= l; }
  function cross(o, a, b) {
    var x = a[1] * b[2] - a[2] * b[1], y = a[2] * b[0] - a[0] * b[2], z = a[0] * b[1] - a[1] * b[0];
    o[0] = x; o[1] = y; o[2] = z;
  }

  /* ======================================================================== *
     HUD + AUDIO PER FRAME
     ======================================================================== */
  function pushHud() {
    var me = SIM.player, st = SIM.state, i, k;
    hudH.place = me.place; hudH.total = 8;
    hudH.lap = clamp(me.lap, 1, st.laps || 3); hudH.laps = st.laps || 3;
    hudH.speedKmh = Math.round(num(me.speed, 0) * 3.6);
    hudH.raceTime = st.raceTime; hudH.lapTime = num(me.lapTime, st.raceTime);
    hudH.bestLap = me.bestLap || 0;
    hudH.item = me.item ? (typeof me.item === 'object' ? me.item : C.getItem(me.item)) : null;
    hudH.itemCharges = me.itemCharges || (me.item ? 1 : 0);
    hudH.itemRolling = !!me.itemRolling;
    hudH.coins = me.coins || 0;
    hudH.driftStage = me.driftStage | 0;
    hudH.boost = clamp(num(me.boost, 0) / 2.8, 0, 1);
    hudH.wrongWay = !!me.wrongWay;
    hudH.finalLap = me.lap >= (st.laps || 3);

    var pos = hudH.positions; pos.length = 0;
    var rank = SIM.ranking ? SIM.ranking() : SIM.karts;
    for (i = 0; i < rank.length; i++) {
      k = rank[i];
      pos.push({
        name: k.racer.name, color: k.racer.colorHex || '#9C5DD9',
        place: i + 1, isPlayer: k.isPlayer,
        gap: (SIM.gapTime && !k.isPlayer) ? SIM.gapTime(me, k) : null
      });
    }
    UI.hud(hudH);
  }

  function pushAudio() {
    if (!A || !audioArmed) return;
    try {
      var me = SIM.player, i, k, n = 0;
      A.listener(R.camPos, camFwd);
      /* rank the 4 nearest by distance and hand them volumes */
      for (i = 0; i < SIM.karts.length; i++) {
        k = SIM.karts[i];
        var d = k.isPlayer ? 0 : Math.sqrt(dist2(k.p, R.camPos));
        var vol = k.isPlayer ? 1 : clamp(1 - d / 70, 0, 0.55);
        if (vol <= 0.02) { A.engine(i, { on: false }); continue; }
        engS.on = true;
        engS.rpm = clamp(num(k.speed, 0) / 78, 0, 1);
        engS.load = clamp(Math.abs(num(k.steer, 0)) * 0.5 + (k.surface === 'off' ? 0.5 : 0.25), 0, 1);
        engS.boost = clamp(num(k.boost, 0) / 1.4, 0, 1);
        engS.pan = k.isPlayer ? 0 : panOf(k.p);
        engS.vol = vol;
        engS.kind = k.racer.kart || 'classic';
        A.engine(i, engS);
        n++;
      }
    } catch (e) {}
  }

  function panOf(p) {
    tmpV[0] = p[0] - R.camPos[0]; tmpV[1] = 0; tmpV[2] = p[2] - R.camPos[2];
    var l = Math.hypot(tmpV[0], tmpV[2]) || 1;
    return clamp((tmpV[0] / l) * camRight[0] + (tmpV[2] / l) * camRight[2], -1, 1);
  }

  /* ======================================================================== *
     PUBLIC
     ======================================================================== */
  GAME.version = VERSION;
  GAME.ready = false;
  GAME.paused = false;
  GAME.autoQuality = true;
  GAME.ctx = ctx;
  /* test/diagnostic hook: advance the race without paying for rendering.
     Exercises the full SIM -> events -> audio/fx/ui wiring. */
  GAME.fastForward = function (seconds, drive) {
    var n = Math.min(60 * 60 * 10, Math.round(num(seconds, 1) * 60)), i, dt = 1 / 60;
    for (i = 0; i < n; i++) {
      if (!ctx.active) break;
      if (typeof drive === 'function') { try { drive(SIM.player, UI.input, ctx.path); } catch (e) {} }
      SIM.step(dt, UI.input);
      drainEvents();
      /* keep FX's transient state decaying in step with the events we drain,
         or a fast-forward composites thousands of stale impulses at once */
      if (FX) { try { FX.update(dt, R.camPos); } catch (e) {} }
      if (ctx.ending > 0 && !ctx.resultsShown) {
        ctx.ending += dt;
        if (ctx.ending > 2.6) { try { SIM.finishRace(); } catch (e) { showResults(null); } }
      }
      if (ctx.active) { try { pushHud(); } catch (e) {} }
    }
    return { steps: i, phase: SIM.state.phase, t: SIM.state.raceTime };
  };

  GAME.startTrack = function (trackId, racerId, mode) { startSingle(trackId, racerId || 'blufox', mode || 'vs'); };
  GAME.startCup = function (cupId, racerId) { startGP(cupId, racerId || 'blufox'); };
  GAME.debug = function () {
    return { ctx: ctx, quality: R ? R.quality : -1, stats: R ? R.stats : null, fxQ: FX ? FX.quality : -1 };
  };

  BFX.GAME = GAME;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { GAME.init(); });
  } else {
    setTimeout(function () { GAME.init(); }, 0);
  }
})();

</script>
