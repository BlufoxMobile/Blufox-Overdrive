.bfx-statgrid span{font:800 8px/1 var(--bfx-ui);letter-spacing:.18em;color:var(--dim2);display:block;margin-bottom:6px}
.bfx-statgrid .bfx-bar{height:6px}
.bfx-roster{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);min-height:0}
.bfx-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,.9vw,12px);
  flex:1 1 auto;min-height:0;align-content:start}
.bfx-rcard{position:relative;border-radius:14px;overflow:hidden;padding:0 0 9px;text-align:center;
  background:linear-gradient(158deg,rgba(46,22,78,.62),rgba(10,5,20,.8));border:1px solid rgba(255,255,255,.08);
  transition:transform .2s cubic-bezier(.2,.9,.3,1.3),border-color .2s,box-shadow .2s;min-width:0}
.bfx-rcard .chip{height:clamp(38px,7.2vh,70px);display:grid;place-items:center;position:relative;overflow:hidden}
.bfx-rcard .chip b{font:900 clamp(15px,2.9vh,28px)/1 var(--bfx-dsp);font-style:italic;color:#fff;
  text-shadow:0 3px 14px rgba(0,0,0,.55);position:relative;z-index:2}
.bfx-rcard .chip:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,3,14,.82),transparent 62%)}
.bfx-rcard strong{display:block;font:900 clamp(9px,1.5vh,13px)/1 var(--bfx-dsp);font-style:italic;
  letter-spacing:.02em;margin-top:6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.bfx-rcard em{display:block;font:700 7px/1 var(--bfx-ui);letter-spacing:.16em;color:var(--dim2);
  font-style:normal;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.bfx-rcard .num{position:absolute;left:6px;top:5px;font:900 8px/1 var(--bfx-ui);letter-spacing:.1em;
  color:rgba(255,255,255,.55);z-index:3}
.bfx-rcard:hover{transform:translateY(-3px);border-color:rgba(199,155,255,.5)}
.bfx-rcard.sel{border-color:var(--cy);box-shadow:0 0 0 1px rgba(34,211,238,.4),0 12px 30px rgba(0,0,0,.55),0 0 30px rgba(34,211,238,.22)}
.bfx-rcard.sel:before{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--cy),var(--mag));z-index:4}

/* --------------------------------------------------------- cup/track select */
.bfx-cups{display:flex;gap:clamp(10px,1.8vw,22px);flex:1 1 auto;min-height:0}
.bfx-cup{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);
  padding:clamp(11px,2vh,22px);border-radius:20px;text-align:left;position:relative;overflow:hidden;
  background:linear-gradient(158deg,rgba(58,26,96,.55),rgba(11,6,22,.8));border:1px solid var(--gl);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh);
  transition:transform .24s cubic-bezier(.2,.9,.3,1.25),border-color .24s,box-shadow .24s}
.bfx-cup:hover,.bfx-cup.sel{transform:translateY(-5px);border-color:rgba(199,155,255,.6);
  box-shadow:0 26px 58px rgba(0,0,0,.6),0 0 40px rgba(156,93,217,.28)}
.bfx-cup .trophy{position:absolute;right:-6px;top:-10px;font-size:clamp(46px,9vh,86px);opacity:.14;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.bfx-cup h3{font:900 clamp(15px,2.8vh,28px)/.94 var(--bfx-dsp);font-style:italic;margin:0;
  text-transform:uppercase;letter-spacing:-.02em}
.bfx-cup .csub{font-size:clamp(9px,1.4vh,12px);color:var(--dim);margin:0}
.bfx-thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:auto}
.bfx-thumb{position:relative;border-radius:10px;overflow:hidden;background:rgba(6,3,14,.6);
  border:1px solid rgba(255,255,255,.08);aspect-ratio:4/3}
.bfx-thumb canvas{display:block;width:100%;height:100%}
.bfx-thumb span{position:absolute;left:5px;right:5px;bottom:4px;font:800 7px/1.25 var(--bfx-ui);
  letter-spacing:.09em;color:#fff;text-shadow:0 1px 5px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfx-cupmeta{display:flex;align-items:center;gap:12px;font:700 9px/1 var(--bfx-ui);letter-spacing:.16em;color:var(--dim2)}

.bfx-tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,1.1vw,14px);
  flex:1 1 auto;min-height:0;align-content:start;padding-bottom:4px}
.bfx-tcard{position:relative;border-radius:15px;overflow:hidden;text-align:left;min-width:0;
  background:linear-gradient(158deg,rgba(40,19,70,.62),rgba(9,5,18,.8));border:1px solid rgba(255,255,255,.08);
  transition:transform .2s cubic-bezier(.2,.9,.3,1.3),border-color .2s,box-shadow .2s;display:flex;flex-direction:column}
.bfx-tcard .vis{position:relative;aspect-ratio:16/9;overflow:hidden;flex:0 0 auto}
.bfx-tcard canvas{display:block;width:100%;height:100%}
.bfx-tcard .vis:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,2,12,.9),transparent 55%)}
.bfx-tcard .no{position:absolute;left:8px;top:7px;font:900 8px/1 var(--bfx-ui);letter-spacing:.16em;
  color:rgba(255,255,255,.62);z-index:2;background:rgba(6,3,16,.55);padding:3px 5px;border-radius:5px}
.bfx-tcard .thm{position:absolute;left:9px;bottom:6px;font:800 7px/1 var(--bfx-ui);letter-spacing:.2em;
  color:#fff;text-shadow:0 1px 6px #000;z-index:2}
.bfx-tcard .inf{padding:8px 10px 9px;display:flex;flex-direction:column;gap:4px;min-width:0}
.bfx-tcard .inf strong{font:900 clamp(11px,1.9vh,17px)/1 var(--bfx-dsp);font-style:italic;
  text-transform:uppercase;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfx-tcard .inf small{font:700 8px/1 var(--bfx-ui);letter-spacing:.12em;color:var(--dim2);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bfx-tcard:hover{transform:translateY(-4px);border-color:rgba(199,155,255,.5)}
.bfx-tcard.sel{border-color:var(--cy);box-shadow:0 0 0 1px rgba(34,211,238,.35),0 14px 34px rgba(0,0,0,.55)}
.bfx-foot{display:flex;align-items:center;gap:14px;flex:0 0 auto;margin-top:clamp(6px,1.4vh,14px)}
.bfx-foot .meta{flex:1 1 auto;min-width:0}
.bfx-foot .meta strong{display:block;font:900 clamp(12px,2vh,17px)/1.1 var(--bfx-dsp);font-style:italic;text-transform:uppercase}
.bfx-foot .meta small{display:block;font-size:10px;color:var(--dim2);margin-top:3px;letter-spacing:.06em}

/* ----------------------------------------------------------------- loading */
#bfx-loading{align-items:stretch;justify-content:center}
.bfx-load{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);max-width:min(760px,88%)}
.bfx-load .bfx-word{font-size:clamp(26px,7vh,72px)}
.bfx-loadbar{height:7px;border-radius:5px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
.bfx-loadbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;
  background:linear-gradient(90deg,var(--cy),var(--pur2) 55%,var(--mag));
  box-shadow:0 0 18px rgba(156,93,217,.8);transition:width .25s linear}
.bfx-loadbar:after{content:'';position:absolute;inset:0;border-radius:5px;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  background-size:220% 100%;animation:bfxShift 1.6s linear infinite}
.bfx-loadrow{display:flex;align-items:baseline;gap:12px;font:800 10px/1 var(--bfx-ui);letter-spacing:.2em;color:var(--dim2)}
.bfx-loadrow b{font:900 clamp(15px,2.6vh,24px)/1 var(--bfx-dsp);font-style:italic;color:var(--cy);min-width:56px}
.bfx-tip{font-size:clamp(10px,1.5vh,13px);color:var(--dim);min-height:2.6em;max-width:56ch}
.bfx-tip b{color:var(--gold);font-weight:900;letter-spacing:.1em;font-size:.85em;margin-right:8px}

/* ========================================================================= */
/* RACE HUD                                                                  */
/* ========================================================================= */
#bfx-race{padding:0;display:none}
#bfx-race.on{display:block;animation:bfxHudIn .5s cubic-bezier(.2,.9,.25,1) both}
@keyframes bfxHudIn{from{opacity:0}to{opacity:1}}
.bfx-hud{position:absolute;inset:0;pointer-events:none}
.bfx-hud button{pointer-events:auto}
.bfx-tl{position:absolute;left:calc(var(--safeL) + 12px);top:calc(var(--safeT) + 9px);display:flex;gap:10px;
  align-items:flex-start;max-width:calc(100% - var(--safeL) - var(--safeR) - 24px);min-width:0}
.bfx-tr{position:absolute;right:calc(var(--safeR) + 12px);top:calc(var(--safeT) + 9px);display:flex;
  flex-direction:column;gap:8px;align-items:flex-end}
.bfx-bl{position:absolute;left:calc(var(--safeL) + 12px);bottom:calc(var(--safeB) + 10px);
  display:flex;align-items:flex-end;gap:clamp(8px,1.4vw,14px)}
.bfx-br{position:absolute;right:calc(var(--safeR) + 12px);bottom:calc(var(--safeB) + 10px);
  display:flex;align-items:flex-end;gap:clamp(8px,1.4vw,14px)}

/* place + lap block */
.bfx-place{display:flex;align-items:flex-start;gap:6px;flex:0 0 auto;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.72))}
/* NOTE: every gradient below MUST use background-image, never the background
   shorthand -- the shorthand resets background-clip back to border-box and the
   digit then renders as a solid coloured block with the glyph invisible. */
.bfx-place .n{font:900 clamp(34px,8.6vh,74px)/.86 var(--bfx-dsp);font-style:italic;letter-spacing:-.04em;
  /* the italic glyph leans out of its own box; pad so background-clip:text
     never shears the top-right / bottom-left of the numeral */
  padding:.02em .10em .02em .05em;
  background-image:linear-gradient(170deg,#fff 20%,var(--cy2) 62%,var(--pur3) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  transform-origin:left center;transition:transform .2s}
.bfx-place.p1 .n{background-image:linear-gradient(170deg,#fff6d8 12%,var(--gold) 58%,#ff9a2e 100%)}
.bfx-place.pop .n{animation:bfxPop .45s cubic-bezier(.2,1.5,.35,1)}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  .bfx-place .n{background-image:none;color:#fff}
  .bfx-place.p1 .n{color:var(--gold)}
}
@keyframes bfxPop{0%{transform:scale(1)}38%{transform:scale(1.22)}100%{transform:scale(1)}}
.bfx-place .sfx{display:flex;flex-direction:column;margin-top:clamp(4px,1vh,10px)}
.bfx-place .sfx b{font:900 clamp(11px,2vh,17px)/1 var(--bfx-dsp);font-style:italic;color:#fff}
.bfx-place .sfx span{font:800 7px/1 var(--bfx-ui);letter-spacing:.22em;color:var(--dim2);margin-top:5px}
.bfx-lapbox{padding:6px 10px 7px;border-radius:12px;border-left:2px solid var(--cy);
  background:linear-gradient(140deg,rgba(24,11,46,.76),rgba(8,4,18,.62));
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
  border-top:1px solid var(--gl);border-right:1px solid var(--gl);border-bottom:1px solid var(--gl);
  box-shadow:0 10px 26px rgba(0,0,0,.5);flex:0 1 auto;min-width:0;width:max-content;max-width:100%}
.bfx-lapbox .tn{font:800 7px/1 var(--bfx-ui);letter-spacing:.2em;color:var(--pur3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;text-transform:uppercase}
.bfx-lapbox .r1{display:flex;align-items:baseline;gap:4px;margin-top:4px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.bfx-lapbox .r1 .lp{font:900 clamp(15px,2.8vh,24px)/1 var(--bfx-dsp);font-style:italic}
.bfx-lapbox .r1 .lps{font:800 8px/1 var(--bfx-ui);letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.bfx-lapbox .r1 .tt{margin-left:auto;padding-left:10px;white-space:nowrap;
  font:900 clamp(11px,1.9vh,15px)/1 var(--bfx-ui);letter-spacing:.01em}
.bfx-lapbox .r2{display:flex;align-items:baseline;gap:5px;margin-top:4px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.bfx-lapbox .r2 i{font:700 7px/1 var(--bfx-ui);font-style:normal;color:var(--dim2);letter-spacing:.1em}
.bfx-lapbox .r2 b{font:800 9.5px/1 var(--bfx-ui);color:#cfc5e2;white-space:nowrap}
.bfx-lapbox .r2 .bst{color:var(--lime)}
.bfx-lapbox .r2 .dl{margin-left:auto;font-weight:900;font-size:9px;letter-spacing:.04em}
.bfx-lapbox .dl.neg{color:var(--lime)}.bfx-lapbox .dl.pos{color:var(--orange)}

/* item slot */
.bfx-slot{position:relative;flex:0 0 auto;width:clamp(50px,10vh,74px);height:clamp(50px,10vh,74px);border-radius:16px;
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,rgba(48,22,82,.72),rgba(10,5,22,.72));
  border:1px solid rgba(199,155,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16);transition:box-shadow .3s,border-color .3s}
.bfx-slot .gl{position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at 50% 45%,rgba(156,93,217,.55),transparent 68%)}
.bfx-slot .ic{font:400 clamp(21px,4.4vh,36px)/1 var(--bfx-ui);position:relative;z-index:2;
  text-shadow:0 2px 10px rgba(0,0,0,.6);transition:transform .18s}
.bfx-slot .nm{position:absolute;left:0;right:0;bottom:3px;text-align:center;z-index:3;
  font:800 6.5px/1 var(--bfx-ui);letter-spacing:.11em;color:rgba(255,255,255,.72);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.bfx-slot .ch{position:absolute;right:4px;top:3px;z-index:3;font:900 9px/1 var(--bfx-dsp);font-style:italic;color:var(--gold)}
.bfx-slot.has{border-color:rgba(255,255,255,.55)}
.bfx-slot.has .gl{opacity:1}
.bfx-slot.roll .ic{animation:bfxRoll .09s steps(1) infinite}
@keyframes bfxRoll{0%{transform:translateY(-3px) scale(.92);opacity:.65}50%{transform:translateY(3px) scale(1.05);opacity:1}100%{transform:translateY(-3px) scale(.92);opacity:.65}}
.bfx-slot.lock{animation:bfxLock .5s cubic-bezier(.15,1.6,.4,1)}
@keyframes bfxLock{0%{transform:scale(1.32);filter:brightness(2.6)}55%{transform:scale(.95)}100%{transform:scale(1);filter:none}}
.bfx-slot .rings{position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;opacity:0;
  border:2px solid var(--cy)}
.bfx-slot.lock .rings{animation:bfxRing .55s ease-out}
@keyframes bfxRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}

/* position list */
.bfx-poslist{width:clamp(118px,17vw,172px);padding:6px;border-radius:13px;
  background:linear-gradient(150deg,rgba(20,10,40,.66),rgba(7,3,16,.56));
  border:1px solid var(--gl);backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);box-shadow:0 12px 30px rgba(0,0,0,.45);
  display:flex;flex-direction:column;gap:2px}
.bfx-prow{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:7px;min-width:0;
  transition:background .25s,transform .25s}
.bfx-prow i{width:12px;text-align:right;font:900 9px/1 var(--bfx-dsp);font-style:italic;color:var(--dim2);flex:0 0 auto}
.bfx-prow u{width:4px;height:12px;border-radius:2px;flex:0 0 auto;text-decoration:none;background:#fff}
.bfx-prow b{flex:1 1 auto;min-width:0;font:800 9px/1.2 var(--bfx-ui);letter-spacing:.08em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e6def5;text-transform:uppercase}
.bfx-prow s{font:700 8px/1 var(--bfx-ui);text-decoration:none;color:var(--dim2);
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.bfx-prow.me{background:linear-gradient(90deg,rgba(34,211,238,.24),rgba(240,38,160,.14));transform:translateX(-3px)}
.bfx-prow.me i,.bfx-prow.me b{color:#fff}
.bfx-prow.me s{color:var(--cy2)}

/* speedometer cluster */
.bfx-cluster{display:flex;align-items:flex-end;gap:10px}
.bfx-speedo{position:relative;width:clamp(62px,15vh,132px);height:clamp(62px,15vh,132px);
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.bfx-speedo svg{display:block;width:100%;height:100%;overflow:visible}
.bfx-speedo .kmh{font:900 26px/1 var(--bfx-dsp);font-style:italic;fill:#fff}
.bfx-speedo .unit{font:800 6.5px/1 var(--bfx-ui);letter-spacing:.24em;fill:#a99bc4}
.bfx-needle{transition:none}
.bfx-meters{display:flex;flex-direction:column;gap:5px;width:clamp(84px,15vw,160px);padding-bottom:4px}
.bfx-meter{position:relative}
.bfx-meter .lb{display:flex;justify-content:space-between;font:800 7px/1 var(--bfx-ui);
  letter-spacing:.18em;color:var(--dim2);margin-bottom:4px}
.bfx-meter .lb em{font-style:normal;color:var(--cy);transition:color .2s}
.bfx-track{height:7px;border-radius:5px;background:rgba(3,1,10,.7);overflow:hidden;position:relative;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.07)}
.bfx-track i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;transition:width .06s linear}
#bfx-driftfill{background:linear-gradient(90deg,#8fd8ff,#22d3ee);box-shadow:0 0 12px rgba(34,211,238,.9)}
#bfx-driftfill.s1{background:linear-gradient(90deg,#ffd98f,var(--gold));box-shadow:0 0 14px rgba(255,198,59,.95)}
#bfx-driftfill.s2{background:linear-gradient(90deg,#ff8ad0,var(--mag));box-shadow:0 0 16px rgba(240,38,160,1)}
#bfx-driftfill.s3{background:linear-gradient(90deg,#b6f7ff,#fff);box-shadow:0 0 22px rgba(255,255,255,1)}
#bfx-boostfill{background:linear-gradient(90deg,var(--pur2),var(--cy));box-shadow:0 0 12px rgba(156,93,217,.9)}
.bfx-meter.hot .bfx-track{animation:bfxHot .3s ease-in-out infinite}
@keyframes bfxHot{0%,100%{box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.07)}
 50%{box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.4),0 0 14px rgba(255,255,255,.35)}}

/* minimap */
.bfx-map{position:relative;width:clamp(66px,13vh,124px);height:clamp(52px,10.6vh,102px);border-radius:13px;
  overflow:hidden;background:linear-gradient(150deg,rgba(18,8,36,.6),rgba(6,3,14,.5));
  border:1px solid var(--gl);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 10px 26px rgba(0,0,0,.45)}
.bfx-map canvas{display:block;width:100%;height:100%}

/* ---------------------------------------------------------- the SAFE STRIP */
/* Everything transient lives here. Pinned to the top band so it can never     */
/* cover the centre 60% of the viewport.                                       */
.bfx-strip{position:absolute;left:0;right:0;top:calc(var(--safeT) + 1.2vh);
  height:auto;max-height:calc(18vh + var(--safeT));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;
  pointer-events:none;z-index:46;padding:0 24%;overflow:visible}
/* never let the column crush a banner's type -- on a 390px-tall phone the old
   fixed-height strip squashed every child and sheared the text in half. */
.bfx-strip>*{flex:0 0 auto}
.bfx-count{position:absolute;left:0;right:0;top:0;text-align:center;
  font:900 min(13vh,112px)/.80 var(--bfx-dsp);font-style:italic;letter-spacing:-.05em;color:#fff;
  text-shadow:0 0 42px rgba(34,211,238,.95),0 0 90px rgba(240,38,160,.6),0 8px 26px rgba(0,0,0,.8);
  opacity:0;transform:scale(2.1);will-change:transform,opacity}
.bfx-count.go{animation:bfxCount .82s cubic-bezier(.16,1.2,.3,1) both}
.bfx-count.gogo{background:linear-gradient(100deg,var(--cy2),#fff 40%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 32px rgba(34,211,238,.9))}
@keyframes bfxCount{0%{opacity:0;transform:scale(2.3) rotate(-7deg)}
 22%{opacity:1;transform:scale(1) rotate(0)}70%{opacity:1;transform:scale(1.02)}
 100%{opacity:0;transform:scale(.72)}}
.bfx-banner{position:relative;max-width:100%;padding:7px 18px 8px;border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transform:translateY(-14px) scale(.96);
  background:linear-gradient(120deg,rgba(28,12,54,.86),rgba(9,4,20,.74));
  border:1px solid rgba(199,155,255,.4);backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:0 16px 40px rgba(0,0,0,.6);
  will-change:transform,opacity}
.bfx-banner.on{animation:bfxBan 300ms cubic-bezier(.16,1.3,.3,1) both}
.bfx-banner.bye{animation:bfxBanOut 260ms ease-in both}
@keyframes bfxBan{from{opacity:0;transform:translateY(-16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes bfxBanOut{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.bfx-banner .bt{font:900 clamp(13px,2.7vh,26px)/1.06 var(--bfx-dsp);font-style:italic;letter-spacing:-.01em;
  text-transform:uppercase;white-space:nowrap;overflow:visible}
.bfx-banner .bs{font:800 8px/1 var(--bfx-ui);letter-spacing:.24em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.bfx-banner .sweep{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 34%,rgba(255,255,255,.22) 50%,transparent 66%);
  background-size:260% 100%;animation:bfxShift 1.5s linear infinite}
.bfx-banner.k-lap{border-color:rgba(34,211,238,.6)}
.bfx-banner.k-lap .bt{color:var(--cy2)}
.bfx-banner.k-finalLap{border-color:rgba(240,38,160,.75);
  box-shadow:0 16px 46px rgba(240,38,160,.35),0 0 30px rgba(240,38,160,.35)}
.bfx-banner.k-finalLap .bt{background:linear-gradient(100deg,var(--mag),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.bfx-banner.k-boost{border-color:rgba(255,198,59,.75)}
.bfx-banner.k-boost .bt{color:var(--gold)}
.bfx-banner.k-record{border-color:rgba(130,240,92,.7)}
.bfx-banner.k-record .bt{color:var(--lime)}
.bfx-banner.k-wrongway{border-color:rgba(239,56,68,.85);animation:bfxBan .3s both,bfxWrong .55s linear infinite .3s}
.bfx-banner.k-wrongway .bt{color:#ff8b8b}
@keyframes bfxWrong{0%,100%{box-shadow:0 16px 40px rgba(0,0,0,.6)}50%{box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 34px rgba(239,56,68,.75)}}
.bfx-banner.k-place .bt{color:var(--gold)}
.bfx-toast{padding:6px 15px;border-radius:9px;font:800 10px/1 var(--bfx-ui);letter-spacing:.14em;
  text-transform:uppercase;color:var(--cy2);opacity:0;white-space:nowrap;
  background:rgba(9,4,20,.8);border:1px solid rgba(126,240,255,.3);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px)}
.bfx-toast.on{animation:bfxBan .26s both}
.bfx-toast.bye{animation:bfxBanOut .24s both}
.bfx-toast.k-warn{color:var(--orange);border-color:rgba(255,122,46,.45)}
.bfx-toast.k-good{color:var(--lime);border-color:rgba(130,240,92,.45)}

/* --------------------------------------------------------- touch controls */
.bfx-ctl{position:absolute;inset:0;pointer-events:none;z-index:30;display:none}
.bfx-ctl.on{display:block}
/* the invisible wide steer zone: the entire left half, full height */
#bfx-padzone{position:absolute;left:0;top:0;bottom:0;width:52%;pointer-events:auto;touch-action:none;
  background:transparent}
#bfx-padzone.hint:after{content:'DRAG TO STEER';white-space:nowrap;position:absolute;
  left:calc(var(--safeL) + 14px);top:50%;transform:translateY(-50%);text-align:left;
  font:800 9px/1 var(--bfx-ui);letter-spacing:.2em;color:rgba(199,155,255,.5);
  animation:bfxPulse 2.4s ease-in-out infinite}
#bfx-thumb{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;opacity:0;
  transition:opacity .16s ease;z-index:31;will-change:transform,opacity}
#bfx-thumb.on{opacity:1}
#bfx-thumb .ring{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;
  border-radius:50%;border:1.5px solid rgba(199,155,255,.34);
  background:radial-gradient(circle,rgba(110,47,168,.22),rgba(110,47,168,.04) 62%,transparent 74%);
  box-shadow:0 0 30px rgba(110,47,168,.28),inset 0 0 26px rgba(34,211,238,.09)}
#bfx-thumb .rail{position:absolute;left:50%;top:50%;width:132px;height:3px;margin:-1.5px 0 0 -66px;border-radius:3px;
  background:linear-gradient(90deg,rgba(34,211,238,.34),rgba(255,255,255,.18) 50%,rgba(240,38,160,.34))}
#bfx-thumb .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.92),rgba(156,93,217,.8) 46%,rgba(46,17,84,.9));
  border:1.5px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 26px rgba(156,93,217,.6);
  will-change:transform}
#bfx-thumb .knob:after{content:'';position:absolute;inset:34%;border-radius:50%;background:rgba(255,255,255,.85);
  box-shadow:0 0 12px rgba(255,255,255,.9)}
#bfx-thumb .arrow{position:absolute;top:50%;width:0;height:0;margin-top:-9px;
  border-top:9px solid transparent;border-bottom:9px solid transparent;opacity:.28;transition:opacity .12s}
#bfx-thumb .arrow.l{left:50%;margin-left:-84px;border-right:13px solid var(--cy)}
#bfx-thumb .arrow.r{left:50%;margin-left:71px;border-left:13px solid var(--mag)}
#bfx-thumb.lft .arrow.l{opacity:1;filter:drop-shadow(0 0 8px var(--cy))}
#bfx-thumb.rgt .arrow.r{opacity:1;filter:drop-shadow(0 0 8px var(--mag))}

.bfx-steerbtns{position:absolute;left:calc(var(--safeL) + 12px);bottom:calc(var(--safeB) + 12px);
  display:none;gap:12px;pointer-events:auto;z-index:32}
.bfx-ctl.buttons .bfx-steerbtns{display:flex}
/* in the digital scheme the thumb owns the bottom-left corner, so lift the
   minimap/speedo cluster clear of it instead of stacking them on top. */
#bfx-root[data-ctl="buttons"] .bfx-bl{bottom:calc(var(--safeB) + 24px + clamp(68px,13.5vh,88px))}
.bfx-sbtn{width:clamp(80px,15.5vh,104px);height:clamp(68px,13.5vh,88px);border-radius:20px;display:grid;place-items:center;
  font:400 clamp(26px,5vh,36px)/1 var(--bfx-ui);color:#e9e2f8;pointer-events:auto;touch-action:none;
  background:linear-gradient(155deg,rgba(52,25,92,.82),rgba(12,6,26,.72));
  border:1px solid rgba(199,155,255,.42);border-bottom:3px solid rgba(110,47,168,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .08s,background .1s,box-shadow .1s}
.bfx-sbtn.press{background:linear-gradient(150deg,var(--cy),#2b8fd8);color:#05121f;border-color:#dffaff;
  transform:translateY(3px) scale(.97);box-shadow:0 0 30px rgba(34,211,238,.6)}
.bfx-acts{position:absolute;right:calc(var(--safeR) + 14px);bottom:calc(var(--safeB) + 12px);
  display:flex;align-items:flex-end;gap:clamp(8px,1.5vw,14px);pointer-events:auto;z-index:32}
.bfx-abtn{border-radius:50%;display:grid;place-items:center;text-align:center;pointer-events:auto;touch-action:none;
  position:relative;overflow:hidden;transition:transform .08s,box-shadow .12s,background .12s;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bfx-abtn small{display:block;max-width:92%;margin:3px auto 0;font:900 7px/1 var(--bfx-ui);letter-spacing:.09em;
  opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bfx-brake{width:clamp(58px,11.5vh,72px);height:clamp(58px,11.5vh,72px);
  font:900 9px/1 var(--bfx-ui);letter-spacing:.04em;color:#ffd2d2;
  background:linear-gradient(150deg,rgba(72,18,34,.8),rgba(18,5,14,.7));
  border:1px solid rgba(239,56,68,.45);box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
#bfx-brake.press{background:linear-gradient(150deg,#ff5a68,#b51226);color:#fff;transform:scale(.93);
  box-shadow:0 0 28px rgba(239,56,68,.7)}
#bfx-drift{width:clamp(84px,18vh,112px);height:clamp(84px,18vh,112px);
  font:900 clamp(12px,2vh,15px)/1 var(--bfx-dsp);font-style:italic;letter-spacing:.04em;color:#e6f9ff;
  background:linear-gradient(150deg,rgba(18,52,86,.84),rgba(8,14,40,.74));
  border:1px solid rgba(126,240,255,.5);
  box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2)}
#bfx-drift:after{content:'';position:absolute;inset:-1px;border-radius:50%;pointer-events:none;
  border:2px solid transparent;transition:border-color .2s}
#bfx-drift.press{background:linear-gradient(150deg,var(--cy),#1571a8);color:#04141f;transform:scale(.94);
  box-shadow:0 0 34px rgba(34,211,238,.72)}
#bfx-drift.st1:after{border-color:var(--cy)}
#bfx-drift.st2:after{border-color:var(--gold);box-shadow:0 0 22px rgba(255,198,59,.6)}
#bfx-drift.st3:after{border-color:var(--mag);box-shadow:0 0 26px rgba(240,38,160,.75)}
#bfx-item{width:clamp(68px,15vh,94px);height:clamp(68px,15vh,94px);
  background:linear-gradient(150deg,rgba(54,26,96,.84),rgba(14,7,30,.76));
  border:2px solid rgba(199,155,255,.5);
  box-shadow:0 10px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2)}
#bfx-item b{display:block;font:400 clamp(26px,5vh,36px)/1 var(--bfx-ui);text-shadow:0 2px 10px rgba(0,0,0,.6)}
#bfx-item small{color:rgba(255,255,255,.75)}
#bfx-item.has{border-color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 34px rgba(156,93,217,.65),inset 0 1px 0 rgba(255,255,255,.35);
  animation:bfxItemRdy 1.9s ease-in-out infinite}
@keyframes bfxItemRdy{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
#bfx-item.press{transform:scale(.93);box-shadow:0 0 36px rgba(199,155,255,.8)}
#bfx-item.roll b{animation:bfxRoll .08s steps(1) infinite}
.bfx-gas{display:none}
.bfx-ctl.gas .bfx-gas{display:grid;width:clamp(64px,12.5vh,84px);height:clamp(64px,12.5vh,84px);
  font:900 10px/1 var(--bfx-ui);letter-spacing:.1em;color:#d9ffe6;
  background:linear-gradient(150deg,rgba(20,70,42,.8),rgba(6,20,14,.7));border:1px solid rgba(130,240,92,.45);
  box-shadow:0 8px 22px rgba(0,0,0,.5)}
.bfx-gas.press{background:linear-gradient(150deg,#7ef07c,#1d9c4c);color:#04210f;transform:scale(.93)}
.bfx-khint{position:absolute;left:50%;bottom:calc(var(--safeB) + 8px);transform:translateX(-50%);
  font:700 8.5px/1 var(--bfx-ui);letter-spacing:.14em;color:rgba(200,190,220,.42);white-space:nowrap;
  display:flex;gap:16px;pointer-events:none;z-index:20}
.bfx-khint b{color:rgba(255,255,255,.72);font-weight:900}

/* ---------------------------------------------------------------- overlays */
.bfx-modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  padding:calc(var(--safeT) + 12px) calc(var(--safeR) + 16px) calc(var(--safeB) + 12px) calc(var(--safeL) + 16px);
  background:rgba(4,2,10,.62);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);
  pointer-events:auto;z-index:60}
.bfx-modal.on{display:flex;animation:bfxIn .3s cubic-bezier(.2,.9,.25,1) both}
.bfx-card{width:min(560px,94%);max-height:100%;overflow:hidden;display:flex;flex-direction:column;
  padding:clamp(14px,3vh,28px);border-radius:22px;
  background:linear-gradient(158deg,rgba(54,26,92,.82),rgba(10,5,20,.9));
  border:1px solid rgba(199,155,255,.26);box-shadow:0 34px 90px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.16)}
.bfx-card.wide{width:min(860px,96%)}
.bfx-card .hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:clamp(8px,1.6vh,16px)}
.bfx-card .hd .bfx-h2{flex:1 1 auto}
.bfx-rows{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0;margin:clamp(6px,1.4vh,14px) 0;
  padding-bottom:10px;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 12px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 12px),transparent 100%)}
.bfx-rrow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:9px;min-width:0;
  background:rgba(255,255,255,.035);opacity:0;transform:translateX(-14px)}
.bfx-rrow.in{animation:bfxRow .38s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes bfxRow{to{opacity:1;transform:none}}
.bfx-rrow>i{width:22px;text-align:center;font:900 13px/1 var(--bfx-dsp);font-style:italic;color:var(--dim2);flex:0 0 auto}
.bfx-rrow>u{width:4px;height:17px;border-radius:2px;text-decoration:none;flex:0 0 auto;background:#fff}
.bfx-rrow>b{flex:1 1 auto;min-width:0;font:900 12px/1 var(--bfx-dsp);font-style:italic;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfx-rrow>s{text-decoration:none;font:700 11px/1 var(--bfx-ui);color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.bfx-rrow>em{font:900 11px/1 var(--bfx-dsp);font-style:italic;color:var(--gold);flex:0 0 auto;min-width:34px;text-align:right}
.bfx-rrow.me{background:linear-gradient(90deg,rgba(34,211,238,.2),rgba(240,38,160,.12));
  box-shadow:inset 0 0 0 1px rgba(34,211,238,.28)}
.bfx-rrow.me>b,.bfx-rrow.me>i{color:#fff}
.bfx-rrow.p1>i{color:var(--gold)}.bfx-rrow.p2>i{color:#cfd7e3}.bfx-rrow.p3>i{color:#d9924e}
.bfx-acts2{display:flex;gap:9px;flex-wrap:wrap;flex:0 0 auto}
.bfx-acts2 .bfx-btn{flex:1 1 150px;text-align:left}
/* stacked variant: in a column, flex-basis is a HEIGHT, so 1 1 150px made every
   button 150px tall and pushed the rest of the menu off the bottom of a phone. */
.bfx-acts2.col{flex-direction:column;flex-wrap:nowrap}
.bfx-acts2.col .bfx-btn{flex:0 0 auto;width:100%}
.bfx-bigplace{font:900 clamp(34px,8vh,74px)/.86 var(--bfx-dsp);font-style:italic;letter-spacing:-.04em;
  background:linear-gradient(150deg,#fff,var(--gold) 55%,#ff8a2e);-webkit-background-clip:text;background-clip:text;
  color:transparent;margin:2px 0 4px;animation:bfxPop .6s cubic-bezier(.2,1.5,.35,1)}
.bfx-timerow{display:flex;gap:clamp(10px,2vw,26px);flex-wrap:wrap;margin:6px 0 2px}
.bfx-timerow div{min-width:0}
.bfx-timerow span{display:block;font:800 7.5px/1 var(--bfx-ui);letter-spacing:.2em;color:var(--dim2);margin-bottom:4px}
.bfx-timerow b{font:900 clamp(12px,2vh,18px)/1 var(--bfx-ui);font-variant-numeric:tabular-nums}
.bfx-timerow b.best{color:var(--lime)}

/* trophy */
.bfx-trophy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(4px,1.2vh,12px)}
.bfx-cupart{width:clamp(72px,16vh,128px);height:clamp(72px,16vh,128px);position:relative;
  display:grid;place-items:center;font-size:clamp(46px,10vh,84px);
  filter:drop-shadow(0 12px 30px rgba(0,0,0,.6));animation:bfxFloat 3.4s ease-in-out infinite}
@keyframes bfxFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.bfx-cupart:before{content:'';position:absolute;inset:-22%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,198,59,.4),transparent 66%);animation:bfxPulse 2.6s ease-in-out infinite}
.bfx-podium{position:relative;display:flex;align-items:flex-end;gap:8px;justify-content:center;width:100%;
  margin:6px 0 4px;padding-bottom:3px}
/* a floor line, so the open-bottomed podium blocks read as standing on
   something instead of looking clipped by whatever sits underneath */
.bfx-podium:after{content:'';position:absolute;left:6%;right:6%;bottom:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(199,155,255,.6) 20%,rgba(199,155,255,.6) 80%,transparent);
  box-shadow:0 0 14px rgba(156,93,217,.5)}
.bfx-pod{flex:1 1 0;max-width:118px;border-radius:10px 10px 0 0;padding:8px 5px 9px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);border-bottom:0;transform-origin:bottom;animation:bfxRise .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes bfxRise{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.bfx-pod b{display:block;font:900 11px/1 var(--bfx-dsp);font-style:italic;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfx-pod i{display:block;font:900 15px/1 var(--bfx-dsp);font-style:italic;margin-bottom:5px}
.bfx-pod.g{height:clamp(58px,11vh,96px);background:linear-gradient(180deg,rgba(255,198,59,.4),rgba(255,198,59,.06))}
.bfx-pod.g i{color:var(--gold)}
.bfx-pod.s{height:clamp(44px,8.4vh,74px);background:linear-gradient(180deg,rgba(207,215,227,.34),rgba(207,215,227,.05))}
.bfx-pod.b{height:clamp(36px,7vh,60px);background:linear-gradient(180deg,rgba(205,127,68,.34),rgba(205,127,68,.05))}
.bfx-conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bfx-conf i{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;opacity:.9;
  animation:bfxFall linear infinite}
@keyframes bfxFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(112vh) rotate(760deg)}}

/* settings */
.bfx-set{display:flex;flex-direction:column;gap:clamp(6px,1.3vh,13px);overflow-y:auto;min-height:0;touch-action:pan-y;
  padding:0 4px 12px 0;
  /* soft bottom edge so a clipped row reads as "there is more below" */
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 14px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 14px),transparent 100%)}
.bfx-srow{display:flex;align-items:center;gap:12px;padding:clamp(7px,1.3vh,12px) clamp(9px,1.4vw,14px);
  border-radius:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.bfx-srow>div:first-child{flex:1 1 auto;min-width:0}
.bfx-srow h4{margin:0;font:900 11px/1 var(--bfx-dsp);font-style:italic;text-transform:uppercase;letter-spacing:.02em}
.bfx-srow p{margin:4px 0 0;font-size:10px;color:var(--dim2);line-height:1.4}
.bfx-seg{display:flex;gap:4px;padding:3px;border-radius:11px;background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.08);flex:0 0 auto}
.bfx-seg button{padding:7px 11px;border-radius:8px;font:900 9px/1 var(--bfx-ui);letter-spacing:.12em;
  color:var(--dim);transition:.16s;white-space:nowrap}
.bfx-seg button.on{background:linear-gradient(130deg,var(--pur2),var(--pur));color:#fff;
  box-shadow:0 0 16px rgba(156,93,217,.5)}
.bfx-slider{-webkit-appearance:none;appearance:none;width:clamp(96px,16vw,160px);height:5px;border-radius:5px;
  background:rgba(255,255,255,.14);outline:none;flex:0 0 auto}
.bfx-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(140deg,#fff,var(--pur2));border:1px solid rgba(255,255,255,.8);
  box-shadow:0 0 14px rgba(156,93,217,.8);cursor:pointer}
.bfx-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:1px solid #fff;
  background:var(--pur2);box-shadow:0 0 14px rgba(156,93,217,.8);cursor:pointer}
.bfx-sw{width:52px;height:28px;border-radius:15px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);
  position:relative;flex:0 0 auto;transition:background .22s,border-color .22s}
.bfx-sw:after{content:'';position:absolute;left:3px;top:2px;width:22px;height:22px;border-radius:50%;
  background:linear-gradient(140deg,#fff,#c3b6dc);box-shadow:0 2px 8px rgba(0,0,0,.6);transition:transform .22s cubic-bezier(.2,1.2,.3,1)}
.bfx-sw.on{background:linear-gradient(120deg,var(--pur),var(--cy));border-color:rgba(255,255,255,.5)}
.bfx-sw.on:after{transform:translateX(24px)}

/* rotate nudge */
#bfx-rotate{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;background:linear-gradient(165deg,#170a2e,#07040e);z-index:90;pointer-events:auto;
  padding:30px}
#bfx-rotate.on{display:flex}
#bfx-rotate .ph{width:74px;height:120px;border-radius:14px;border:3px solid var(--pur3);position:relative;
  animation:bfxRot 2.4s cubic-bezier(.6,0,.3,1) infinite}
#bfx-rotate .ph:after{content:'';position:absolute;left:50%;bottom:7px;width:22px;height:3px;margin-left:-11px;
  border-radius:3px;background:var(--pur3)}
@keyframes bfxRot{0%,22%{transform:rotate(0)}52%,100%{transform:rotate(-90deg)}}

/* ------------------------------------------------------------ small screens */
@media (max-height:520px){
  .bfx-screen{padding:calc(var(--safeT) + 6px) calc(var(--safeR) + 14px) calc(var(--safeB) + 8px) calc(var(--safeL) + 14px)}
  .bfx-hero{max-width:64%}
  .bfx-fcap p{display:none}
  .bfx-tip{min-height:1.4em}
  /* THE CENTRE-60% RULE.  On a 390px-tall phone 20% of the height is only
     78px, so the worst case (persistent wrong-way banner + a lap banner +
     a toast) has to be compacted or it dips into the driver's view. */
  .bfx-strip{padding:0 20%;gap:3px;top:calc(var(--safeT) + 4px)}
  .bfx-banner{padding:4px 14px 5px;border-radius:10px}
  .bfx-banner .bt{font-size:13px;line-height:1.05}
  .bfx-banner .bs{display:none}
  .bfx-toast{padding:3px 11px;font-size:8.5px;border-radius:8px}
  /* modals: a landscape phone is ~390px tall.  Tighten every band so the
     action buttons never fall off the bottom of the card. */
  .bfx-modal{padding:calc(var(--safeT) + 8px) calc(var(--safeR) + 12px) calc(var(--safeB) + 8px) calc(var(--safeL) + 12px)}
  .bfx-card{padding:12px 14px;border-radius:18px}
  .bfx-card .hd{margin-bottom:6px}
  .bfx-rows{margin:6px 0}
  .bfx-srow{padding:6px 10px;gap:9px}
  .bfx-srow p{margin-top:2px;font-size:9px;line-height:1.3}
  .bfx-set{gap:5px}
  .bfx-acts2{gap:6px}
  .bfx-acts2.col .bfx-btn{min-height:40px;padding:9px 14px}
  .bfx-acts2.col .bfx-btn.pri{min-height:44px;padding:11px 16px}
  .bfx-timerow{gap:clamp(8px,1.6vw,18px);margin:4px 0 0}
  .bfx-trophy{gap:4px}
  /* podium blocks were shorter than their own contents on a phone */
  .bfx-pod{padding:6px 5px 7px}
  .bfx-pod i{font-size:13px;margin-bottom:3px}
  .bfx-pod b{font-size:10px}
  .bfx-pod.g{height:62px}.bfx-pod.s{height:52px}.bfx-pod.b{height:44px}
  /* track cards: a fixed 16:9 thumbnail plus a caption does not fit two rows
     into a 390px-tall phone, and the caption (the circuit NAME) was the part
     that got clipped away.  Let the thumbnail take whatever height is left. */
  .bfx-tracks{grid-auto-rows:minmax(0,1fr)}
  .bfx-tcard .vis{flex:1 1 auto;aspect-ratio:auto;min-height:26px}
  .bfx-tcard .inf{flex:0 0 auto;padding:5px 8px 6px;gap:2px}
  .bfx-tcard .inf strong{font-size:11px}
  .bfx-tcard .inf small{font-size:7px;gap:7px}
  .bfx-tcard .no{font-size:7px;padding:2px 4px}
}
@media (max-width:860px){
  .bfx-poslist{width:clamp(104px,20vw,140px)}
  .bfx-lapbox{min-width:96px}
  .bfx-strip{padding:0 23%}
}
@media (max-width:620px){
  .bfx-garage{grid-template-columns:1fr;grid-template-rows:minmax(0,1.1fr) minmax(0,1fr)}
  .bfx-cards{grid-template-columns:repeat(4,minmax(0,1fr))}
  .bfx-tracks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bfx-modes{flex-direction:column;flex:0 0 auto;justify-content:flex-start}
  /* stacked mode cards must hug their content -- flex:1 1 0 in a column made
     each one a third of a 844px-tall phone with an ocean of empty glass. */
  .bfx-mode{flex:0 0 auto;min-height:0;padding:14px 16px;
    flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
  .bfx-mode .glyph{margin:0;font-size:28px;flex:0 0 auto}
  .bfx-mode h3{flex:1 1 auto}
  .bfx-mode .go{opacity:1;transform:none;flex:0 0 auto}
  .bfx-mode p{flex:1 1 100%;margin:0;font-size:11px}
  .bfx-mode:hover,.bfx-mode.sel{transform:none}
  .bfx-cups{flex-direction:column}
  .bfx-hero{max-width:100%}
  /* stacked garage: the driver portrait and the bio were fighting for the
     same pixels, so shrink the portrait and cap the bio to three lines. */
  #bfx-preview{height:40%}
  .bfx-avatar{width:min(34%,132px);top:4%;font-size:clamp(24px,5vh,40px)}
  .bfx-halo{width:min(46%,180px);top:2%}
  .bfx-fcap h3{font-size:clamp(20px,3.6vh,32px)}
  .bfx-fcap p{max-width:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .bfx-stats{font-size:8px;gap:12px}
  .bfx-strip{padding:0 6%}
  .bfx-khint{display:none}
}
@media (max-height:400px){
  .bfx-strip{gap:2px;top:calc(var(--safeT) + 2px)}
  .bfx-toast{font-size:8px;padding:2px 9px;letter-spacing:.1em}
  .bfx-banner{padding:3px 12px 4px}
  .bfx-banner .bt{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  #bfx-root *,#bfx-root *:before,#bfx-root *:after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.06s!important}
}

  /* =========================================================================
     SMALL DRAWING HELPERS (thumbnails + minimap + speedo geometry)
     ========================================================================= */
  function polar(cx, cy, r, deg) {
    var a = (deg - 90) * M.PI / 180;
    return [cx + r * M.cos(a), cy + r * M.sin(a)];
  }
  function arcPath(cx, cy, r, a0, a1) {
    var s = polar(cx, cy, r, a0), e = polar(cx, cy, r, a1);
    var large = (a1 - a0) % 360 > 180 ? 1 : 0;
    return 'M' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) +
      'A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2);
  }

  /* Catmull-Rom resample of a closed node loop -> [[x,z],...] */
  function loopPoints(nodes, samples) {
    var pts = [], n = nodes.length, i, j, t, p0, p1, p2, p3, x, z, tt, ttt;
    if (!n) return pts;
    samples = samples || 12;
    for (i = 0; i < n; i++) {
      p0 = nodes[(i - 1 + n) % n].p; p1 = nodes[i].p;
      p2 = nodes[(i + 1) % n].p; p3 = nodes[(i + 2) % n].p;
      for (j = 0; j < samples; j++) {
        t = j / samples; tt = t * t; ttt = tt * t;
        x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t +
          (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * tt +
          (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * ttt);
        z = 0.5 * ((2 * p1[2]) + (-p0[2] + p2[2]) * t +
          (2 * p0[2] - 5 * p1[2] + 4 * p2[2] - p3[2]) * tt +
          (-p0[2] + 3 * p1[2] - 3 * p2[2] + p3[2]) * ttt);
        pts.push([x, z]);
      }
    }
    return pts;
  }

  function fitPoints(pts, w, h, pad) {
    var i, minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (i = 0; i < pts.length; i++) {
      if (pts[i][0] < minX) minX = pts[i][0];
      if (pts[i][0] > maxX) maxX = pts[i][0];
      if (pts[i][1] < minZ) minZ = pts[i][1];
      if (pts[i][1] > maxZ) maxZ = pts[i][1];
    }
    var dx = M.max(1e-3, maxX - minX), dz = M.max(1e-3, maxZ - minZ);
    var sc = M.min((w - pad * 2) / dx, (h - pad * 2) / dz);
    var cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
    return { sc: sc, cx: cx, cz: cz, w: w, h: h };
  }
  function fitApply(f, x, z) { return [f.w / 2 + (x - f.cx) * f.sc, f.h / 2 + (z - f.cz) * f.sc]; }

  /* Track-select / cup thumbnail: neon ribbon of the circuit on its own sky */
  function drawThumb(canvas, track, w, h) {
    try {
      var ctx = canvas.getContext('2d');
      if (!ctx) return;
      var dpr = M.min(2, window.devicePixelRatio || 1);
      canvas.width = M.max(8, M.round(w * dpr));
      canvas.height = M.max(8, M.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var pal = (track && track.palette) || {};
      var neon = css(pal.neon || pal.railGlow || pal.accent, '#22D3EE');
      var sec = css(pal.secondary || pal.accent || pal.sun, '#9C5DD9');
      var skyA = css(pal.sky2 || pal.sky, '#2A1040');
      var skyB = css(pal.sky, '#0B0712');

      var g = ctx.createLinearGradient(0, 0, w * 0.5, h);
      g.addColorStop(0, skyA); g.addColorStop(1, skyB);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

      var rg = ctx.createRadialGradient(w * 0.72, h * 0.28, 2, w * 0.72, h * 0.28, w * 0.75);
      rg.addColorStop(0, rgba(pal.neon || [0.13, 0.83, 0.93], 0.42));
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);

      /* faint horizon grid */
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
      for (var gy = 1; gy < 6; gy++) {
        ctx.beginPath(); ctx.moveTo(0, h * gy / 6); ctx.lineTo(w, h * gy / 6); ctx.stroke();
      }

      var nodes = track && track.nodes;
      if (nodes && nodes.length > 2) {
        var pts = loopPoints(nodes, 10);
        var f = fitPoints(pts, w, h, M.max(7, w * 0.12));
        var i, xy;
        ctx.save();
        ctx.translate(w * 0.5, h * 0.5);
        ctx.rotate(-0.16);
        ctx.translate(-w * 0.5, -h * 0.5);
        ctx.beginPath();
        for (i = 0; i < pts.length; i++) {
          xy = fitApply(f, pts[i][0], pts[i][1]);
          if (i === 0) ctx.moveTo(xy[0], xy[1]); else ctx.lineTo(xy[0], xy[1]);

  /* ---------------------------------------------------------------- speedo */
  function speedoSVG() {
    var cx = 60, cy = 60, A0 = -132, A1 = 132, i, a, p1, p2;
    var ticks = '';
    for (i = 0; i <= 12; i++) {
      a = A0 + (A1 - A0) * i / 12;
      var major = (i % 3) === 0;
      p1 = polar(cx, cy, major ? 38.5 : 41.5, a);

        '" stroke-width="' + (major ? 1.9 : 1) + '" stroke-linecap="round"/>';
    }
    return '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<defs>' +

  /* =========================================================================
     SCREEN MANAGER
     ========================================================================= */
  function isOverlay(n) { return OVER.indexOf(n) >= 0; }

  function showBase(name) {
    var i, n, e;
    for (i = 0; i < BASE.length; i++) {
      n = BASE[i]; e = S[n];
      if (!e) continue;
      if (n === name) { e.classList.remove('out'); e.classList.add('on'); }
      else if (e.classList.contains('on')) { e.classList.remove('on'); e.classList.remove('out'); }
    }
    state.base = name;
    /* the animated backdrop is hidden behind the 3D scene during a race */
    if (S.fx) S.fx.classList.toggle('on', name !== 'race');
    state.inRace = (name === 'race');
    if (H.ctl) H.ctl.classList.toggle('on', name === 'race');
  }

  function showOverlay(name) {
    var i, n;
    for (i = 0; i < OVER.length; i++) {
      n = OVER[i];
      if (S[n]) S[n].classList.toggle('on', n === name);
    }
    state.overlay = name || '';
  }

  function goScreen(name, data) {
    try {
      if (!name) return;
      state.lastData = data || null;
      if (isOverlay(name)) {
        if (name === 'pause') fillPause(data);
        if (name === 'results') UI.results(data || {});
        if (name === 'standings') UI.standings(data || {});
        if (name === 'trophy') UI.trophy(data || {});
        if (name === 'settings') syncSettingsUI();
        showOverlay(name);
        state.screen = name;
        focusFirst(S[name]);
        return;
      }
      showOverlay('');
      /* per-screen population */
      if (name === 'racer') fillRacer(data);
      else if (name === 'cup') fillCups(data);
      else if (name === 'track') fillTracks(data);
      else if (name === 'loading') fillLoading(data);
      else if (name === 'race') enterRace(data);
      else if (name === 'title') { state.seenTitle = true; }
      showBase(name);
      state.screen = name;
      if (name !== 'race') focusFirst(S[name]);
      updateOrientation();
    } catch (e) { warn('screen', e); }
  }

  function focusFirst(scope) {
    try {
      if (!scope) return;
      navScope = scope;
      navItems = scope.querySelectorAll('.bfx-nav');
      navIdx = 0;
      clearNavFocus();
    } catch (e) {}
  }

  function warn(where, e) {
    try { if (window.console && console.warn) console.warn('[BFX.UI] ' + where, e && e.message ? e.message : e); } catch (x) {}
  }

  /* =========================================================================
     SCREEN POPULATION
     ========================================================================= */
  var thumbJobs = [];   /* {canvas, track} re-drawn on resize */

  function queueThumb(canvas, track) {
    thumbJobs.push({ c: canvas, t: track });
    requestAnimationFrame(function () {
      var w = canvas.clientWidth || 160, h = canvas.clientHeight || 90;
      drawThumb(canvas, track, w, h);
    });
  }
  function redrawThumbs() {
    for (var i = 0; i < thumbJobs.length; i++) {
      var j = thumbJobs[i];
      if (!j.c || !j.c.isConnected) continue;
      var w = j.c.clientWidth, h = j.c.clientHeight;
      if (w > 4 && h > 4) drawThumb(j.c, j.t, w, h);
    }
  }

  /* ------------------------------------------------------------ racer pick */
  var STAT_KEYS = [['SPEED', 'speed'], ['ACCEL', 'accel'], ['GRIP', 'grip'], ['WEIGHT', 'weight']];

  function fillRacer(data) {
    var list = (data && data.racers) || racers();
    if (!list.length) return;
    if (!state.racerId) state.racerId = list[0].id;
    if (data && data.selected) state.racerId = data.selected;
    var host2 = $('bfx-r-cards');
    if (!host2) return;
    if (host2.dataset.built !== String(list.length)) {
